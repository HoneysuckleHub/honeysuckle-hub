        const tomorrowName = getTomorrowWeekdayName(homeDay);

        const tomorrowPlan = weeklyPlan[tomorrowName] || {};

        const tomorrowDinner = tomorrowPlan.dinner ? getRecipe(tomorrowPlan.dinner) : null;

        const tomorrowMeats = tomorrowDinner

          ? tomorrowDinner.ingredients.filter(ing => categorizeIngredient(ing.name) === 'Meats & Seafood')

          : [];

        const thawReminderKey = `${homeDay}_thaw_reminder`;

        const isThawDone = !!checkedHomeMeals[thawReminderKey];



        const dailyResetTasks = roomTasks.filter(t => t.tier === 'daily');

        const dailyByRoom = dailyResetTasks.reduce((acc, t) => {

          if (!acc[t.roomName]) acc[t.roomName] = [];

          acc[t.roomName].push(t);

          return acc;

        }, {});



        const weeklyZoneTasks = roomTasks.filter(t => t.tier === 'weekly' && t.weeklyDay === homeDay);

        const weeklyZoneRooms = Array.from(new Set(weeklyZoneTasks.map(t => t.roomName)));



        const mealsDone = todaysMeals.filter(m => checkedHomeMeals[m.key]).length;

        const dailyDone = dailyResetTasks.filter(t => t.done).length;

        const zoneDone = weeklyZoneTasks.filter(t => t.done).length;

        const prioritiesDone = dailyPriorities.filter(p => p.done).length;



        const hasActiveWellness = !!(wellnessEnrollment && wellnessEnrollment.status === 'active');

        const wellnessTasksToday = hasActiveWellness && wellnessEnrollment.agreement_signed

          ? getCumulativeWellnessTasks(wellnessEnrollment)

          : [];

        const wellnessCheckedToday = hasActiveWellness ? getNormalizedCheckedToday(wellnessEnrollment) : [];

        const wellnessDoneToday = wellnessTasksToday.filter(t => wellnessCheckedToday.includes(t.id)).length;



        const totalTodayItems = todaysMeals.length + dailyResetTasks.length + weeklyZoneTasks.length + dailyPriorities.length + wellnessTasksToday.length;

        const completedTodayItems = mealsDone + dailyDone + zoneDone + prioritiesDone + wellnessDoneToday;

        const progressPct = totalTodayItems > 0 ? Math.round((completedTodayItems / totalTodayItems) * 100) : 0;



        const totalGroceryCount = groceryData.flatItems.length;

        const checkedGroceryCount = groceryData.flatItems.filter(i => checkedGroceryKeys[i.key]).length;

        const remainingGroceryCount = Math.max(0, totalGroceryCount - checkedGroceryCount);



        return (

          <div className="space-y-10">

            {/* Welcome & Progress Command Banner */}

            <div className="bg-white border border-[#4a4238]/10 rounded-2xl p-6 md:p-8 shadow-sm">

              <div className="flex flex-col lg:flex-row lg:items-center justify-between gap-6">

                <div>

                  <span className="text-xs font-lora font-bold text-[#798771] uppercase tracking-[0.2em] flex items-center gap-2 mb-2">

                    <Sun size={15} /> {todayFormatted}

                  </span>

                  <h2 className="font-playfair text-3xl md:text-4xl italic text-[#4a4238] mb-2">

                    Today&apos;s Command Center

                  </h2>

                  <p className="font-lora text-sm md:text-base text-[#4a4238]/70 max-w-xl">

                    Returning to what&apos;s real: home, food, &amp; faith. Everything you need for {homeDay} is gathered in one calm checklist below.

                  </p>

                </div>



                <div className="bg-[#fdfbf7] border border-[#4a4238]/10 rounded-xl p-5 min-w-[250px] space-y-3">

                  <div className="flex items-center justify-between font-lora text-sm">

                    <span className="text-[#4a4238]/70 font-medium">Daily Rhythm Progress</span>

                    <span className="font-bold text-[#798771]">{progressPct}%</span>

                  </div>

                  <div className="w-full h-2 bg-[#4a4238]/10 rounded-full overflow-hidden">

                    <div

                      className="h-full bg-[#798771] rounded-full transition-all duration-500"

                      style={{ width: `${progressPct}%` }}

                    />

                  </div>

                  <p className="font-lora text-xs text-[#4a4238]/60">

                    {completedTodayItems} of {totalTodayItems} tasks completed for {homeDay}

                  </p>

                </div>

              </div>



              {/* Day Switcher & Quick Links */}

              <div className="mt-6 pt-5 border-t border-[#4a4238]/10 flex flex-col md:flex-row md:items-center justify-between gap-4">

                <div className="flex items-center gap-1.5 flex-wrap">

                  <span className="font-lora text-xs uppercase tracking-wider font-bold text-[#4a4238]/50 mr-2">

                    Viewing Day:

                  </span>

                  {WEEKDAY_ORDER.map(day => (

                    <button

                      key={day}

                      type="button"

                      onClick={() => setHomeDay(day)}

                      className={`px-3 py-1.5 rounded-full text-xs font-lora font-bold transition-colors border ${

                        homeDay === day

                          ? 'bg-[#798771] text-white border-[#798771]'

                          : 'bg-[#fdfbf7] text-[#4a4238]/70 border-[#4a4238]/15 hover:border-[#798771]'

                      }`}

                    >

                      {day.slice(0, 3)}

                    </button>

                  ))}

                </div>



                <div className="flex flex-wrap gap-2">

                  <button

                    type="button"

                    onClick={jumpToGroceryList}

                    className="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-[#798771]/10 text-[#798771] border border-[#798771]/25 font-lora text-xs font-bold uppercase tracking-wider hover:bg-[#798771] hover:text-white transition-colors"

                  >

                    <ShoppingCart size={14} /> Grocery List ({remainingGroceryCount} left)

                  </button>

                  <button

                    type="button"

                    onClick={() => setActiveTab('kitchen')}

                    className="inline-flex items-center gap-1.5 px-4 py-2 rounded-full bg-[#fdfbf7] text-[#4a4238] border border-[#4a4238]/15 font-lora text-xs font-bold uppercase tracking-wider hover:border-[#798771] transition-colors"

                  >

                    Meal Planner <ArrowRight size={13} />

                  </button>

                </div>

              </div>

            </div>



            {/* Enrolled Wellness Hub Command Center Card (Auto-Appears Upon Enrollment) */}

            {hasActiveWellness && (

              <div className="bg-white border-2 border-[#798771]/45 rounded-2xl p-6 shadow-sm space-y-5">

                <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-[#4a4238]/10 pb-4">

                  <div>

                    <span className="text-xs font-lora font-bold text-[#798771] uppercase tracking-widest flex items-center gap-1.5 mb-1">

                      <Heart size={14} /> Wellness Hub • Step {wellnessEnrollment.active_step || 1} of 12

                    </span>

                    <h3 className="font-playfair text-2xl text-[#4a4238]">

                      Today&apos;s Wellness Protocol

                    </h3>

                  </div>

                  <div className="flex flex-wrap items-center gap-2">

                    {wellnessEnrollment.agreement_signed && (

                      <span className="text-xs font-lora font-bold text-[#798771] bg-[#798771]/10 px-3 py-1 rounded-full">

                        {wellnessDoneToday}/{wellnessTasksToday.length} Complete • Day {wellnessEnrollment.days_completed || 0}/{wellnessEnrollment.required_days || 14}

                      </span>

                    )}

                    <button

                      type="button"

                      onClick={() => setActiveTab('wellness')}

                      className="inline-flex items-center gap-1 px-4 py-1.5 rounded-full bg-[#fdfbf7] border border-[#4a4238]/15 font-lora text-xs font-bold text-[#4a4238] hover:border-[#798771] hover:text-[#798771] transition-colors"

                    >

                      Open Wellness Hub <ArrowRight size={13} />

                    </button>

                  </div>

                </div>



                {!wellnessEnrollment.agreement_signed ? (

                  <div className="bg-[#fdfbf7] border border-[#798771]/25 rounded-xl p-5 flex flex-col sm:flex-row sm:items-center justify-between gap-4">

                    <p className="font-lora text-sm text-[#4a4238]/85">

                      Welcome to Wellness Hub! Complete your quick Wellness Scope &amp; Privacy Acknowledgment to unlock your daily habits right here.

                    </p>

                    <button

                      type="button"

                      onClick={() => setActiveTab('wellness')}

                      className="shrink-0 bg-[#798771] text-white px-5 py-2.5 rounded-full font-lora text-xs font-bold uppercase tracking-wider hover:bg-[#6b7764]"

                    >

                      Complete Setup

                    </button>

                  </div>

                ) : (

                  <>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3">

                      {wellnessTasksToday.map(task => {

                        const isDone = wellnessCheckedToday.includes(task.id);

                        const slots = { ...DEFAULT_WELLNESS_MEAL_SLOTS, ...(wellnessEnrollment.meal_slots || {}) };

                        const displayTxt = (wellnessEnrollment.easy_mode_today ? task.floor : task.normal)

                          .replace('[SMOOTHIE]', slots.smoothie)

                          .replace('[MEAT_MEAL_1]', slots.meatMeal1)

                          .replace('[PROTEIN_SNACK]', slots.proteinSnack)

                          .replace('[MEAT_MEAL_2]', slots.meatMeal2)

                          .replace('[ESTROGEN_SNACK]', slots.estrogenSnack);

                        return (

                          <button

                            key={task.id}

                            type="button"

                            onClick={() => {

                              const next = isDone

                                ? wellnessCheckedToday.filter(id => id !== task.id)

                                : [...wellnessCheckedToday, task.id];

                              patchMyWellnessEnrollment({ checked_today: next, checked_date: getTodayIsoDate() });

                            }}

                            className={`text-left p-3.5 rounded-xl border flex items-start gap-3 transition-colors ${

                              isDone ? 'bg-[#798771]/10 border-[#798771]/35' : 'bg-[#fdfbf7] border-[#4a4238]/10 hover:border-[#798771]/50'

                            }`}

                          >

                            <CheckCircle size={18} className={`mt-0.5 shrink-0 ${isDone ? 'text-[#798771]' : 'text-[#4a4238]/25'}`} />

                            <span className={`font-lora text-xs leading-relaxed ${isDone ? 'line-through text-[#4a4238]/45' : 'text-[#4a4238]'}`}>

                              {displayTxt}

                            </span>

                          </button>

                        );

                      })}

                    </div>



                    <div className="flex flex-wrap items-center justify-between gap-3 pt-2 border-t border-[#4a4238]/10">

                      <button

                        type="button"

                        onClick={() => patchMyWellnessEnrollment({ easy_mode_today: !wellnessEnrollment.easy_mode_today })}

                        className="font-lora text-xs font-bold text-[#4a4238]/70 hover:text-[#798771]"

                      >

                        {wellnessEnrollment.easy_mode_today ? '60s Low-Energy Floor: ON (Tap to switch back)' : 'Overwhelmed today? Switch to 60s Floor'}

                      </button>

                      {(Number(wellnessEnrollment.active_step) || 1) >= 3 && (

                        <button

                          type="button"

                          onClick={() => setWellnessWodOpen(true)}

                          className="inline-flex items-center gap-1.5 px-4 py-1.5 rounded-full bg-[#798771] text-white font-lora text-xs font-bold hover:bg-[#6b7764]"

                        >

                          <Play size={12} /> Start 20-Min Movement

                        </button>

                      )}

                    </div>

                  </>

                )}

              </div>

            )}



            <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">

              {/* Category 1: Daily Meal Plan + Next-Day Freezer Reminder */}

              <div className="bg-white border border-[#4a4238]/10 rounded-2xl p-6 shadow-sm flex flex-col">

                <div className="flex items-start justify-between gap-4 border-b border-[#4a4238]/10 pb-4 mb-5">

                  <div>

                    <span className="text-xs font-lora font-bold text-[#798771] uppercase tracking-widest block mb-1">Category 1 • Kitchen &amp; Table</span>

                    <h3 className="font-playfair text-2xl text-[#4a4238] flex items-center gap-2">

                      <Utensils size={20} className="text-[#798771]" /> {homeDay}&apos;s Daily Meal Plan

                    </h3>

                  </div>

                  <span className="text-xs font-lora font-bold text-[#4a4238]/60 bg-[#fdfbf7] px-3 py-1 rounded-full border border-[#4a4238]/10">

                    {mealsDone}/{todaysMeals.length}

                  </span>

                </div>



                {todaysMeals.length === 0 ? (

                  <div className="bg-[#fdfbf7] border border-dashed border-[#4a4238]/20 rounded-xl p-6 text-center space-y-3">

                    <p className="font-lora text-sm text-[#4a4238]/70">No meals are assigned to {homeDay} yet.</p>

                    <button type="button" onClick={() => setActiveTab('kitchen')} className="inline-flex items-center gap-1.5 text-xs font-lora font-bold uppercase tracking-wider text-[#798771] hover:underline">

                      Plan {homeDay}&apos;s Menu <ArrowRight size={13} />

                    </button>

                  </div>

                ) : (

                  <ul className="space-y-3 flex-1">

                    {todaysMeals.map(meal => {

                      const isDone = !!checkedHomeMeals[meal.key];

                      return (

                        <li key={meal.key} className="bg-[#fdfbf7] border border-[#4a4238]/10 rounded-xl p-4 flex items-start justify-between gap-3">

                          <button type="button" onClick={() => toggleHomeMeal(meal.key)} className="flex items-start gap-3 text-left flex-1 group">

                            <CheckCircle size={19} className={`mt-0.5 shrink-0 transition-colors ${isDone ? 'text-[#798771]' : 'text-[#4a4238]/25 group-hover:text-[#798771]/70'}`} />

                            <div>

                              <span className="text-[11px] font-lora font-bold uppercase tracking-wider text-[#798771] block">

                                {meal.slot} • Prep {meal.recipe.prepTime} • Cook {meal.recipe.cookTime}

                              </span>

                              <span className={`font-playfair text-lg leading-snug block ${isDone ? 'line-through text-[#4a4238]/40' : 'text-[#4a4238]'}`}>

                                {meal.recipe.name}

                              </span>

                              <span className="font-lora text-xs text-[#4a4238]/55">

                                Scaled for {totalMultiplier.toFixed(1)} adult portions

                              </span>

                            </div>

                          </button>

                          <button type="button" onClick={() => setSelectedRecipe(meal.recipe)} className="shrink-0 px-3 py-1.5 rounded-full bg-white border border-[#798771]/30 text-[#798771] font-lora text-xs font-bold hover:bg-[#798771] hover:text-white transition-colors">

                            Recipe

                          </button>

                        </li>

                      );

                    })}

                  </ul>

                )}



                {/* Next-Day Meal & Freezer Thaw Notification */}

                <div className="mt-5 bg-[#798771]/10 border border-[#798771]/25 rounded-xl p-4 space-y-2.5">

                  <div className="flex items-start justify-between gap-3">

                    <div>

                      <span className="text-[11px] font-lora font-bold uppercase tracking-widest text-[#798771] block">

                        Tomorrow&apos;s Dinner &amp; Freezer Reminder ({tomorrowName})

                      </span>

                      <p className="font-playfair text-base text-[#4a4238] font-medium mt-0.5">

                        {tomorrowDinner ? tomorrowDinner.name : `No dinner planned for ${tomorrowName} yet.`}

                      </p>

                    </div>

                    {tomorrowDinner && (

                      <button

                        type="button"

                        onClick={() => setSelectedRecipe(tomorrowDinner)}

                        className="shrink-0 font-lora text-xs font-bold text-[#798771] hover:underline"

                      >

                        Preview

                      </button>

                    )}

                  </div>



                  {tomorrowDinner && tomorrowMeats.length > 0 && (

                    <button

                      type="button"

                      onClick={() => toggleHomeMeal(thawReminderKey)}

                      className="w-full text-left flex items-start gap-2.5 bg-white/80 border border-[#798771]/20 rounded-lg px-3 py-2 group"

                    >

                      <CheckCircle

                        size={16}

                        className={`mt-0.5 shrink-0 transition-colors ${

                          isThawDone ? 'text-[#798771]' : 'text-[#4a4238]/30 group-hover:text-[#798771]'

                        }`}

                      />

                      <span className={`font-lora text-xs leading-relaxed ${isThawDone ? 'line-through text-[#4a4238]/45' : 'text-[#4a4238]/90'}`}>

                        <strong>Pull from freezer tonight:</strong>{' '}

                        {tomorrowMeats

                          .map(m => `${formatScaledQty(m.qty * totalMultiplier)} ${m.unit} ${m.name}`)

                          .join(', ')}

                      </span>

                    </button>

                  )}



                  {tomorrowDinner && tomorrowMeats.length === 0 && (

                    <p className="font-lora text-xs text-[#4a4238]/70 italic">

                      No frozen meat needed for tomorrow&apos;s dinner—just check pantry staples ahead of time.

                    </p>

                  )}

                </div>



                <div className="mt-4 pt-3 border-t border-[#4a4238]/10 flex items-center justify-between gap-3">

                  <button type="button" onClick={() => setActiveTab('kitchen')} className="font-lora text-xs font-bold text-[#4a4238]/65 hover:text-[#798771] transition-colors">

                    Edit Weekly Menu

                  </button>

                  <button type="button" onClick={jumpToGroceryList} className="shrink-0 font-lora text-xs font-bold text-[#798771] hover:underline flex items-center gap-1">

                    Open Grocery List <ArrowRight size={13} />

                  </button>

                </div>

              </div>



              {/* Category 2 */}

              <div className="bg-white border border-[#4a4238]/10 rounded-2xl p-6 shadow-sm flex flex-col">

                <div className="flex items-start justify-between gap-4 border-b border-[#4a4238]/10 pb-4 mb-5">

                  <div>

                    <span className="text-xs font-lora font-bold text-[#798771] uppercase tracking-widest block mb-1">Category 2 • Weekly Focus Zone</span>

                    <h3 className="font-playfair text-2xl text-[#4a4238] flex items-center gap-2">

                      <Sparkles size={20} className="text-[#798771]" />

                      {weeklyZoneRooms.length > 0 ? weeklyZoneRooms.join(' & ') : `${homeDay} Rest & Margin`}

                    </h3>

                  </div>

                  <span className="text-xs font-lora font-bold text-[#4a4238]/60 bg-[#fdfbf7] px-3 py-1 rounded-full border border-[#4a4238]/10">

                    {zoneDone}/{weeklyZoneTasks.length}

                  </span>

                </div>



                {weeklyZoneTasks.length === 0 ? (

                  <div className="bg-[#fdfbf7] border border-dashed border-[#4a4238]/20 rounded-xl p-6 text-center flex-1 flex flex-col items-center justify-center space-y-2">

                    <p className="font-playfair text-lg text-[#4a4238]">No heavy cleaning zone scheduled for {homeDay}.</p>

                    <p className="font-lora text-sm text-[#4a4238]/65 max-w-sm">Enjoy the open margin for rest, hospitality, meal prep, or catching up at your own pace.</p>

                  </div>

                ) : (

                  <ul className="space-y-3 flex-1">

                    {weeklyZoneTasks.map(task => (

                      <li key={task.id} className="bg-[#fdfbf7] border border-[#4a4238]/10 rounded-xl p-3.5">

                        <button type="button" onClick={() => toggleRoomTask(task.id)} className="w-full text-left flex items-start gap-3 group">

                          <CheckCircle size={18} className={`mt-0.5 shrink-0 transition-colors ${task.done ? 'text-[#798771]' : 'text-[#4a4238]/25 group-hover:text-[#798771]/70'}`} />

                          <div>

                            <span className="text-[11px] font-lora font-bold uppercase tracking-wider text-[#798771] block">{task.roomName}</span>

                            <span className={`font-lora text-sm leading-relaxed ${task.done ? 'line-through text-[#4a4238]/40' : 'text-[#4a4238]/90'}`}>{task.text}</span>

                          </div>

                        </button>

                      </li>

                    ))}

                  </ul>

                )}



                <div className="mt-5 pt-4 border-t border-[#4a4238]/10 flex justify-end">

                  <button type="button" onClick={() => { setActiveTaskTier('weekly'); setActiveTab('room'); }} className="font-lora text-xs font-bold text-[#798771] hover:underline flex items-center gap-1">

                    Manage Rooms &amp; Zones <ArrowRight size={13} />

                  </button>

                </div>

              </div>



              {/* Category 3 */}

              <div className="bg-white border border-[#4a4238]/10 rounded-2xl p-6 shadow-sm flex flex-col">

                <div className="flex items-start justify-between gap-4 border-b border-[#4a4238]/10 pb-4 mb-5">

                  <div>

                    <span className="text-xs font-lora font-bold text-[#798771] uppercase tracking-widest block mb-1">Category 3 • Daily Home Reset</span>

                    <h3 className="font-playfair text-2xl text-[#4a4238] flex items-center gap-2">

                      <HomeIcon size={20} className="text-[#798771]" /> Room-by-Room Essentials

                    </h3>

                  </div>

                  <span className="text-xs font-lora font-bold text-[#4a4238]/60 bg-[#fdfbf7] px-3 py-1 rounded-full border border-[#4a4238]/10">

                    {dailyDone}/{dailyResetTasks.length}

                  </span>

                </div>



                <div className="space-y-5 max-h-[420px] overflow-y-auto pr-1 flex-1">

                  {Object.entries(dailyByRoom).map(([roomName, tasks]) => (

                    <div key={roomName} className="space-y-2">

                      <h4 className="font-lora text-xs font-bold uppercase tracking-widest text-[#798771] border-b border-[#4a4238]/10 pb-1">{roomName}</h4>

                      <ul className="space-y-2">

                        {tasks.map(task => (

                          <li key={task.id}>

                            <button type="button" onClick={() => toggleRoomTask(task.id)} className="w-full text-left flex items-start gap-3 py-1 group">

                              <CheckCircle size={17} className={`mt-0.5 shrink-0 transition-colors ${task.done ? 'text-[#798771]' : 'text-[#4a4238]/25 group-hover:text-[#798771]/70'}`} />

                              <span className={`font-lora text-sm leading-relaxed ${task.done ? 'line-through text-[#4a4238]/40' : 'text-[#4a4238]/90'}`}>{task.text}</span>

                            </button>

                          </li>

                        ))}

                      </ul>

                    </div>

                  ))}

                </div>



                <div className="mt-5 pt-4 border-t border-[#4a4238]/10 flex justify-end">

                  <button type="button" onClick={() => { setActiveTaskTier('daily'); setActiveTab('room'); }} className="font-lora text-xs font-bold text-[#798771] hover:underline flex items-center gap-1">

                    Open Full Room Auto-Pilot <ArrowRight size={13} />

                  </button>

                </div>

              </div>



              {/* Category 4 */}

              <div className="bg-white border border-[#4a4238]/10 rounded-2xl p-6 shadow-sm flex flex-col">

                <div className="flex items-start justify-between gap-4 border-b border-[#4a4238]/10 pb-4 mb-5">

                  <div>

                    <span className="text-xs font-lora font-bold text-[#798771] uppercase tracking-widest block mb-1">Category 4 • Personal &amp; Errands</span>

                    <h3 className="font-playfair text-2xl text-[#4a4238] flex items-center gap-2">

                      <ListTodo size={20} className="text-[#798771]" /> Today&apos;s Priorities

                    </h3>

                  </div>

                  <span className="text-xs font-lora font-bold text-[#4a4238]/60 bg-[#fdfbf7] px-3 py-1 rounded-full border border-[#4a4238]/10">

                    {prioritiesDone}/{dailyPriorities.length}

                  </span>

                </div>



                <ul className="space-y-3 flex-1 mb-5">

                  {dailyPriorities.length === 0 ? (

                    <li className="bg-[#fdfbf7] border border-dashed border-[#4a4238]/20 rounded-xl p-5 text-center font-lora text-sm text-[#4a4238]/60">

                      Add your top priorities or errands for today below.

                    </li>

                  ) : (

                    dailyPriorities.map(item => (

                      <li key={item.id} className="bg-[#fdfbf7] border border-[#4a4238]/10 rounded-xl px-4 py-3 flex items-center justify-between gap-3">

                        <button type="button" onClick={() => toggleDailyPriority(item.id)} className="flex items-start gap-3 text-left flex-1 group">

                          <CheckCircle size={18} className={`mt-0.5 shrink-0 transition-colors ${item.done ? 'text-[#798771]' : 'text-[#4a4238]/25 group-hover:text-[#798771]/70'}`} />

                          <span className={`font-lora text-sm leading-relaxed ${item.done ? 'line-through text-[#4a4238]/40' : 'text-[#4a4238]/90'}`}>{item.text}</span>

                        </button>

                        <button type="button" onClick={() => deleteDailyPriority(item.id)} className="p-1.5 text-[#4a4238]/35 hover:text-red-700 rounded-full transition-colors">

                          <Trash2 size={14} />

                        </button>

                      </li>

                    ))

                  )}

                </ul>



                <div className="pt-4 border-t border-[#4a4238]/10">

                  <QuickAddForm placeholder="Add a priority, errand, or reminder for today..." buttonLabel="Add Task" onAdd={addDailyPriority} />

                </div>

              </div>

            </div>

          </div>

        );

      };



      const renderKitchenTab = () => {

        const totalItems = groceryData.flatItems.length;

        const checkedCount = groceryData.flatItems.filter(item => checkedGroceryKeys[item.key]).length;



        return (

          <div className="space-y-8">

            <div className="text-center max-w-3xl mx-auto">

              <h2 className="font-playfair text-4xl italic text-[#4a4238] mb-4">Scratch Kitchen &amp; Meal Planner</h2>

              <p className="font-lora text-[#798771] leading-relaxed">

                Wholesome, 1800s-inspired meals that scale automatically to fit your exact family size.

              </p>

            </div>



            <div className="bg-white border border-[#4a4238]/10 rounded-2xl p-6 shadow-sm">

              <h3 className="font-playfair text-2xl text-[#4a4238] mb-4 border-b border-[#4a4238]/10 pb-3 flex items-center justify-between flex-wrap gap-2">

                <span>Family Portion Calculator</span>

                <span className="text-sm font-lora font-normal bg-[#798771]/10 text-[#798771] px-4 py-1 rounded-full border border-[#798771]/20">

                  Total Multiplier: <strong>{totalMultiplier.toFixed(1)}x</strong>

                </span>

              </h3>

              <div className="grid grid-cols-2 md:grid-cols-4 gap-6 font-lora">

                {[

                  { label: 'Adults (100%)', val: adults, set: setAdults },

                  { label: 'Kids 6-12 (65%)', val: kids, set: setKids },

                  { label: 'Toddlers (50%)', val: toddlers, set: setToddlers },

                  { label: 'Babies (0%)', val: babies, set: setBabies }

                ].map((group, idx) => (

                  <div key={idx} className="flex flex-col items-center">

          <div className="space-y-10">

              <h2 className="font-playfair text-4xl italic text-[#4a4238] mb-4">Room-by-Room Auto-Pilot</h2>

              <p className="font-lora text-[#798771] leading-relaxed">

                Customize the rooms in your home and tailor every checklist—add your own tasks, edit wording, or delete anything that doesn&apos;t fit your household.

              </p>

            </div>



            {/* Step 1: Home Rooms Profile */}

            <div className="bg-white border border-[#4a4238]/10 rounded-2xl p-6 shadow-sm space-y-6">

              <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-[#4a4238]/10 pb-4">

                <div>

                  <span className="text-xs font-lora font-bold text-[#798771] uppercase tracking-widest block mb-1">Step 1 • Home Layout</span>

                  <h3 className="font-playfair text-2xl text-[#4a4238] flex items-center gap-2">

                    <HomeIcon size={22} className="text-[#798771]" /> My Home Rooms Profile

                  </h3>

                </div>

                <button

                  type="button"

                  onClick={() => {

                    setEditingRoom(null);

                    setIsRoomModalOpen(true);

                  }}

                  className="inline-flex items-center justify-center gap-2 bg-[#798771] text-white px-5 py-2.5 rounded-full font-lora text-xs font-bold uppercase tracking-wider hover:bg-[#6b7764] transition-colors"

                >

                  <Plus size={16} /> Add Room / Space

                </button>

              </div>



              {myRooms.length === 0 ? (

                <div className="text-center py-8 font-lora text-[#4a4238]/60 bg-[#fdfbf7] rounded-xl border border-dashed border-[#4a4238]/20">

                  No rooms added yet. Click &ldquo;Add Room / Space&rdquo; above to generate your home cleaning plan.

                </div>

              ) : (

                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">

                  {myRooms.map(room => (

                    <div key={room.id} className="bg-[#fdfbf7] border border-[#4a4238]/10 rounded-xl p-4 flex items-center justify-between gap-3">

                      <div>

                        <div className="flex items-center gap-2">

                          <span className="text-xs font-lora font-bold text-[#798771] bg-[#798771]/10 px-2 py-0.5 rounded-full">

                            {room.count}x

                          </span>

                          <h4 className="font-playfair text-lg text-[#4a4238] font-medium">{room.name}</h4>

                        </div>

                        <p className="font-lora text-xs text-[#4a4238]/60 mt-1">

                          {room.type} • {room.weeklyDay} Zone

                        </p>

                      </div>

                      <div className="flex items-center gap-1 shrink-0">

                        <button

                          type="button"

                          onClick={() => {

                            setEditingRoom(room);

                            setIsRoomModalOpen(true);

                          }}

                          className="p-2 text-[#4a4238]/60 hover:text-[#798771] hover:bg-white rounded-full transition-colors"

                          aria-label={`Edit ${room.name}`}

                        >

                          <Edit2 size={15} />

                        </button>

                        <button

                          type="button"

                          onClick={() => deleteRoom(room.id)}

                          className="p-2 text-[#4a4238]/60 hover:text-red-700 hover:bg-white rounded-full transition-colors"

                          aria-label={`Delete ${room.name}`}

                        >

                          <Trash2 size={15} />

                        </button>

                      </div>

                    </div>

                  ))}

                </div>

              )}

            </div>



            {/* Step 2: Generated Checklists */}

            <div className="bg-white border border-[#4a4238]/10 rounded-2xl p-6 shadow-sm space-y-6">

              <div className="flex flex-col lg:flex-row lg:items-end justify-between gap-4 border-b border-[#4a4238]/10 pb-5">

                <div>

                  <span className="text-xs font-lora font-bold text-[#798771] uppercase tracking-widest block mb-1">Step 2 • Automated Checklists</span>

                  <h3 className="font-playfair text-2xl text-[#4a4238] flex items-center gap-2">

                    <ListTodo size={22} className="text-[#798771]" /> Household Rhythm Organizer

                  </h3>

                  <p className="font-lora text-sm text-[#4a4238]/70 mt-1">

                    {completedCount} of {tierTasks.length} tasks completed in this rhythm.

                  </p>

                </div>



                <div className="flex flex-wrap items-center gap-2">

                  {tiers.map(tier => (

                    <button

                      key={tier.id}

                      type="button"

                      onClick={() => setActiveTaskTier(tier.id)}

                      className={`px-4 py-2 rounded-full text-xs font-bold tracking-wider font-lora border transition-colors ${

                        activeTaskTier === tier.id

                          ? 'bg-[#798771] text-white border-[#798771]'

                          : 'bg-transparent text-[#4a4238] border-[#4a4238]/20 hover:border-[#798771]'

                      }`}

                    >

                      {tier.label}

                    </button>

                  ))}

                  <button

                    type="button"

                    onClick={resetCurrentTierCheckmarks}

                    className="px-4 py-2 rounded-full text-xs font-bold tracking-wider font-lora border border-[#4a4238]/20 text-[#4a4238]/70 hover:text-[#4a4238] hover:border-[#4a4238]/40 transition-colors"

                  >

                    Reset Checkmarks

                  </button>

                  <button

                    type="button"

                    onClick={() => restoreDefaultTasksForTier(activeTaskTier)}

                    className="inline-flex items-center gap-1.5 px-4 py-2 rounded-full text-xs font-bold tracking-wider font-lora border border-[#798771]/30 text-[#798771] hover:bg-[#798771]/10 transition-colors"

                    title="Adds back any deleted default tasks for this rhythm while keeping your custom tasks"

                  >

                    <RotateCcw size={13} /> Restore Defaults

                  </button>

                </div>

              </div>



              {roomNamesToDisplay.length === 0 ? (

                <div className="text-center py-10 font-lora text-[#4a4238]/60 bg-[#fdfbf7] rounded-xl border border-dashed border-[#4a4238]/20">

                  Add rooms above to automatically generate your cleaning checklists.

                </div>

              ) : (

                <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">

                  {roomNamesToDisplay.map(roomName => {

                    const tasks = groupedByRoom[roomName] || [];

                    const roomMeta = myRooms.find(r => r.name === roomName);

                    const roomDone = tasks.filter(t => t.done).length;

                    return (

                      <div key={roomName} className="bg-[#fdfbf7] border border-[#4a4238]/10 rounded-xl p-5 flex flex-col h-full">

                        <div className="flex items-start justify-between gap-2 border-b border-[#4a4238]/10 pb-3 mb-4">

                          <div>

                            <h4 className="font-playfair text-xl text-[#4a4238]">{roomName}</h4>

                            {roomMeta && (

                              <span className="text-xs font-lora text-[#798771] uppercase tracking-wider font-bold">

                                {roomMeta.weeklyDay} Zone • {roomMeta.count}x

                              </span>

                            )}

                          </div>

                          <span className="text-xs font-lora font-bold text-[#4a4238]/60 bg-white px-2.5 py-1 rounded-full border border-[#4a4238]/10 shrink-0">

                            {roomDone}/{tasks.length}

                          </span>

                        </div>



                        {tasks.length === 0 ? (

                          <p className="font-lora text-xs italic text-[#4a4238]/55 py-2 flex-1">

                            No {activeTierMeta.label.toLowerCase()} tasks listed for this room. Add a custom one below or restore defaults above.

                          </p>

                        ) : (

                          <ul className="space-y-3 flex-1">

                            {tasks.map(task => (

                              <EditableRoomTaskItem

                                key={task.id}

                                task={task}

                                onToggle={toggleRoomTask}

                                onEdit={updateRoomTaskText}

                                onDelete={deleteRoomTask}

                              />

                            ))}

                          </ul>

                        )}



                        <RoomTaskQuickAdd

                          tierLabel={activeTierMeta.label}

                          onAdd={(text) => addCustomRoomTask(roomName, activeTaskTier, text)}

                        />

                      </div>

                    );

                  })}

                </div>

              )}

            </div>

          </div>

        );

      };



      const renderPrintableGroceryList = () => {

        const { printDate, plannedDinners } = getGroceryExportContext();

        return (

          <div id="printable-grocery-sheet" className="hidden print:block p-8 bg-white text-[#4a4238] font-lora">

            <div className="border-b-2 border-[#4a4238]/30 pb-4 mb-6 flex justify-between items-end">

              <div>

                <p className="text-xs uppercase tracking-[0.25em] text-[#798771] font-bold">HONEYSUCKLE &amp; CO.</p>

                <h1 className="font-playfair text-3xl text-[#4a4238] mt-1">Weekly Family Grocery List</h1>

              </div>

              <div className="text-right text-xs text-[#4a4238]/75">

                <p className="font-bold">{printDate}</p>

                <p>Scaled for {totalMultiplier.toFixed(1)} Adult Portions</p>

              </div>

            </div>



            {plannedDinners.length > 0 && (

              <div className="mb-6 pb-4 border-b border-[#4a4238]/15">

                <p className="text-xs font-bold uppercase tracking-widest text-[#798771] mb-1.5">This Week&apos;s Planned Dinners</p>

                <p className="text-xs text-[#4a4238]/85 leading-relaxed">{plannedDinners.join('  •  ')}</p>

              </div>

            )}



            <div className="grid grid-cols-2 gap-6">

              {groceryData.aisleOrder.map(aisle => {

                const items = (groceryData.grouped[aisle] || []).filter(item =>

                  hideCheckedGrocery ? !checkedGroceryKeys[item.key] : true

                );

                if (items.length === 0) return null;



                return (

                  <div key={aisle} className="break-inside-avoid border border-[#4a4238]/20 rounded-lg p-4">

                    <h2 className="font-playfair text-lg font-bold text-[#4a4238] border-b border-[#4a4238]/15 pb-1.5 mb-3">{aisle}</h2>

                    <ul className="space-y-2">

                      {items.map(item => {

                        const isChecked = !!checkedGroceryKeys[item.key];

                        return (

                          <li key={item.key} className="flex items-start gap-2.5 text-sm">

                            <span className="inline-block w-4 h-4 mt-0.5 border border-[#4a4238] rounded-sm shrink-0 text-center leading-3 text-xs">

                              {isChecked ? 'x' : ''}

                            </span>

                            <span className={isChecked ? 'line-through text-[#4a4238]/50' : ''}>

                              <strong>{item.name}</strong>

                              {item.qty !== null && (

                                <span className="text-[#4a4238]/75"> — {formatScaledQty(item.qty)} {item.unit}</span>

                              )}

                            </span>

                          </li>

                        );

                      })}

                    </ul>

                  </div>

                );

              })}

            </div>

          </div>

        );

      };



      const renderPrintPreviewModal = () => {

        if (!isPrintModalOpen) return null;

        const { printDate, plannedDinners } = getGroceryExportContext();



        return (

          <div className="fixed inset-0 bg-[#4a4238]/60 z-50 flex items-center justify-center p-4 no-print print:hidden">

            <div className="bg-[#fdfbf7] w-full max-w-4xl rounded-2xl shadow-2xl overflow-hidden max-h-[92vh] flex flex-col border border-[#4a4238]/15">

              <div className="p-5 md:p-6 bg-white border-b border-[#4a4238]/10 space-y-4">

                <div className="flex items-start justify-between gap-4">

                  <div>

                    <span className="text-xs font-lora font-bold text-[#798771] uppercase tracking-widest block">Paper &amp; Export Ready</span>

                    <h2 className="font-playfair text-2xl md:text-3xl text-[#4a4238]">Print Grocery List Preview</h2>

                  </div>

                  <button type="button" onClick={() => setIsPrintModalOpen(false)} className="p-2 hover:bg-[#4a4238]/5 rounded-full transition-colors text-[#4a4238]">

                    <XIcon size={22} />

                  </button>

                </div>



                <div className="flex flex-wrap items-center gap-2.5">

                  <button type="button" onClick={triggerBrowserPrint} className="inline-flex items-center gap-2 bg-[#798771] text-white px-5 py-2.5 rounded-full font-lora text-xs font-bold uppercase tracking-wider hover:bg-[#6b7764] transition-colors">

                    <Printer size={15} /> Print Now

                  </button>

                  <button type="button" onClick={downloadPrintableGrocerySheet} className="inline-flex items-center gap-2 bg-white text-[#4a4238] border border-[#4a4238]/25 px-4 py-2.5 rounded-full font-lora text-xs font-bold uppercase tracking-wider hover:border-[#798771] hover:text-[#798771] transition-colors">

                    <Download size={15} /> Download Printable Sheet

                  </button>

                  <button type="button" onClick={copyGroceryListText} className="inline-flex items-center gap-2 bg-white text-[#4a4238] border border-[#4a4238]/25 px-4 py-2.5 rounded-full font-lora text-xs font-bold uppercase tracking-wider hover:border-[#798771] hover:text-[#798771] transition-colors">

                    {copiedList ? <Check size={15} className="text-[#798771]" /> : <Copy size={15} />}

                    {copiedList ? 'Copied!' : 'Copy Checklist'}

                  </button>

                </div>



                {printNotice && (

                  <p className="font-lora text-xs text-[#798771] bg-[#798771]/10 border border-[#798771]/20 rounded-xl px-4 py-2.5">

                    {printNotice}

                  </p>

                )}

              </div>



              <div className="overflow-y-auto p-5 md:p-8 bg-[#f4f0e8]">

                <div className="bg-white max-w-3xl mx-auto p-6 md:p-10 rounded-xl shadow-md border border-[#4a4238]/15 text-[#4a4238] font-lora">

                  <div className="border-b-2 border-[#4a4238]/25 pb-4 mb-6 flex flex-col sm:flex-row sm:items-end justify-between gap-3">

                    <div>

                      <p className="font-cormorant text-xs uppercase tracking-[0.25em] text-[#798771] font-bold">HONEYSUCKLE &amp; CO.</p>

                      <h3 className="font-playfair text-3xl text-[#4a4238] mt-1">Weekly Family Grocery List</h3>

                    </div>

                    <div className="sm:text-right text-xs text-[#4a4238]/75">

                      <p className="font-bold">{printDate}</p>

                      <p>Scaled for {totalMultiplier.toFixed(1)} Adult Portions</p>

                    </div>

                  </div>



                  {plannedDinners.length > 0 && (

                    <div className="mb-6 p-4 bg-[#fdfbf7] rounded-xl border border-[#4a4238]/10">

                      <p className="text-[11px] font-bold uppercase tracking-widest text-[#798771] mb-1">This Week&apos;s Planned Dinners</p>

                      <p className="text-xs text-[#4a4238]/85 leading-relaxed">{plannedDinners.join('  •  ')}</p>

                    </div>

                  )}



                  <div className="grid grid-cols-1 md:grid-cols-2 gap-5">

                    {groceryData.aisleOrder.map(aisle => {

                      const items = (groceryData.grouped[aisle] || []).filter(item =>

                        hideCheckedGrocery ? !checkedGroceryKeys[item.key] : true

                      );

                      if (items.length === 0) return null;



                      return (

                        <div key={aisle} className="border border-[#4a4238]/15 rounded-xl p-4">

                          <h4 className="font-playfair text-lg font-bold text-[#4a4238] border-b border-[#4a4238]/10 pb-1.5 mb-3">{aisle}</h4>

                          <ul className="space-y-2">

                            {items.map(item => {

                              const isChecked = !!checkedGroceryKeys[item.key];

                              return (

                                <li key={item.key} className="flex items-start gap-2.5 text-sm">

                                  <span className="inline-flex items-center justify-center w-4 h-4 mt-0.5 border border-[#4a4238] rounded-sm shrink-0 text-[10px] font-bold text-[#798771]">

                                    {isChecked ? '✓' : ''}

                                  </span>

                                  <span className={isChecked ? 'line-through text-[#4a4238]/45' : ''}>

                                    <strong>{item.name}</strong>

                                    {item.qty !== null && (

                                      <span className="text-[#798771] font-medium"> — {formatScaledQty(item.qty)} {item.unit}</span>

                                    )}

                                  </span>

                                </li>

                              );

                            })}

                          </ul>

                        </div>

                      );

                    })}

                  </div>

                </div>

              </div>

            </div>

          </div>

        );

      };



      const renderRecipeModal = () => {

        if (!selectedRecipe) return null;

        return (

          <div className="fixed inset-0 bg-[#4a4238]/60 z-50 flex items-center justify-center p-4 no-print print:hidden">

            <div className="bg-[#fdfbf7] w-full max-w-2xl rounded-2xl shadow-xl overflow-hidden max-h-[90vh] flex flex-col">

              <div className="p-6 border-b border-[#4a4238]/10 flex justify-between items-center bg-white">

                <div>

                  <span className="text-xs font-lora font-bold text-[#798771] uppercase tracking-widest">{selectedRecipe.category}</span>

                  <h2 className="font-playfair text-3xl text-[#4a4238] mt-1">{selectedRecipe.name}</h2>

                </div>

                <button type="button" onClick={() => setSelectedRecipe(null)} className="p-2 hover:bg-[#4a4238]/5 rounded-full transition-colors text-[#4a4238]">

                  <XIcon size={24} />

                </button>

              </div>



              <div className="overflow-y-auto p-6 space-y-8">

                <div className="flex gap-4 border-b border-[#4a4238]/10 pb-6">

                  <div className="flex-1 bg-white p-4 rounded-xl border border-[#4a4238]/5 text-center">

                    <p className="text-xs font-lora uppercase tracking-widest text-[#4a4238]/60 mb-1">Prep</p>

                    <p className="font-playfair text-lg text-[#4a4238]">{selectedRecipe.prepTime}</p>

                  </div>

                  <div className="flex-1 bg-white p-4 rounded-xl border border-[#4a4238]/5 text-center">

                    <p className="text-xs font-lora uppercase tracking-widest text-[#4a4238]/60 mb-1">Cook</p>

                    <p className="font-playfair text-lg text-[#4a4238]">{selectedRecipe.cookTime}</p>

                  </div>

                  <div className="flex-1 bg-[#798771]/10 p-4 rounded-xl border border-[#798771]/20 text-center">

                    <p className="text-xs font-lora uppercase tracking-widest text-[#798771] mb-1">Scaled For</p>

                    <p className="font-playfair text-lg text-[#798771] font-bold">{totalMultiplier.toFixed(1)} Portions</p>

                  </div>

                </div>



                <div>

                  <h3 className="font-playfair text-2xl text-[#4a4238] mb-4 flex items-center gap-2">

                    <Leaf size={20} className="text-[#798771]" /> Scaled Ingredients

                  </h3>

                  <ul className="space-y-3 bg-white p-6 rounded-xl border border-[#4a4238]/5">

                    {selectedRecipe.ingredients.map((ing, i) => {

                      const scaledQty = (ing.qty * totalMultiplier).toFixed(2).replace(/\.00$/, '');

                      return (

                        <li key={i} className="flex items-center gap-3 font-lora text-[#4a4238]">

                          <div className="w-2 h-2 rounded-full bg-[#798771]/40 shrink-0" />

                          <span className="font-bold w-24 shrink-0">{scaledQty} {ing.unit}</span>

                          <span>{ing.name}</span>

                        </li>

                      );

                    })}

                  </ul>

                </div>



                <div>

                  <h3 className="font-playfair text-2xl text-[#4a4238] mb-4 flex items-center gap-2">

                    <Sparkles size={20} className="text-[#798771]" /> Instructions

                  </h3>

                  <div className="bg-white p-6 rounded-xl border border-[#4a4238]/5">

                    <p className="font-lora text-[#4a4238] leading-relaxed whitespace-pre-line">

                      {selectedRecipe.instructions}

                    </p>

                  </div>

                </div>

              </div>

            </div>

          </div>

        );

      };



      const syncLabel =

        syncStatus === 'saving'

          ? 'Saving...'

          : syncStatus === 'loading'

          ? 'Syncing...'

          : syncStatus === 'local'

          ? 'Saved Locally'

          : 'Cloud Synced';



      return (

        <div className="min-h-screen bg-[#fdfbf7] flex flex-col">

          {/* Header */}

          <header className="bg-[#fdfbf7] border-b border-[#4a4238]/10 pt-8 pb-4 sticky top-0 z-40 shadow-[0_4px_20px_-15px_rgba(0,0,0,0.1)] no-print print:hidden">

            <div className="max-w-7xl mx-auto px-6">

              <div className="flex flex-col items-center justify-center space-y-5 relative">

                {/* Cloud Sync & Sign Out Bar */}

                <div className="w-full flex items-center justify-between text-xs font-lora">

                  <span className="inline-flex items-center gap-1.5 text-[#798771] font-medium">

                    <Cloud size={14} /> {syncLabel}

                  </span>

                  <div className="flex items-center gap-4">

                    {isPractitioner && (

                      <button

                        type="button"

                        onClick={() => { setPractitionerMode(true); setActiveTab('wellness'); }}

                        className="hidden md:inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-[#4a4238] text-white font-bold hover:bg-[#3a332b] transition-colors"

                      >

                        <Users size={12} /> Practitioner Studio

                      </button>

                    )}

                    <button

                      type="button"

                      onClick={() => setIsCartOpen(true)}

                      className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-[#798771]/10 text-[#798771] border border-[#798771]/25 font-bold hover:bg-[#798771] hover:text-white transition-colors"

                    >

                      <ShoppingBag size={13} /> Bag ({cartItemCount})

                    </button>

                    <span className="hidden sm:inline text-[#4a4238]/55">{currentUser.email}</span>

                    <button

                      type="button"

                      onClick={handleSignOut}

                      className="font-bold uppercase tracking-wider text-[#4a4238]/55 hover:text-[#4a4238] transition-colors"

                    >

                      Sign Out

                    </button>

                  </div>

                </div>



                {/* Brand Logo */}

                <div className="text-center">

                  <h1 className="font-cormorant text-3xl md:text-4xl tracking-[0.22em] text-[#4a4238] font-medium">

                    HONEYSUCKLE &amp; CO.

                  </h1>

                  <p className="font-lora text-xs text-[#798771] italic mt-1">

                    Returning to what&apos;s real: home, food, &amp; faith.

                  </p>

                </div>



                {/* Primary Navigation */}

                <nav className="flex flex-wrap justify-center gap-x-8 gap-y-3 pt-1">

                  {TABS.map(tab => (

                    <button

                      key={tab.id}

                      type="button"

                      onClick={() => setActiveTab(tab.id)}

                      className={`pb-2 text-xs md:text-sm uppercase tracking-[0.15em] transition-all font-bold font-lora relative ${

                        activeTab === tab.id ? 'text-[#798771]' : 'text-[#4a4238]/50 hover:text-[#4a4238]'

                      }`}

                    >

                      {tab.label}

                      {activeTab === tab.id && (

                        <span className="absolute bottom-0 left-0 w-full h-0.5 bg-[#798771]" />

                      )}

                    </button>

                  ))}

                </nav>

              </div>

            </div>

          </header>



          {/* Main Content */}

          <main className="flex-1 max-w-7xl mx-auto px-6 py-10 md:py-12 w-full no-print print:hidden">

            {activeTab === 'home' && renderHomeTab()}

            {activeTab === 'kitchen' && renderKitchenTab()}

            {activeTab === 'vault' && renderVaultTab()}

            {activeTab === 'apothecary' && renderApothecaryTab()}

            {activeTab === 'swaps' && renderCleanSwapsTab()}

            {activeTab === 'room' && renderRoomAutoPilotTab()}

            {activeTab === 'wellness' && (

              <div className="space-y-6">

                {wellnessWelcomeBanner && (

                  <div className="bg-[#798771]/15 border border-[#798771]/35 rounded-2xl p-5 flex items-center justify-between gap-4">

                    <div className="font-lora text-sm text-[#4a4238]">

                      <strong>Welcome to Wellness Hub!</strong> Your payment was received. If your 12-Step portal is still syncing, wait a few seconds and click Refresh.

                    </div>

                    <div className="flex items-center gap-2 shrink-0">

                      <button

                        type="button"

                        onClick={() => loadWellnessData(currentUser)}

                        className="px-4 py-1.5 rounded-full bg-[#798771] text-white font-lora text-xs font-bold"

                      >

                        Refresh Access

                      </button>

                      <button type="button" onClick={() => setWellnessWelcomeBanner(false)} className="p-1 text-[#4a4238]/60">

                        <XIcon size={16} />

                      </button>

                    </div>

                  </div>

                )}



                {isPractitioner && (

                  <div className="flex flex-wrap items-center justify-between gap-3 bg-white border border-[#4a4238]/15 rounded-xl px-4 py-3">

                    <span className="font-lora text-xs font-bold text-[#4a4238]">

                      Practitioner View Mode: <span className="text-[#798771]">{practitionerMode ? 'Practitioner Studio' : 'Member / Client View'}</span>

                    </span>

                    <div className="flex gap-2">

                      <button

                        type="button"

                        onClick={() => setPractitionerMode(true)}

                        className={`px-3.5 py-1.5 rounded-full font-lora text-xs font-bold border ${

                          practitionerMode ? 'bg-[#4a4238] text-white border-[#4a4238]' : 'bg-[#fdfbf7] text-[#4a4238] border-[#4a4238]/20'

                        }`}

                      >

                        Practitioner Studio

                      </button>

                      <button

                        type="button"

                        onClick={() => setPractitionerMode(false)}

                        className={`px-3.5 py-1.5 rounded-full font-lora text-xs font-bold border ${

                          !practitionerMode ? 'bg-[#798771] text-white border-[#798771]' : 'bg-[#fdfbf7] text-[#4a4238] border-[#4a4238]/20'

                        }`}

                      >

                        Preview Member View

                      </button>

                    </div>

                  </div>

                )}



                {isPractitioner && practitionerMode ? (

                  <PractitionerStudioView

                    enrollments={allEnrollments}

                    checkins={allCheckins}

                    messages={allMessages}

                    waitlist={allWaitlist}

                    dbWarning={wellnessDbWarning}

                    onRefreshAll={() => loadWellnessData(currentUser)}

                    onSaveClient={saveClientAsPractitioner}

                    onGrantClientAccess={grantClientAccessAsPractitioner}

                    onReviewCheckin={reviewCheckinAsPractitioner}

                    onSendReply={sendPractitionerReply}

                    onConvertWaitlist={convertWaitlistToClient}

                  />

                ) : !wellnessEnrollment || wellnessEnrollment.status !== 'active' ? (

                  <WellnessUnenrolledView

                    user={currentUser}

                    householdName={householdName}

                    waitlistSubmitted={waitlistSubmitted}

                    onSubmitWaitlist={submitJanuaryWaitlist}

                  />

                ) : !wellnessEnrollment.agreement_signed ? (

                  <WellnessAgreementView

                    user={currentUser}

                    enrollment={wellnessEnrollment}

                    onSign={signWellnessAgreement}

                  />

                ) : (

                  <WellnessClientPortal

                    user={currentUser}

                    enrollment={wellnessEnrollment}

                    checkins={wellnessCheckins}

                    messages={wellnessMessages}

                    waitlistSubmitted={waitlistSubmitted}

                    onPatchEnrollment={patchMyWellnessEnrollment}

                    onOpenWod={() => setWellnessWodOpen(true)}

                    onOpenMealPicker={(slotKey) => setWellnessMealSlotKey(slotKey)}

                    onSubmitCheckin={submitWellnessCheckin}

                    onSendMessage={sendClientWellnessMessage}

                    onSubmitWaitlist={submitJanuaryWaitlist}

                  />

                )}

              </div>

            )}

            {activeTab === 'shop' && (

              <ShopCatalogView

                onAddToCart={addToCart}

                onSelectProduct={setSelectedProduct}

                onOpenCart={() => setIsCartOpen(true)}

                cartItemCount={cartItemCount}

              />

            )}

          </main>



          {/* Printable Grocery List & Modals */}

          {renderPrintableGroceryList()}

          {renderPrintPreviewModal()}

          {renderRecipeModal()}

          <CartDrawer

            isOpen={isCartOpen}

            cart={cart}

            userEmail={currentUser.email || ''}

            onClose={() => setIsCartOpen(false)}

            onUpdateQty={updateCartQty}

            onRemoveItem={removeFromCart}

            onClearCart={clearCart}

          />

          {selectedProduct && (

            <ProductDetailModal

              product={selectedProduct}

              userEmail={currentUser.email || ''}

              onAddToCart={addToCart}

              onClose={() => setSelectedProduct(null)}

            />

          )}

          {isRoomModalOpen && (

            <RoomModal

              editingRoom={editingRoom}

              onSave={saveRoom}

              onClose={() => setIsRoomModalOpen(false)}

            />

          )}

          {wellnessWodOpen && wellnessEnrollment && (

            <WellnessWodModal

              enrollment={wellnessEnrollment}

              onCompleteWod={() => {

                const currentChecked = getNormalizedCheckedToday(wellnessEnrollment);

                if (!currentChecked.includes('s3_wod')) {

                  patchMyWellnessEnrollment({

                    checked_today: [...currentChecked, 's3_wod'],

                    checked_date: getTodayIsoDate()

                  });

                }

              }}

              onClose={() => setWellnessWodOpen(false)}

            />

          )}

          {wellnessMealSlotKey && wellnessEnrollment && (

            <WellnessMealPickerModal

              slotKey={wellnessMealSlotKey}

              currentSelection={(wellnessEnrollment.meal_slots || DEFAULT_WELLNESS_MEAL_SLOTS)[wellnessMealSlotKey]}

              onSelectMeal={(slotKey, mealName) => {

                const nextSlots = {

                  ...DEFAULT_WELLNESS_MEAL_SLOTS,

                  ...(wellnessEnrollment.meal_slots || {}),

                  [slotKey]: mealName

                };

                patchMyWellnessEnrollment({ meal_slots: nextSlots });

              }}

              onClose={() => setWellnessMealSlotKey(null)}

            />

          )}

        </div>

      );

    }



    class AppErrorBoundary extends React.Component {

      constructor(props) {

        super(props);

        this.state = { hasError: false, message: '' };

      }

      static getDerivedStateFromError(err) {

        return { hasError: true, message: err?.message || 'Unexpected rendering error' };

      }

      render() {

        if (this.state.hasError) {

          return (

            <div className="min-h-screen bg-[#fdfbf7] flex items-center justify-center p-6 text-center font-lora text-[#4a4238]">

              <div className="max-w-md bg-white border border-[#4a4238]/15 rounded-2xl p-8 shadow-sm space-y-4">

                <p className="font-cormorant text-2xl tracking-[0.2em]">HONEYSUCKLE &amp; CO.</p>

                <p className="text-sm text-[#4a4238]/75">Something paused while loading your hub ({this.state.message}).</p>

                <button

                  type="button"

                  onClick={() => window.location.reload()}

                  className="px-6 py-2.5 rounded-full bg-[#798771] text-white text-xs font-bold uppercase tracking-wider"

                >

                  Reload Page

                </button>

              </div>

            </div>

          );

        }

        return this.props.children;

      }

    }



    const root = ReactDOM.createRoot(document.getElementById('root'));

    root.render(

      <AppErrorBoundary>

        <App />

      </AppErrorBoundary>

    );

  </script>
</body>
</html>
