                                  onClick={() => s.set(n)}

                                  className={`py-1 rounded text-xs font-bold border ${

                                    s.val >= n ? 'bg-[#798771] text-white border-[#798771]' : 'bg-white text-[#4a4238]/60 border-[#4a4238]/15'

                                  }`}

                                >

                                  {n}

                                </button>

                              ))}

                            </div>

                          </div>

                        ))}

                      </div>



                      <div>

                        <label className="block text-xs font-bold uppercase tracking-wider text-[#798771] mb-1">

                          Supplement / Protocol Adherence (Fullscript &amp; doTERRA)

                        </label>

                        <input

                          type="text"

                          value={ciAdherence}

                          onChange={e => setCiAdherence(e.target.value)}

                          className="w-full bg-[#fdfbf7] border border-[#4a4238]/20 rounded-xl px-3.5 py-2.5 text-sm text-[#4a4238] focus:outline-none focus:border-[#798771]"

                        />

                      </div>



                      <div>

                        <label className="block text-xs font-bold uppercase tracking-wider text-[#798771] mb-1">

                          Wins Since Your Last Check-In

                        </label>

                        <textarea

                          rows={2}

                          required

                          value={ciWins}

                          onChange={e => setCiWins(e.target.value)}

                          placeholder="What feels steadier, lighter, or better this week?"

                          className="w-full bg-[#fdfbf7] border border-[#4a4238]/20 rounded-xl px-3.5 py-2.5 text-sm text-[#4a4238] focus:outline-none focus:border-[#798771]"

                        />

                      </div>



                      <div>

                        <label className="block text-xs font-bold uppercase tracking-wider text-[#798771] mb-1">

                          Friction, Symptoms, or Questions for Ashton

                        </label>

                        <textarea

                          rows={3}

                          value={ciQuestions}

                          onChange={e => setCiQuestions(e.target.value)}

                          placeholder="Share any sticking points, symptoms, or questions..."

                          className="w-full bg-[#fdfbf7] border border-[#4a4238]/20 rounded-xl px-3.5 py-2.5 text-sm text-[#4a4238] focus:outline-none focus:border-[#798771]"

                        />

                      </div>



                      <button

                        type="submit"

                        disabled={ciSubmitting}

                        className="w-full bg-[#798771] text-white py-3.5 rounded-xl text-xs font-bold uppercase tracking-wider hover:bg-[#6b7764] transition-colors disabled:opacity-50"

                      >

                        {ciSubmitting ? 'Submitting Assessment...' : 'Submit Check-In Assessment'}

                      </button>

                    </form>

                  </div>



                  <div className="lg:col-span-5 bg-white border border-[#4a4238]/10 rounded-2xl p-6 shadow-sm space-y-4">

                    <h3 className="font-playfair text-2xl text-[#4a4238] border-b border-[#4a4238]/10 pb-3">

                      Check-In History ({checkins.length})

                    </h3>

                    {checkins.length === 0 ? (

                      <p className="font-lora text-xs text-[#4a4238]/60 italic">

                        Your submitted check-in assessments and Ashton&apos;s feedback will appear here.

                      </p>

                    ) : (

                      <div className="space-y-3 max-h-[540px] overflow-y-auto pr-1">

                        {checkins.map(ci => (

                          <div key={ci.id} className="bg-[#fdfbf7] border border-[#4a4238]/10 rounded-xl p-4 space-y-2 font-lora">

                            <div className="flex items-center justify-between gap-2">

                              <span className="text-xs font-bold text-[#4a4238]">

                                Step {ci.step_num} • {new Date(ci.created_at).toLocaleDateString()}

                              </span>

                              <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold uppercase ${

                                ci.reviewed ? 'bg-[#798771]/15 text-[#798771]' : 'bg-amber-100 text-amber-800'

                              }`}>

                                {ci.reviewed ? 'Reviewed' : 'Pending Review'}

                              </span>

                            </div>

                            {ci.wins && <p className="text-xs text-[#4a4238]/85"><strong>Wins:</strong> {ci.wins}</p>}

                            {ci.questions && <p className="text-xs text-[#4a4238]/75"><strong>Questions:</strong> {ci.questions}</p>}

                            {ci.practitioner_feedback && (

                              <div className="bg-white border border-[#798771]/30 rounded-lg p-2.5 text-xs text-[#4a4238]">

                                <strong className="text-[#798771]">Ashton&apos;s Note:</strong> {ci.practitioner_feedback}

                              </div>

                            )}

                          </div>

                        ))}

                      </div>

                    )}

                  </div>

                </div>

              )}

            </div>

          )}



          {subTab === 'messages' && (

            <div className="bg-white border border-[#4a4238]/10 rounded-2xl p-6 shadow-sm max-w-3xl mx-auto space-y-5">

              <div className="border-b border-[#4a4238]/10 pb-4">

                <span className="text-xs font-lora font-bold uppercase tracking-widest text-[#798771]">Direct Communication Channel</span>

                <h3 className="font-playfair text-2xl text-[#4a4238]">Messages with Ashton</h3>

                <p className="font-lora text-xs text-[#4a4238]/65 mt-1">

                  {isOneOnOne

                    ? 'Private 1:1 coaching thread for questions, check-in follow-ups, and encouragement.'

                    : 'Reach out anytime if you have a question about a step or meal slot.'}

                </p>

              </div>



              <div className="space-y-3 max-h-[380px] overflow-y-auto bg-[#fdfbf7] border border-[#4a4238]/10 rounded-xl p-4">

                {messages.length === 0 ? (

                  <p className="font-lora text-xs text-center text-[#4a4238]/55 py-8 italic">

                    No messages yet. Say hello or ask a question below!

                  </p>

                ) : (

                  messages.map(m => {

                    const fromMe = m.sender_role === 'client';

                    return (

                      <div key={m.id} className={`flex ${fromMe ? 'justify-end' : 'justify-start'}`}>

                        <div className={`max-w-[82%] rounded-2xl px-4 py-3 font-lora text-sm space-y-1 ${

                          fromMe

                            ? 'bg-[#798771] text-white rounded-br-sm'

                            : 'bg-white text-[#4a4238] border border-[#4a4238]/15 rounded-bl-sm'

                        }`}>

                          <p className="leading-relaxed whitespace-pre-wrap">{m.body}</p>

                          <span className={`block text-[10px] ${fromMe ? 'text-white/75' : 'text-[#4a4238]/50'}`}>

                            {fromMe ? 'You' : 'Ashton'} • {new Date(m.created_at).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })}

                          </span>

                        </div>

                      </div>

                    );

                  })

                )}

              </div>



              <form onSubmit={handleSendMsgSubmit} className="flex flex-col sm:flex-row gap-2.5">

                <input

                  type="text"

                  value={msgDraft}

                  onChange={e => setMsgDraft(e.target.value)}

                  placeholder="Write a message to Ashton..."

                  className="flex-1 bg-[#fdfbf7] border border-[#4a4238]/20 rounded-full px-4 py-2.5 font-lora text-sm text-[#4a4238] focus:outline-none focus:border-[#798771]"

                />

                <button

                  type="submit"

                  disabled={!msgDraft.trim() || msgSending}

                  className="inline-flex items-center justify-center gap-2 bg-[#798771] text-white px-6 py-2.5 rounded-full font-lora text-xs font-bold uppercase tracking-wider hover:bg-[#6b7764] transition-colors disabled:opacity-45"

                >

                  <Send size={14} /> {msgSending ? 'Sending...' : 'Send'}

                </button>

              </form>

            </div>

          )}

        </div>

      );

    }



    function PractitionerStudioView({

      enrollments,

      checkins,

      messages,

      waitlist,

      dbWarning,

      onRefreshAll,

      onSaveClient,

      onGrantClientAccess,

      onReviewCheckin,

      onSendReply,

      onConvertWaitlist

    }) {

      const [studioTab, setStudioTab] = useState('triage'); // 'triage' | 'clients' | 'checkins' | 'messages' | 'waitlist'

      const [selectedClientId, setSelectedClientId] = useState(enrollments[0]?.user_id || '');

      const [msgFilter, setMsgFilter] = useState('all'); // 'all' | 'unread' | 'one_on_one' | 'self_paced'

      const [checkinFilter, setCheckinFilter] = useState('pending'); // 'pending' | 'all'

      const [replyDraft, setReplyDraft] = useState('');

      const [feedbackMap, setFeedbackMap] = useState({});

      const [studioNotice, setStudioNotice] = useState('');



      const [showGrantForm, setShowGrantForm] = useState(false);

      const [grantEmail, setGrantEmail] = useState('');

      const [grantName, setGrantName] = useState('');

      const [grantTier, setGrantTier] = useState('self_paced');



      const selectedClient = enrollments.find(e => e.user_id === selectedClientId) || enrollments[0] || null;

      const [editForm, setEditForm] = useState(null);



      useEffect(() => {

        if (!selectedClient) {

          setEditForm(null);

          return;

        }

        setEditForm({

          user_id: selectedClient.user_id,

          client_name: selectedClient.client_name || '',

          tier: selectedClient.tier || 'self_paced',

          active_step: Number(selectedClient.active_step) || 1,

          required_days: Number(selectedClient.required_days) || 14,

          target_compliance_pct: Number(selectedClient.target_compliance_pct) || 90,

          days_completed: Number(selectedClient.days_completed) || 0,

          wod_tier_override: selectedClient.wod_tier_override || 'auto',

          custom_daily_task: selectedClient.custom_daily_task || '',

          meal_slots: { ...DEFAULT_WELLNESS_MEAL_SLOTS, ...(selectedClient.meal_slots || {}) },

          fullscript_supplement_url: selectedClient.fullscript_supplement_url || '',

          fullscript_lab_url: selectedClient.fullscript_lab_url || '',

          fullscript_lab_status: selectedClient.fullscript_lab_status || 'None',

          doterra_url: selectedClient.doterra_url || '',

          uses_practice_better: !!selectedClient.uses_practice_better,

          practice_better_url: selectedClient.practice_better_url || '',

          practitioner_notes: selectedClient.practitioner_notes || ''

        });

      }, [selectedClient?.user_id, selectedClient?.updated_at]);



      const flashNotice = (txt) => {

        setStudioNotice(txt);

        setTimeout(() => setStudioNotice(''), 3500);

      };



      const unreadCountForClient = (uid) =>

        messages.filter(m => m.client_user_id === uid && m.sender_role === 'client' && !m.is_read).length;



      const pendingCheckinsForClient = (uid) =>

        checkins.filter(ci => ci.user_id === uid && !ci.reviewed).length;



      const totalPendingCheckins = checkins.filter(ci => !ci.reviewed).length;

      const totalUnreadMsgs = messages.filter(m => m.sender_role === 'client' && !m.is_read).length;



      const triageLanes = useMemo(() => {

        const actionNeeded = [];

        const unreadMsgs = [];

        const lowEnergy = [];

        const cruising = [];



        enrollments.forEach(cli => {

          const reqDays = Math.ceil(((Number(cli.required_days) || 14) * (Number(cli.target_compliance_pct) || 90)) / 100);

          const hasPendingCi = pendingCheckinsForClient(cli.user_id) > 0;

          const isGateReady = (Number(cli.days_completed) || 0) >= reqDays;

          const hasUnread = unreadCountForClient(cli.user_id) > 0;

          const isLowEnergy = !!cli.easy_mode_today || (Number(cli.easy_days_streak) || 0) >= 3;



          if (hasPendingCi || isGateReady) actionNeeded.push({ cli, hasPendingCi, isGateReady });

          else if (hasUnread) unreadMsgs.push({ cli });

          else if (isLowEnergy) lowEnergy.push({ cli });

          else cruising.push({ cli });

        });



        return { actionNeeded, unreadMsgs, lowEnergy, cruising };

      }, [enrollments, checkins, messages]);



      const handleSaveEditForm = async (e) => {

        e.preventDefault();

        if (!editForm) return;

        const ok = await onSaveClient(editForm);

        if (ok) flashNotice(`Saved updates for ${editForm.client_name || selectedClient?.client_email}.`);

      };



      const handleGrantSubmit = async (e) => {

        e.preventDefault();

        if (!grantEmail.trim()) return;

        const res = await onGrantClientAccess({

          email: grantEmail.trim().toLowerCase(),

          client_name: grantName.trim(),

          tier: grantTier

        });

        if (res.ok) {

          setGrantEmail('');

          setGrantName('');

          setShowGrantForm(false);

          flashNotice(res.message);

        } else {

          flashNotice(res.message);

        }

      };



      const handleSendStudioReply = async (e) => {

        e.preventDefault();

        if (!selectedClient || !replyDraft.trim()) return;

        const ok = await onSendReply(selectedClient.user_id, replyDraft.trim());

        if (ok) {

          setReplyDraft('');

          flashNotice(`Message sent to ${selectedClient.client_name || selectedClient.client_email}.`);

        }

      };



      const filteredInboxClients = enrollments.filter(cli => {

        if (msgFilter === 'unread') return unreadCountForClient(cli.user_id) > 0;

        if (msgFilter === 'one_on_one') return cli.tier === 'one_on_one';

        if (msgFilter === 'self_paced') return cli.tier !== 'one_on_one';

        return true;

      });



      const selectedClientMessages = selectedClient

        ? messages.filter(m => m.client_user_id === selectedClient.user_id)

        : [];



      const visibleCheckins = checkins.filter(ci => (checkinFilter === 'pending' ? !ci.reviewed : true));



      return (

        <div className="space-y-8">

          <div className="bg-white border border-[#4a4238]/15 rounded-2xl p-6 shadow-sm space-y-5">

            <div className="flex flex-col lg:flex-row lg:items-center justify-between gap-4">

              <div>

                <span className="font-lora text-xs font-bold uppercase tracking-widest text-[#798771] block">

                  Honeysuckle &amp; Co. • Practitioner Studio

                </span>

                <h2 className="font-playfair text-3xl italic text-[#4a4238]">

                  Wellness Practice Command Center

                </h2>

              </div>



              <div className="flex flex-wrap items-center gap-2">

                <a

                  href={WELLNESS_CONFIG.practiceBetterUrl}

                  target="_blank"

                  rel="noopener noreferrer"

                  className="inline-flex items-center gap-1.5 px-4 py-2 rounded-full bg-[#4a4238] text-white font-lora text-xs font-bold hover:bg-[#3a332b] transition-colors"

                >

                  Practice Better EHR <ExternalLink size={13} />

                </a>

                <a

                  href={WELLNESS_CONFIG.fullscriptUrl}

                  target="_blank"

                  rel="noopener noreferrer"

                  className="inline-flex items-center gap-1.5 px-4 py-2 rounded-full bg-[#798771] text-white font-lora text-xs font-bold hover:bg-[#6b7764] transition-colors"

                >

                  Fullscript (Labs &amp; Supps) <ExternalLink size={13} />

                </a>

                <a

                  href={WELLNESS_CONFIG.doterraUrl}

                  target="_blank"

                  rel="noopener noreferrer"

                  className="inline-flex items-center gap-1.5 px-4 py-2 rounded-full bg-[#fdfbf7] text-[#4a4238] border border-[#4a4238]/25 font-lora text-xs font-bold hover:border-[#798771] transition-colors"

                >

                  doTERRA <ExternalLink size={13} />

                </a>

                <button

                  type="button"

                  onClick={onRefreshAll}

                  className="p-2 rounded-full bg-[#fdfbf7] border border-[#4a4238]/15 text-[#4a4238]/70 hover:text-[#798771]"

                  title="Refresh client data"

                >

                  <RotateCcw size={15} />

                </button>

              </div>

            </div>



            {dbWarning && (

              <div className="p-4 rounded-xl bg-amber-50 border border-amber-200 font-lora text-xs text-amber-900 leading-relaxed">

                <strong>Database Setup Needed:</strong> {dbWarning} Run the SQL script inside <code>WELLNESS_HUB_SETUP.md</code> in your Supabase SQL Editor to activate live Wellness Hub syncing.

              </div>

            )}



            <div className="flex flex-wrap items-center justify-between gap-3 pt-3 border-t border-[#4a4238]/10">

              <div className="flex flex-wrap gap-2">

                {[

                  { id: 'triage', label: `Triage Board (${enrollments.length})` },

                  { id: 'clients', label: 'Clients & Protocols' },

                  { id: 'checkins', label: totalPendingCheckins > 0 ? `Check-Ins (${totalPendingCheckins} New)` : 'Check-Ins' },

                  { id: 'messages', label: totalUnreadMsgs > 0 ? `Messages (${totalUnreadMsgs})` : 'Messages' },

                  { id: 'waitlist', label: `January Waitlist (${waitlist.length})` }

                ].map(tab => (

                  <button

                    key={tab.id}

                    type="button"

                    onClick={() => setStudioTab(tab.id)}

                    className={`px-4 py-2 rounded-full font-lora text-xs font-bold tracking-wider border transition-colors ${

                      studioTab === tab.id

                        ? 'bg-[#798771] text-white border-[#798771]'

                        : 'bg-[#fdfbf7] text-[#4a4238]/75 border-[#4a4238]/15 hover:border-[#798771]'

                    }`}

                  >

                    {tab.label}

                  </button>

                ))}

              </div>



              <button

                type="button"

                onClick={() => setShowGrantForm(v => !v)}

                className="inline-flex items-center gap-1.5 px-4 py-2 rounded-full bg-[#4a4238] text-white font-lora text-xs font-bold uppercase tracking-wider hover:bg-[#3a332b]"

              >

                <Plus size={14} /> Grant / Upgrade Client

              </button>

            </div>



            {showGrantForm && (

              <form onSubmit={handleGrantSubmit} className="bg-[#fdfbf7] border border-[#798771]/35 rounded-xl p-4 grid grid-cols-1 md:grid-cols-4 gap-3 items-end font-lora">

                <div>

                  <label className="block text-[11px] font-bold uppercase text-[#798771] mb-1">Client Account Email</label>

                  <input

                    type="email"

                    required

                    value={grantEmail}

                    onChange={e => setGrantEmail(e.target.value)}

                    placeholder="client@example.com"

                    className="w-full bg-white border border-[#4a4238]/20 rounded-lg px-3 py-2 text-xs"

                  />

                </div>

                <div>

                  <label className="block text-[11px] font-bold uppercase text-[#798771] mb-1">Client Name</label>

                  <input

                    type="text"

                    value={grantName}

                    onChange={e => setGrantName(e.target.value)}

                    placeholder="e.g., Hannah Miller"

                    className="w-full bg-white border border-[#4a4238]/20 rounded-lg px-3 py-2 text-xs"

                  />

                </div>

                <div>

                  <label className="block text-[11px] font-bold uppercase text-[#798771] mb-1">Program Tier</label>

                  <select

                    value={grantTier}

                    onChange={e => setGrantTier(e.target.value)}

                    className="w-full bg-white border border-[#4a4238]/20 rounded-lg px-3 py-2 text-xs"

                  >

                    <option value="self_paced">Self-Paced Foundation ($240)</option>

                    <option value="one_on_one">1:1 Guided Client Practice ($900)</option>

                  </select>

                </div>

                <button

                  type="submit"

                  className="bg-[#798771] text-white py-2 px-4 rounded-lg text-xs font-bold uppercase tracking-wider hover:bg-[#6b7764]"

                >

                  Save Access

                </button>

              </form>

            )}

          </div>



          {studioNotice && (

            <div className="bg-[#798771]/15 border border-[#798771]/30 rounded-xl px-5 py-3 font-lora text-xs font-bold text-[#4a4238]">

              {studioNotice}

            </div>

          )}



          {studioTab === 'triage' && (

            <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-5">

              {[

                { title: 'Check-In / Gate Ready', items: triageLanes.actionNeeded, accent: 'border-t-[#798771]' },

                { title: 'Unread Messages', items: triageLanes.unreadMsgs, accent: 'border-t-[#4a4238]' },

                { title: 'Low-Energy Watch', items: triageLanes.lowEnergy, accent: 'border-t-amber-600' },

                { title: 'Steady Cruise', items: triageLanes.cruising, accent: 'border-t-[#798771]/40' }

              ].map((lane, idx) => (

                <div key={idx} className={`bg-white border border-[#4a4238]/10 border-t-4 ${lane.accent} rounded-2xl p-4 shadow-sm space-y-3`}>

                  <div className="flex items-center justify-between">

                    <h3 className="font-playfair text-lg font-bold text-[#4a4238]">{lane.title}</h3>

                    <span className="font-lora text-xs font-bold text-[#798771] bg-[#fdfbf7] px-2 py-0.5 rounded-full border border-[#4a4238]/10">

                      {lane.items.length}

                    </span>

                  </div>

                  {lane.items.length === 0 ? (

                    <p className="font-lora text-xs text-[#4a4238]/50 italic py-4 text-center">No clients in this lane.</p>

                  ) : (

                    lane.items.map(({ cli, hasPendingCi, isGateReady }) => (

                      <div key={cli.user_id} className="bg-[#fdfbf7] border border-[#4a4238]/10 rounded-xl p-3.5 space-y-2 font-lora">

                        <div className="flex items-start justify-between gap-2">

                          <div>

                            <strong className="text-sm text-[#4a4238] block">{cli.client_name || cli.client_email}</strong>

                            <span className="text-[11px] text-[#4a4238]/60">

                              Step {cli.active_step}/12 • {cli.tier === 'one_on_one' ? '1:1 Practice' : 'Self-Paced'}

                            </span>

                          </div>

                          {cli.uses_practice_better && (

                            <span className="px-2 py-0.5 rounded-full bg-[#4a4238] text-white text-[9px] font-bold uppercase">PB EHR</span>

                          )}

                        </div>

                        <div className="flex flex-wrap gap-1 text-[10px] font-bold">

                          {hasPendingCi && <span className="px-2 py-0.5 rounded-full bg-amber-100 text-amber-800">Check-In Ready</span>}

                          {isGateReady && <span className="px-2 py-0.5 rounded-full bg-[#798771]/15 text-[#798771]">90% Gate Met</span>}

                          {unreadCountForClient(cli.user_id) > 0 && <span className="px-2 py-0.5 rounded-full bg-[#4a4238]/10 text-[#4a4238]">Unread Msg</span>}

                        </div>

                        <div className="flex gap-1.5 pt-1">

                          <button

                            type="button"

                            onClick={() => { setSelectedClientId(cli.user_id); setStudioTab('clients'); }}

                            className="flex-1 py-1.5 rounded-lg bg-white border border-[#4a4238]/20 text-[11px] font-bold text-[#4a4238] hover:border-[#798771]"

                          >

                            Customize

                          </button>

                          <button

                            type="button"

                            onClick={() => { setSelectedClientId(cli.user_id); setStudioTab('messages'); }}

                            className="flex-1 py-1.5 rounded-lg bg-[#798771] text-white text-[11px] font-bold hover:bg-[#6b7764]"

                          >

                            Message

                          </button>

                        </div>

                      </div>

                    ))

                  )}

                </div>

              ))}

            </div>

          )}



          {studioTab === 'clients' && (

            <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">

              <div className="lg:col-span-4 bg-white border border-[#4a4238]/10 rounded-2xl p-5 shadow-sm space-y-3">

                <h3 className="font-playfair text-xl text-[#4a4238] border-b border-[#4a4238]/10 pb-2">

                  Enrolled Clients ({enrollments.length})

                </h3>

                {enrollments.length === 0 ? (

                  <p className="font-lora text-xs text-[#4a4238]/60 italic py-4">

                    No enrolled clients yet. Use &ldquo;Grant / Upgrade Client&rdquo; above to add yourself or a beta client!

                  </p>

                ) : (

                  <div className="space-y-2 max-h-[600px] overflow-y-auto pr-1">

                    {enrollments.map(cli => (

                      <button

                        key={cli.user_id}

                        type="button"

                        onClick={() => setSelectedClientId(cli.user_id)}

                        className={`w-full text-left p-3.5 rounded-xl border transition-all font-lora ${

                          selectedClient?.user_id === cli.user_id

                            ? 'bg-[#798771]/12 border-[#798771]'

                            : 'bg-[#fdfbf7] border-[#4a4238]/10 hover:border-[#798771]/50'

                        }`}

                      >

                        <div className="flex items-center justify-between gap-2">

                          <strong className="text-sm text-[#4a4238] truncate">{cli.client_name || cli.client_email}</strong>

                          <span className="text-[10px] font-bold uppercase text-[#798771] shrink-0">Step {cli.active_step}</span>

    function LandingPage({ onAuthSuccess, onOpenGuestShop, cartItemCount, onOpenCart }) {

      const [mode, setMode] = useState('signup'); // 'signup' | 'login' | 'reset'

      const [householdName, setHouseholdName] = useState('');

      const [email, setEmail] = useState('');

      const [password, setPassword] = useState('');

      const [loading, setLoading] = useState(false);

      const [errorMsg, setErrorMsg] = useState('');

      const [infoMsg, setInfoMsg] = useState('');



      const handleSubmit = async (e) => {

        e.preventDefault();

        setErrorMsg('');

        setInfoMsg('');

        if (!supabaseClient) {

          setErrorMsg('Unable to connect to Supabase right now. Please refresh and try again.');

          return;

        }

        setLoading(true);



        try {

          if (mode === 'reset') {

            const { error } = await supabaseClient.auth.resetPasswordForEmail(email.trim(), {

              redirectTo: window.location.origin

            });

            if (error) throw error;

            setInfoMsg('Password reset link sent! Please check your email inbox.');

          } else if (mode === 'login') {

            const { data, error } = await supabaseClient.auth.signInWithPassword({

              email: email.trim(),

              password

            });

            if (error) throw error;

            if (data?.user) onAuthSuccess(data.user);

          } else {

            const { data, error } = await supabaseClient.auth.signUp({

              email: email.trim(),

              password,

              options: {

                data: {

                  household_name: householdName.trim() || 'Member Household'

                }

              }

            });

            if (error) throw error;

            if (data?.session && data?.user) {

              onAuthSuccess(data.user);

            } else {

              setInfoMsg('Account created! Please check your email to confirm your account, then log in.');

              setMode('login');

            }

          }

        } catch (err) {

          setErrorMsg(err?.message || 'Something went wrong. Please double-check your email and password.');

        } finally {

          setLoading(false);

        }

      };



      const featureHighlights = [

        { title: "Today's Command Center", desc: 'One calm daily checklist combining meals, weekly cleaning zones, daily resets, and personal priorities.' },

        { title: 'Scratch Kitchen & Grocery List', desc: '1800s-inspired meals scaled automatically to your family size, with an in-store digital or printable shopping list.' },

        { title: 'Apothecary & Clean Swaps', desc: '60 traditional wellness remedies, 36 household swaps, and 36 scratch-made non-toxic cleaning formulas.' },

        { title: 'Room-by-Room Auto-Pilot', desc: 'Customize the exact rooms in your home and generate automatic daily, weekly, monthly, and yearly rhythms.' }

      ];



      return (

        <div className="min-h-screen bg-[#fdfbf7] text-[#4a4238] flex flex-col items-center justify-center px-6 py-10">

          <div className="max-w-5xl w-full space-y-10">

            <div className="flex items-center justify-between border-b border-[#4a4238]/10 pb-4">

              <span className="font-cormorant text-lg tracking-[0.22em] text-[#4a4238] font-semibold">

                HONEYSUCKLE &amp; CO.

              </span>

              <div className="flex items-center gap-3">

                <button

                  type="button"

                  onClick={onOpenGuestShop}

                  className="px-4 py-2 rounded-full bg-white border border-[#4a4238]/20 font-lora text-xs font-bold uppercase tracking-wider text-[#4a4238] hover:border-[#798771] hover:text-[#798771] transition-colors"

                >

                  Shop Goods &amp; Guides

                </button>

                <button

                  type="button"

                  onClick={onOpenCart}

                  className="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-full bg-[#798771] text-white font-lora text-xs font-bold uppercase tracking-wider hover:bg-[#6b7764] transition-colors"

                >

                  <ShoppingBag size={14} /> Bag ({cartItemCount})

                </button>

              </div>

            </div>



            <div className="text-center space-y-2">

              <p className="font-cormorant text-3xl md:text-4xl tracking-[0.22em] text-[#4a4238] font-medium">

                HONEYSUCKLE &amp; CO.

              </p>

              <p className="font-lora text-sm text-[#798771] italic">

                Returning to what&apos;s real: home, food, &amp; faith.

              </p>

            </div>



            <div className="grid grid-cols-1 lg:grid-cols-12 gap-10 items-center">

              <div className="lg:col-span-7 text-center lg:text-left space-y-6">

                <div className="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-[#798771]/10 text-[#798771] font-lora text-xs font-bold uppercase tracking-widest border border-[#798771]/20">

                  <Sparkles size={14} /> The All-In-One Low-Toxin Home &amp; Kitchen OS

                </div>



                <h1 className="font-playfair text-4xl md:text-5xl leading-tight text-[#4a4238]">

                  Stop Juggling 5 Apps, Paper Lists,{' '}

                  <span className="italic text-[#798771]">and a Frantic 5:00 PM Brain.</span>

                </h1>



                <p className="font-lora text-base text-[#4a4238]/80 leading-relaxed">

                  Most apps only solve one tiny slice of running a home—forcing you to bounce between a meal planner, a chore chart, and stained recipe binders. <strong>Honeysuckle Hub connects your entire household into one peaceful operating system</strong> that saves everything to your private account.

                </p>



                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-2 text-left">

                  {featureHighlights.map((f, idx) => (

                    <div key={idx} className="bg-white border border-[#4a4238]/10 rounded-xl p-4 shadow-sm">

                      <h3 className="font-playfair text-base font-bold text-[#4a4238] mb-1">{f.title}</h3>

                      <p className="font-lora text-xs text-[#4a4238]/70 leading-relaxed">{f.desc}</p>

                    </div>

                  ))}

                </div>

              </div>



              <div className="lg:col-span-5">

                <div className="bg-white border border-[#4a4238]/15 rounded-2xl p-8 shadow-xl">

                  <div className="flex border-b border-[#4a4238]/10 mb-6">

                    <button

                      type="button"

                      onClick={() => { setMode('signup'); setErrorMsg(''); setInfoMsg(''); }}

                      className={`flex-1 pb-3 font-lora text-xs font-bold uppercase tracking-wider transition-colors border-b-2 ${

                        mode === 'signup' ? 'border-[#798771] text-[#798771]' : 'border-transparent text-[#4a4238]/50 hover:text-[#4a4238]'

                      }`}

                    >

                      Free Sign Up

                    </button>

                    <button

                      type="button"

                      onClick={() => { setMode('login'); setErrorMsg(''); setInfoMsg(''); }}

                      className={`flex-1 pb-3 font-lora text-xs font-bold uppercase tracking-wider transition-colors border-b-2 ${

                        mode === 'login' ? 'border-[#798771] text-[#798771]' : 'border-transparent text-[#4a4238]/50 hover:text-[#4a4238]'

                      }`}

                    >

                      Member Log In

                    </button>

                  </div>



                  <h2 className="font-playfair text-2xl font-bold mb-1 text-[#4a4238]">

                    {mode === 'signup' ? 'Create Your Free Account' : mode === 'login' ? 'Welcome Back' : 'Reset Your Password'}

                  </h2>

                  <p className="font-lora text-xs text-[#4a4238]/65 mb-6">

                    {mode === 'signup'

                      ? 'Save your meal plans, grocery lists, and home rhythms across all your devices.'

                      : mode === 'login'

                      ? 'Log in with your existing Honeysuckle Hub email and password.'

                      : 'Enter your email and we will send you a password reset link.'}

                  </p>



                  {errorMsg && (

                    <div className="mb-4 p-3 rounded-xl bg-red-50 border border-red-200 font-lora text-xs text-red-800">

                      {errorMsg}

                    </div>

                  )}

                  {infoMsg && (

                    <div className="mb-4 p-3 rounded-xl bg-[#798771]/10 border border-[#798771]/25 font-lora text-xs text-[#4a4238]">

                      {infoMsg}

                    </div>

                  )}



                  <form onSubmit={handleSubmit} className="space-y-4 font-lora text-left">

                    {mode === 'signup' && (

                      <div>

                        <label className="block text-xs font-bold uppercase tracking-wider text-[#798771] mb-1.5">

                          Household Name (Optional)

                        </label>

                        <input

                          type="text"

                          value={householdName}

                          onChange={e => setHouseholdName(e.target.value)}

                          className="w-full bg-[#fdfbf7] border border-[#4a4238]/20 rounded-xl px-4 py-3 text-sm text-[#4a4238] focus:outline-none focus:border-[#798771]"

                          placeholder="e.g., The Miller Home"

                        />

                      </div>

                    )}



                    <div>

                      <label className="block text-xs font-bold uppercase tracking-wider text-[#798771] mb-1.5">

                        Email Address

                      </label>

                      <input

                        type="email"

                        required

                        value={email}

                        onChange={e => setEmail(e.target.value)}

                        className="w-full bg-[#fdfbf7] border border-[#4a4238]/20 rounded-xl px-4 py-3 text-sm text-[#4a4238] focus:outline-none focus:border-[#798771]"

                        placeholder="you@example.com"

                      />

                    </div>



                    {mode !== 'reset' && (

                      <div>

                        <label className="block text-xs font-bold uppercase tracking-wider text-[#798771] mb-1.5">

                          Password

                        </label>

                        <input

                          type="password"

                          required

                          minLength={6}

                          value={password}

                          onChange={e => setPassword(e.target.value)}

                          className="w-full bg-[#fdfbf7] border border-[#4a4238]/20 rounded-xl px-4 py-3 text-sm text-[#4a4238] focus:outline-none focus:border-[#798771]"

                          placeholder="••••••••"

                        />

                      </div>

                    )}



                    <button

                      type="submit"

                      disabled={loading}

                      className="w-full bg-[#798771] text-white py-3.5 rounded-xl font-bold uppercase tracking-wider text-xs hover:bg-[#6b7764] transition-colors mt-2 disabled:opacity-50"

                    >

                      {loading

                        ? 'Please wait...'

                        : mode === 'signup'

                        ? 'Sign Up for Free'

                        : mode === 'login'

                        ? 'Log In to My Hub'

                        : 'Send Reset Link'}

                    </button>

                  </form>



                  <div className="mt-5 pt-5 border-t border-[#4a4238]/10 text-center font-lora text-xs space-y-2">

                    {mode === 'login' && (

                      <button

                        type="button"

                        onClick={() => { setMode('reset'); setErrorMsg(''); setInfoMsg(''); }}

                        className="text-[#4a4238]/60 hover:text-[#798771] underline block mx-auto"

                      >

                        Forgot your password?

                      </button>

                    )}

                    {mode === 'reset' && (

                      <button

                        type="button"

                        onClick={() => { setMode('login'); setErrorMsg(''); setInfoMsg(''); }}

                        className="text-[#798771] font-bold hover:underline"

                      >

                        Back to Member Log In

                      </button>

                    )}

                  </div>

                </div>

              </div>

            </div>

          </div>

        </div>

      );

    }

       // =========================================================================

    // MAIN APPLICATION

    // =========================================================================

    function App() {

      const [authChecked, setAuthChecked] = useState(false);

      const [currentUser, setCurrentUser] = useState(null);

      const [householdName, setHouseholdName] = useState('Member Household');

      const [syncStatus, setSyncStatus] = useState('idle'); // 'loading' | 'saving' | 'synced' | 'local'



      // Cloud sync refs (prevents overwriting cloud data before load finishes & preserves legacy keys)

      const cloudReadyRef = useRef(false);

      const rawCloudStateRef = useRef({});

      const syncTimerRef = useRef(null);



      const [activeTab, setActiveTab] = useState('home');



      // Roster State

      const [adults, setAdults] = useState(2);

      const [kids, setKids] = useState(4);

      const [toddlers, setToddlers] = useState(1);

      const [babies, setBabies] = useState(1);



      // Kitchen State

      const [includeBreakfast, setIncludeBreakfast] = useState(false);

      const [includeLunch, setIncludeLunch] = useState(false);

      const [weeklyPlan, setWeeklyPlan] = useState(DEFAULT_WEEKLY_PLAN);



      // Modal & Filter States

      const [selectedRecipe, setSelectedRecipe] = useState(null);

      const [activeFilter, setActiveFilter] = useState('All');

      const [swapsView, setSwapsView] = useState('guide');

      const [activeSwapsFilter, setActiveSwapsFilter] = useState('All');

      const [activeCleanersFilter, setActiveCleanersFilter] = useState('All');

      const [activeApothFilter, setActiveApothFilter] = useState('All');



      // Room Auto-Pilot State

      const [myRooms, setMyRooms] = useState(DEFAULT_ROOMS_PROFILE);

      const [roomTasks, setRoomTasks] = useState(() => generateDefaultRoomTasksArray(DEFAULT_ROOMS_PROFILE));

      const [activeTaskTier, setActiveTaskTier] = useState('daily');

      const [editingRoom, setEditingRoom] = useState(null);

      const [isRoomModalOpen, setIsRoomModalOpen] = useState(false);



      // Command Center (Home) State

      const [homeDay, setHomeDay] = useState(getTodayWeekdayName());

      const [checkedHomeMeals, setCheckedHomeMeals] = useState({});

      const [dailyPriorities, setDailyPriorities] = useState(DEFAULT_PRIORITIES);



      // Grocery List State

      const [checkedGroceryKeys, setCheckedGroceryKeys] = useState({});

      const [hideCheckedGrocery, setHideCheckedGrocery] = useState(false);

      const [customGroceryItems, setCustomGroceryItems] = useState([]);

      const [isPrintModalOpen, setIsPrintModalOpen] = useState(false);

      const [copiedList, setCopiedList] = useState(false);

      const [printNotice, setPrintNotice] = useState('');



      // Shop & Cart State (available for both guests and logged-in members)

      const [guestView, setGuestView] = useState('landing'); // 'landing' | 'shop'

      const [cart, setCart] = useState(() => {

        try {

          const saved = localStorage.getItem('hh_shop_cart');

          return saved ? JSON.parse(saved) : [];

        } catch (e) {

          return [];

        }

      });

      const [isCartOpen, setIsCartOpen] = useState(false);

      const [selectedProduct, setSelectedProduct] = useState(null);



      // Wellness Hub & Practitioner Studio State

      const isPractitioner = (currentUser?.email || '').toLowerCase() === PRACTITIONER_EMAIL;

      const [wellnessEnrollment, setWellnessEnrollment] = useState(null);

      const [wellnessCheckins, setWellnessCheckins] = useState([]);

      const [wellnessMessages, setWellnessMessages] = useState([]);

      const [waitlistSubmitted, setWaitlistSubmitted] = useState(false);

      const [wellnessWelcomeBanner, setWellnessWelcomeBanner] = useState(false);

      const [wellnessWodOpen, setWellnessWodOpen] = useState(false);

      const [wellnessMealSlotKey, setWellnessMealSlotKey] = useState(null);



      // Practitioner-only Studio State

      const [practitionerMode, setPractitionerMode] = useState(true);

      const [allEnrollments, setAllEnrollments] = useState([]);

      const [allCheckins, setAllCheckins] = useState([]);

      const [allMessages, setAllMessages] = useState([]);

      const [allWaitlist, setAllWaitlist] = useState([]);

      const [wellnessDbWarning, setWellnessDbWarning] = useState('');



      // Persist cart locally immediately whenever changed

      useEffect(() => {

        try {

          localStorage.setItem('hh_shop_cart', JSON.stringify(cart));

        } catch (e) {}

      }, [cart]);



      // -----------------------------------------------------------------------

      // 1. SUPABASE AUTH SESSION LISTENER

      // -----------------------------------------------------------------------

      useEffect(() => {

        if (!supabaseClient) {

          setAuthChecked(true);

          return;

        }

        let mounted = true;



        supabaseClient.auth.getSession().then(({ data }) => {

          if (!mounted) return;

          setCurrentUser(data?.session?.user || null);

          setAuthChecked(true);

        }).catch(() => {

          if (mounted) setAuthChecked(true);

        });



        const { data: { subscription } } = supabaseClient.auth.onAuthStateChange((_event, session) => {

          if (!mounted) return;

          setCurrentUser(session?.user || null);

          setAuthChecked(true);

        });



        return () => {

          mounted = false;

          subscription?.unsubscribe();

        };

      }, []);



      // -----------------------------------------------------------------------

      // 2. LOAD MEMBER DATA FROM SUPABASE (AND LOCAL STORAGE FALLBACK)

      // -----------------------------------------------------------------------

      useEffect(() => {

        if (!currentUser) {

          cloudReadyRef.current = false;

          rawCloudStateRef.current = {};

          return;

        }



        let cancelled = false;

        cloudReadyRef.current = false;

        setSyncStatus('loading');



        const applySavedV2 = (v2, fallbackRooms, fallbackTasks) => {

          if (v2 && typeof v2 === 'object') {

            if (typeof v2.adults === 'number') setAdults(v2.adults);

            if (typeof v2.kids === 'number') setKids(v2.kids);

            if (typeof v2.toddlers === 'number') setToddlers(v2.toddlers);

            if (typeof v2.babies === 'number') setBabies(v2.babies);

            if (typeof v2.includeBreakfast === 'boolean') setIncludeBreakfast(v2.includeBreakfast);

            if (typeof v2.includeLunch === 'boolean') setIncludeLunch(v2.includeLunch);

            if (v2.weeklyPlan && typeof v2.weeklyPlan === 'object') setWeeklyPlan(v2.weeklyPlan);

            if (Array.isArray(v2.myRooms)) setMyRooms(v2.myRooms);

            if (Array.isArray(v2.roomTasks)) setRoomTasks(v2.roomTasks);

            if (v2.checkedHomeMeals && typeof v2.checkedHomeMeals === 'object') setCheckedHomeMeals(v2.checkedHomeMeals);

            if (Array.isArray(v2.dailyPriorities)) setDailyPriorities(v2.dailyPriorities);

            if (v2.checkedGroceryKeys && typeof v2.checkedGroceryKeys === 'object') setCheckedGroceryKeys(v2.checkedGroceryKeys);

            if (typeof v2.hideCheckedGrocery === 'boolean') setHideCheckedGrocery(v2.hideCheckedGrocery);

            if (Array.isArray(v2.customGroceryItems)) setCustomGroceryItems(v2.customGroceryItems);

            if (Array.isArray(v2.cart) && v2.cart.length > 0) setCart(v2.cart);

          } else {

            // Carry over rooms & room tasks from legacy Honeysuckle Hub accounts if present

            if (Array.isArray(fallbackRooms) && fallbackRooms.length > 0) setMyRooms(fallbackRooms);

            if (Array.isArray(fallbackTasks) && fallbackTasks.length > 0) setRoomTasks(fallbackTasks);

          }

        };



        async function loadMemberData() {

          const localCacheKey = `hh_v2_${currentUser.id}`;

          const metaName = currentUser.user_metadata?.household_name;

          if (metaName) setHouseholdName(metaName);



          // Load fast local cache first if available

          try {

            const localRaw = localStorage.getItem(localCacheKey);

            if (localRaw) {

              applySavedV2(JSON.parse(localRaw));

            }

          } catch (e) {}



          try {

            // Multi-row safe lookup matching your existing Supabase schema

            const { data: rows, error } = await supabaseClient

              .from('household_planners')

              .select('state, household_name, updated_at')

              .eq('user_id', currentUser.id)

              .order('updated_at', { ascending: false })

              .limit(1);



            if (cancelled) return;



            const row = (!error && Array.isArray(rows) && rows.length > 0) ? rows[0] : null;

            if (row) {

              if (row.household_name) setHouseholdName(row.household_name);

              const cloudState = (row.state && typeof row.state === 'object') ? row.state : {};

              rawCloudStateRef.current = cloudState;



              const v2 = cloudState.honeysuckleV2 || null;

              const legacyRooms = cloudState.home_rooms_profile || cloudState.roomsProfile || null;

              const legacyTasks = cloudState.home_room_tasks || cloudState.roomTasks || null;



              applySavedV2(v2, legacyRooms, legacyTasks);

            }

            setSyncStatus('synced');

          } catch (err) {

            if (!cancelled) setSyncStatus('local');

          } finally {

            if (!cancelled) {

              setTimeout(() => {

                cloudReadyRef.current = true;

              }, 200);

            }

          }

        }



        loadMemberData();



        return () => {

          cancelled = true;

        };

      }, [currentUser]);



      // -----------------------------------------------------------------------

      // 2B. LOAD WELLNESS HUB DATA FROM SUPABASE (CLIENT + PRACTITIONER)

      // -----------------------------------------------------------------------

      const loadWellnessData = async (userObj) => {

        if (!userObj || !supabaseClient) return;

        setWellnessDbWarning('');

        const isAdmin = (userObj.email || '').toLowerCase() === PRACTITIONER_EMAIL;



        try {

          const { data: myEnr, error: enrErr } = await supabaseClient

            .from('wellness_enrollments')

            .select('*')

            .eq('user_id', userObj.id)

            .maybeSingle();



          if (enrErr) {

            if (enrErr.code === '42P01' || /does not exist|schema cache/i.test(enrErr.message || '')) {

              setWellnessDbWarning('Wellness Hub tables are not created in Supabase yet.');

            }

            return;

          }



          setWellnessEnrollment(myEnr || null);



          const [{ data: myCis }, { data: myMsgs }, { data: myWl }] = await Promise.all([

            supabaseClient

              .from('wellness_checkins')

              .select('*')

              .eq('user_id', userObj.id)

              .order('created_at', { ascending: false }),

            supabaseClient

              .from('wellness_messages')

              .select('*')

              .eq('client_user_id', userObj.id)

              .order('created_at', { ascending: true }),

            supabaseClient

              .from('wellness_waitlist')

              .select('id')

              .eq('email', userObj.email)

              .limit(1)

          ]);



          setWellnessCheckins(Array.isArray(myCis) ? myCis : []);

          setWellnessMessages(Array.isArray(myMsgs) ? myMsgs : []);

          setWaitlistSubmitted(Array.isArray(myWl) && myWl.length > 0);



          if (isAdmin) {

            const [

              { data: adminEnrs },

              { data: adminCis },

              { data: adminMsgs },

              { data: adminWl }

            ] = await Promise.all([

              supabaseClient.from('wellness_enrollments').select('*').order('updated_at', { ascending: false }),

              supabaseClient.from('wellness_checkins').select('*').order('created_at', { ascending: false }),

              supabaseClient.from('wellness_messages').select('*').order('created_at', { ascending: true }),

              supabaseClient.from('wellness_waitlist').select('*').order('created_at', { ascending: false })

            ]);

            setAllEnrollments(Array.isArray(adminEnrs) ? adminEnrs : []);

            setAllCheckins(Array.isArray(adminCis) ? adminCis : []);

            setAllMessages(Array.isArray(adminMsgs) ? adminMsgs : []);

            setAllWaitlist(Array.isArray(adminWl) ? adminWl : []);

          }

        } catch (err) {

          setWellnessDbWarning('Could not reach Wellness Hub tables yet.');

        }

      };



      useEffect(() => {

        if (!currentUser) {

          setWellnessEnrollment(null);

          setWellnessCheckins([]);

          setWellnessMessages([]);

          setWaitlistSubmitted(false);

          return;

        }

        loadWellnessData(currentUser);



        // Detect instant return from Stripe checkout (?welcome_wellness=true)

        try {

          const params = new URLSearchParams(window.location.search);

          if (params.get('welcome_wellness') === 'true') {

            setActiveTab('wellness');

            setWellnessWelcomeBanner(true);

            setTimeout(() => loadWellnessData(currentUser), 2000);

            window.history.replaceState({}, document.title, window.location.pathname);

          }

        } catch (_err) {}

      }, [currentUser]);



      // Wellness Hub Mutations (Client & Practitioner)

      const patchMyWellnessEnrollment = async (patch) => {

        if (!currentUser || !wellnessEnrollment) return;

        const nextRow = { ...wellnessEnrollment, ...patch, updated_at: new Date().toISOString() };

        setWellnessEnrollment(nextRow);

        if (!supabaseClient) return;

        try {

          await supabaseClient

            .from('wellness_enrollments')

            .update({ ...patch, updated_at: nextRow.updated_at })

            .eq('user_id', currentUser.id);

        } catch (_err) {}

      };



      const signWellnessAgreement = async (typedName) => {

        await patchMyWellnessEnrollment({

          client_name: typedName,

          agreement_signed: true,

          agreement_name: typedName,

          agreement_signed_at: new Date().toISOString()

        });

      };



      const submitWellnessCheckin = async (payload) => {

        if (!currentUser || !supabaseClient) return false;

        try {

          const row = { user_id: currentUser.id, ...payload, reviewed: false };

          const { data, error } = await supabaseClient

            .from('wellness_checkins')

            .insert([row])

            .select()

            .single();

          if (error) throw error;

          setWellnessCheckins(prev => [data, ...prev]);

          await patchMyWellnessEnrollment({ last_checkin_at: new Date().toISOString() });

          return true;

        } catch (_err) {

          return false;

        }

      };



      const sendClientWellnessMessage = async (body) => {

        if (!currentUser || !supabaseClient) return false;

        try {

          const row = {

            client_user_id: currentUser.id,

            sender_role: 'client',

            body,

            is_read: false

          };

          const { data, error } = await supabaseClient

            .from('wellness_messages')

            .insert([row])

            .select()

            .single();

          if (error) throw error;

          setWellnessMessages(prev => [...prev, data]);

          return true;

        } catch (_err) {

          return false;

        }

      };



      const submitJanuaryWaitlist = async (payload) => {

        if (!supabaseClient) {

          setWaitlistSubmitted(true);

          return true;

        }

        try {

          const { error } = await supabaseClient

            .from('wellness_waitlist')

            .insert([{

              user_id: currentUser?.id || null,

              full_name: payload.full_name,

              email: payload.email,

              goals: payload.goals,

              interested_in_self_paced: !!payload.interested_in_self_paced

            }]);

          if (error) throw error;

          setWaitlistSubmitted(true);

          if (isPractitioner) loadWellnessData(currentUser);

          return true;

        } catch (_err) {

          setWaitlistSubmitted(true);

          return true;

        }

      };



      const saveClientAsPractitioner = async (editForm) => {

        if (!supabaseClient) return false;

        try {

          const { user_id, ...updates } = editForm;

          const { error } = await supabaseClient

            .from('wellness_enrollments')

            .update({ ...updates, updated_at: new Date().toISOString() })

            .eq('user_id', user_id);

          if (error) throw error;

          await loadWellnessData(currentUser);

          return true;

        } catch (_err) {

          return false;

        }

      };



      const grantClientAccessAsPractitioner = async ({ email, client_name, tier }) => {

        if (!supabaseClient) return { ok: false, message: 'Supabase client is unavailable.' };

        try {

          let targetUserId = null;

          if (email === (currentUser?.email || '').toLowerCase()) {

            targetUserId = currentUser.id;

          } else {

            const { data: existingEnr } = await supabaseClient

              .from('wellness_enrollments')

              .select('user_id')

              .eq('client_email', email)

              .maybeSingle();

            if (existingEnr?.user_id) {

              targetUserId = existingEnr.user_id;

            } else {

              const { data: wlRow } = await supabaseClient

      const renderHomeTab = () => {

        const dayPlan = weeklyPlan[homeDay] || {};

        }
