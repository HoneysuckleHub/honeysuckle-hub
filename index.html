      { id: 'ds_7', category: 'Laundry & Cleaning', ditch: 'Chemical All-Purpose Kitchen Degreasers', why: 'Contains synthetic solvents (2-butoxyethanol) that irritate lungs and skin.', swap: 'Mix 1.5 cups warm water + 2 tbsp Liquid Castile Soap + 1 tbsp Baking Soda + 15 drops Wild Orange or Lemon essential oil.' },

      { id: 'ds_8', category: 'Laundry & Cleaning', ditch: 'Blue Ammonia Glass & Mirror Cleaner', why: 'Pungent ammonia fumes irritate airways and leave synthetic blue dye streaks.', swap: 'Combine 1.5 cups distilled water + 1/2 cup white vinegar + 1 tbsp rubbing alcohol in a spray bottle for instant streak-free shine.' },

      { id: 'ds_9', category: 'Laundry & Cleaning', ditch: 'Synthetic Dish Soap (SLS, Dyes & Fragrance)', why: 'Coats plates and baby bottles in synthetic fragrance, methylisothiazolinone, and petroleum dyes.', swap: 'Switch to unscented or citrus Castile Dish Soap (or a solid Coconut-Oil Dish Soap Block with a wooden brush).' },

      { id: 'ds_10', category: 'Bath & Body', ditch: 'Petroleum & Paraben Body Lotions', why: 'Contains mineral oil, parabens, PEGs, and synthetic fragrance absorbed directly through warm skin after bathing.', swap: 'Apply pure Jojoba Oil, Raw Shea Butter, or Whipped Grass-Fed Tallow Balm to damp skin right out of the shower.' },

      { id: 'ds_11', category: 'Bath & Body', ditch: 'SLS, Triclosan & Artificial Dye Toothpaste', why: 'Sodium Lauryl Sulfate (SLS) causes canker sores, while artificial dyes and microplastics absorb through oral tissue.', swap: 'Switch to a clean Bentonite Clay, Calcium Carbonate & Peppermint mineral toothpaste (store-bought clean brand or homemade).' },

      { id: 'ds_12', category: 'Kitchen & Pantry', ditch: 'Scratching Teflon / Non-Stick Pans (PFAS)', why: 'Sheds "forever chemicals" (PFAS/PTFE) into food when heated or scratched with utensils.', swap: 'Cook in a well-seasoned Lodge Cast-Iron Skillet, Enameled Dutch Oven, or 100% Stainless Steel pan.' },

      { id: 'ds_13', category: 'Kitchen & Pantry', ditch: 'Commercial Sports Drinks (Red 40 & Sucralose)', why: 'Loaded with synthetic petroleum food dyes, high-fructose corn syrup, and artificial sweeteners.', swap: 'Mix 16 oz filtered water + squeeze of fresh lemon/orange juice + 1 tbsp raw honey + 1/4 tsp unrefined mineral sea salt.' },

      { id: 'ds_14', category: 'Kitchen & Pantry', ditch: 'Seed-Oil Store Mayonnaise', why: 'Even "Olive Oil" store mayo typically lists soybean or canola oil as the #1 ingredient.', swap: 'Blend 1 pasture egg + 1 tbsp lemon juice + 1 tsp mustard + 1 cup avocado oil with an immersion blender for 30 seconds!' },

      { id: 'ds_15', category: 'Kitchen & Pantry', ditch: 'Store-Bought Crackers with Soybean Oil & TBHQ', why: 'Made with cottonseed/soybean oil, synthetic preservative TBHQ, and enriched bleached flour.', swap: 'Bake a sheet of 3-Ingredient Butter Saltines (flour, melted butter, water, and flaky sea salt) in 12 minutes.' },

      { id: 'ds_16', category: 'Bath & Body', ditch: 'Petroleum Jelly & Synthetic VapoRub', why: 'Made from refined crude-oil petrolatum and synthetic turpentine derivatives.', swap: 'Melt 1/2 cup Grass-Fed Tallow + 2 tbsp Beeswax and stir in Eucalyptus, Peppermint & Lavender essential oils.' },

      { id: 'ds_17', category: 'Bath & Body', ditch: 'Aluminum & Paraben Antiperspirant Deodorant', why: 'Blocks sweat glands with aluminum salts right over axillary lymph nodes.', swap: 'Make gentle Tallow, Arrowroot & Magnesium Hydroxide Pit Paste scented with Lavender & Tea Tree.' },

      { id: 'ds_18', category: 'Bath & Body', ditch: 'Sulfate, Paraben & Phthalate Commercial Shampoo', why: 'Strips natural scalp barrier and exposes follicles to synthetic fragrance and DMDM hydantoin.', swap: 'Whisk Canned Full-Fat Coconut Milk, Unscented Castile Soap, Raw Honey, Jojoba Oil & Rosemary EO in a pump bottle.' },

      { id: 'ds_19', category: 'Bath & Body', ditch: 'Silicone Hair Conditioners & Detangler Sprays', why: 'Coats hair in dimethicone plastics and quaternary ammonium compounds.', swap: 'Mist hair in the shower with 2 tbsp Raw Apple Cider Vinegar + 1 cup cooled Rosemary Tea to close the cuticle for tangle-free shine.' },

      { id: 'ds_20', category: 'Bath & Body', ditch: 'Aerosol Dry Shampoo Sprays (Benzene & Butane)', why: 'Pressurized aerosol cans frequently test positive for benzene, propane, and butane propellants.', swap: 'Whisk 1/2 cup Arrowroot Powder + 1 tbsp Bentonite Clay + 1 tbsp Raw Cacao Powder + 8 drops Rosemary EO in a shaker jar.' },

      { id: 'ds_21', category: 'Bath & Body', ditch: 'Chemical Sunscreens (Oxybenzone & Avobenzone)', why: 'Chemical UV filters absorb into the bloodstream within hours and disrupt endocrine balance.', swap: 'Whip Grass-Fed Tallow, Coconut Oil, Beeswax, Red Raspberry Seed Oil & 20% Non-Nano Zinc Oxide into a physical mineral sun balm.' },

      { id: 'ds_22', category: 'Laundry & Cleaning', ditch: 'Conventional Liquid Laundry Detergent (1,4-Dioxane)', why: 'Contains optical brighteners, synthetic musks, and ethoxylated surfactants that linger in fabric fibers 24/7.', swap: 'Blend 2 cups Washing Soda + 2 cups Baking Soda + 1 cup Epsom Salt + 1/2 cup Sea Salt (or liquid Castile laundry wash).' },

      { id: 'ds_23', category: 'Laundry & Cleaning', ditch: 'Chlorine Bleach Laundry Whiteners', why: 'Weakens natural cotton/linen fibers and creates harsh chlorinated fumes in the laundry room.', swap: 'Soak whites in hot water with 1/2 cup Washing Soda + 1/2 cup 3% Hydrogen Peroxide (or Sodium Percarbonate) and dry in natural sunlight.' },

      { id: 'ds_24', category: 'Laundry & Cleaning', ditch: 'Synthetic Carpet & Rug Deodorizer Powders', why: 'Leaves toxic fragrance dust trapped in carpet fibers where babies and toddlers crawl.', swap: 'Shake 2 cups Baking Soda + 20 drops Lavender & Cedarwood EO over rugs, wait 20 minutes, and vacuum thoroughly.' },

      { id: 'ds_25', category: 'Laundry & Cleaning', ditch: 'Aerosol Wood Furniture Polish (Silicones)', why: 'Contains petroleum distillates, nitropropane, and silicone buildup that ruins heirloom wood.', swap: 'Shake 3/4 cup Olive or Jojoba Oil + 1/4 cup White Vinegar + 10 drops Wild Orange EO in a glass bottle and buff with a cloth.' },

      { id: 'ds_26', category: 'Laundry & Cleaning', ditch: 'Caustic Fume Oven Cleaners', why: 'Corrosive monoethanolamine and butane fumes bake into the oven and off-gas the next time you roast dinner.', swap: 'Spread a thick frosting of 1 cup Baking Soda + 3 tbsp Castile Soap + 2 tbsp Peroxide over the cool oven, wait 45 mins, and scrub.' },

      { id: 'ds_27', category: 'Laundry & Cleaning', ditch: 'Chemical Toilet Bowl Cleaners & Blue Tabs', why: 'Corrosive hydrochloric acid and chlorine gases corrode septic systems and irritate lungs.', swap: 'Drop in a homemade Citric Acid, Baking Soda & Tea Tree Toilet Fizz Bomb, let fizz 10 minutes, and brush clean.' },

      { id: 'ds_28', category: 'Laundry & Cleaning', ditch: 'Synthetic Fabric Refresher Sprays (Febreze)', why: 'Uses cyclodextrin and synthetic fragrance chemicals to mask odors rather than neutralizing them.', swap: 'Mist couches, curtains, and pillows with 1.5 cups distilled water + 1/2 cup Witch Hazel + 1 tsp Baking Soda + 12 drops Lavender EO.' },

      { id: 'ds_29', category: 'Bath & Body', ditch: 'Conventional Baby Diaper Creams (BHA & PEGs)', why: 'Contains petrolatum, BHA preservatives, and synthetic fragrance on delicate newborn skin.', swap: 'Melt Calendula-Infused Olive Oil + Beeswax + Non-Nano Zinc Oxide + Chamomile EO for a soothing cloth-safe barrier.' },

      { id: 'ds_30', category: 'Bath & Body', ditch: 'Petroleum & Camphor Lip Balms', why: 'Creates a synthetic seal that dries lips out further and is ingested throughout the day.', swap: 'Melt equal parts Beeswax, Grass-Fed Tallow & Cocoa Butter with a touch of Raw Honey and Peppermint EO.' },

      { id: 'ds_31', category: 'Bath & Body', ditch: 'Antibacterial Triclosan Foaming Hand Soaps', why: 'Disrupts skin microbiome, dries out hands, and contains synthetic fragrance.', swap: 'Fill a foaming pump bottle 4/5 with distilled water + 2 tbsp Liquid Castile Soap + 1 tsp Jojoba/Almond Oil + 10 drops Sweet Orange EO.' },

      { id: 'ds_32', category: 'Bath & Body', ditch: 'Synthetic Detergent Shower Bars', why: 'Most store "soap" bars are actually synthetic detergent cakes stripped of natural glycerin.', swap: 'Craft Heirloom Grass-Fed Tallow & Olive Oil Cold-Process Bar Soap from our Apothecary section.' },

      { id: 'ds_33', category: 'Kitchen & Pantry', ditch: 'Bleached, Bromated Enriched White Flour', why: 'Stripped of living wheat germ, bleached with chlorine gas, and sprayed with synthetic folic acid.', swap: 'Bake with Long-Fermented Sourdough or unbleached organic whole-grain flours.' },

      { id: 'ds_34', category: 'Kitchen & Pantry', ditch: 'Store Bouillon Cubes (MSG, Corn Syrup & Yellow 5)', why: 'Packed with monosodium glutamate, hydrolyzed soy protein, palm oil, and artificial yellow dyes.', swap: 'Simmer leftover roast bones with a splash of apple cider vinegar for 18–24 hours into gelatin-rich homemade Bone Broth.' },

      { id: 'ds_35', category: 'Kitchen & Pantry', ditch: 'Bleached White Table Salt (Anti-Caking Agents)', why: 'Heated to 1,200°F, stripped of 80+ trace minerals, and treated with sodium ferrocyanide.', swap: 'Season every meal and electrolyte drink with Unrefined Pink Mineral Salt or Celtic Grey Sea Salt.' },

      { id: 'ds_36', category: 'Bath & Body', ditch: 'Red-Dye & High-Fructose Nighttime Cough Syrups', why: 'Contains Red 40, Blue 1, propylene glycol, and refined corn syrup right when the immune system is working hardest.', swap: 'Layer sliced Red Onion and Raw Local Honey in a Mason jar (or keep homemade Elderberry & Thyme Syrup in the fridge).' }

    ];



    const CLEANING_RECIPES = [

      { id: 'cln_1', title: 'Everyday Castile All-Purpose Counter Spray', category: 'Kitchen & Counters', formula: 'In a 16 oz glass spray bottle, combine 2 cups distilled water + 1 tbsp unscented Liquid Castile Soap. Shake gently before each use and wipe with a damp microfiber cloth. Optional Essential Oil Add-In: 15 drops Wild Orange + 5 drops Clove or Protective Blend for grease-cutting and warm spice aroma.' },

      { id: 'cln_2', title: 'Heavy-Duty Stovetop & Range Hood Degreaser', category: 'Kitchen & Counters', formula: 'In a 16 oz spray bottle, mix 1.5 cups warm distilled water + 2 tbsp Liquid Castile Soap + 1 tbsp Baking Soda (dissolved first). Spray onto greasy range hoods, stove grates, and air fryer baskets; let sit 3 minutes and wipe clean. Optional Essential Oil Add-In: 15 drops Lemon + 5 drops Cleansing Blend.' },

      { id: 'cln_3', title: 'Zero-Plastic Automatic Dishwasher Powder', category: 'Kitchen & Counters', formula: 'Whisk together 1 cup Washing Soda + 1 cup Baking Soda + 1/2 cup Food-Grade Citric Acid + 1/2 cup Coarse Sea Salt. Store in an airtight mason jar. Use 1 tbsp per load. Optional Essential Oil Add-In: Whisk in 20–25 drops Lemon or Grapefruit EO.' },

      { id: 'cln_4', title: 'Sparkling Dishwasher Rinse-Aid & Hard Water Eraser', category: 'Kitchen & Counters', formula: 'Pour straight white distilled vinegar into your dishwasher’s rinse-aid compartment (or place a small dishwasher-safe mug with 1/2 cup white vinegar on the top rack) to prevent cloudy mineral film on glassware.' },

      { id: 'cln_5', title: 'Baked-On Oven & Glass Door Scrubbing Frosting', category: 'Kitchen & Counters', formula: 'Stir 1 cup Baking Soda + 3 tbsp Liquid Castile Soap + 2 tbsp water (or 3% hydrogen peroxide) into a thick spreadable paste. Coat cool oven floor and glass door, let sit 30–60 minutes, scrub with a non-scratch sponge, and wipe clean with warm vinegar water.' },

      { id: 'cln_6', title: 'Refrigerator, Freezer & Cooler Interior Refresh Mist', category: 'Kitchen & Counters', formula: 'Combine 1 cup distilled water + 1/2 cup white vinegar in a glass spray bottle. Mist fridge shelves, produce drawers, and rubber door seals, then wipe dry. Optional Essential Oil Add-In: 10 drops Lemon + 5 drops Vanilla or Bergamot.' },

      { id: 'cln_7', title: 'Fruit & Veggie Farm-Stand Produce Soak', category: 'Kitchen & Counters', formula: 'Fill a clean sink or large bowl with cold water + 1/2 cup white vinegar + 1 tbsp sea salt (or baking soda). Soak berries, apples, and leafy greens for 5 minutes to lift wax and field dirt, then rinse and spin dry.' },

      { id: 'cln_8', title: 'Stainless Steel Fridge & Appliance Shine', category: 'Kitchen & Counters', formula: 'First wipe fingerprints away with a cloth dampened with white vinegar. Then put 3–4 drops of olive oil or fractionated coconut oil on a dry microfiber cloth and buff in the direction of the metal grain.' },

      { id: 'cln_9', title: 'Garbage Disposal & Sink Drain Citrus Fizz Cubes', category: 'Kitchen & Counters', formula: 'Mix 1 cup Baking Soda + 1/2 cup Citric Acid + 1 tbsp Liquid Castile Soap + 20 drops Lemon or Wild Orange EO. Pack tightly into silicone ice cube trays and dry overnight. Toss 1 cube down the disposal with warm water.' },

      { id: 'cln_10', title: 'Butcher Block & Wooden Cutting Board Conditioning Butter', category: 'Kitchen & Counters', formula: 'In a double boiler, melt 2 tbsp Beeswax Pellets + 3/4 cup Fractionated Coconut Oil (or beef tallow). Pour into a wide-mouth jar to solidify. Buff a quarter-sized amount into dry wood boards monthly.' },

      { id: 'cln_11', title: 'Cast-Iron Skillet Coarse Salt & Tallow Ritual', category: 'Kitchen & Counters', formula: 'While skillet is still warm, pour in 2 tbsp coarse kosher salt and scrub stuck bits with a wooden scraper and hot water. Dry on stove over low heat for 2 minutes, then rub 1 tsp grass-fed Beef Tallow inside.' },

      { id: 'cln_12', title: 'Foaming Castile Hand Soap Refill (Every Sink)', category: 'Bathrooms & Sinks', formula: 'Fill a foaming soap pump bottle 4/5 full with distilled water + 2 tbsp unscented Liquid Castile Soap + 1 tsp sweet almond or jojoba oil + 10 drops Lavender or Wild Orange EO.' },

      { id: 'cln_13', title: 'Tub, Tile & Porcelain Soft-Scrub Cream', category: 'Bathrooms & Sinks', formula: 'Whisk 1 cup Baking Soda + 1/3 cup Liquid Castile Soap + 1 tbsp 3% Hydrogen Peroxide + 1 tbsp vegetable glycerin + 10 drops Tea Tree & Eucalyptus EO. Scrub soap scum off tubs and sinks, then rinse.' },

      { id: 'cln_14', title: 'Citric Acid & Baking Soda Toilet Fizz Bombs', category: 'Bathrooms & Sinks', formula: 'Whisk 1 cup Baking Soda + 1/2 cup Citric Acid + 15 drops Tea Tree & Peppermint EO. Mist lightly with witch hazel until it holds like wet sand, press into molds, dry 12 hours, and drop 1 bomb into the toilet bowl.' },

      { id: 'cln_15', title: 'Streak-Free Vinegar & Alcohol Mirror/Glass Mist', category: 'Bathrooms & Windows', formula: 'In a 16 oz glass spray bottle, combine 1.5 cups distilled water + 1/2 cup white vinegar + 1 tbsp rubbing alcohol (70% isopropyl evaporates instantly with zero streaks).' },

      { id: 'cln_16', title: 'Daily After-Shower Tile & Grout Prevention Mist', category: 'Bathrooms & Sinks', formula: 'Mix 1.5 cups distilled water + 1/2 cup white vinegar + 10 drops Tea Tree + 5 drops Clove + 5 drops Rosemary EO. Mist shower tile and glass doors after the last shower of the day.' },

      { id: 'cln_17', title: 'Deep Grout & Caulk Whitening Paste', category: 'Bathrooms & Sinks', formula: 'Mix 1/2 cup Baking Soda + 1/4 cup 3% Hydrogen Peroxide + 1 tsp Liquid Castile Soap into a paste. Brush onto tile grout lines, wait 10 minutes, scrub briefly, and rinse.' },

      { id: 'cln_18', title: 'Showerhead & Faucet Hard-Water Descaler Soak', category: 'Bathrooms & Sinks', formula: 'Fill a heavy zip-top bag or jar with 1 cup warm white vinegar + 1 tbsp Citric Acid. Submerge the showerhead for 1 hour, then wipe mineral deposits away.' },

      { id: 'cln_19', title: 'Non-Toxic Powdered Family Laundry Detergent', category: 'Laundry Room', formula: 'In a large glass jar, combine 2 cups Washing Soda + 2 cups Baking Soda + 1 cup Epsom Salt + 1/2 cup Unrefined Sea Salt + 30 drops Lavender or Lemon EO. Use 1–2 tbsp per load directly in the drum.' },

      { id: 'cln_20', title: 'Concentrated Liquid Castile Laundry Wash', category: 'Laundry Room', formula: 'Dissolve 1/4 cup Washing Soda + 1/4 cup Baking Soda in 2 cups boiling water inside a half-gallon jar. Add 1 cup unscented Liquid Castile Soap and top off with warm water. Use 1/4 cup per load.' },

      { id: 'cln_21', title: 'Miracle Peroxide & Castile Stain-Treater Spray', category: 'Laundry Room', formula: 'In an amber 16 oz spray bottle, gently mix 1 cup 3% Hydrogen Peroxide + 1/4 cup Liquid Castile Soap + 1 tbsp Baking Soda + 1/2 cup warm water. Spray grass, berry, mud, or food stains, wait 15 mins, and wash.' },

      { id: 'cln_22', title: 'White Vinegar Fabric Softener & Wool Dryer Ball Boost', category: 'Laundry Room', formula: 'Pour 1/3 cup white distilled vinegar into the fabric softener compartment to strip soap residue. Toss 4–6 wool dryer balls into the dryer with 4 drops Lavender or Wild Orange EO.' },

      { id: 'cln_23', title: 'Oxygen Whitening & Dingy Towel Brightener Soak', category: 'Laundry Room', formula: 'Dissolve 1/2 cup Washing Soda + 1/2 cup 3% Hydrogen Peroxide (or Sodium Percarbonate) in hot water. Soak white sheets or kitchen towels for 1–2 hours before washing.' },

      { id: 'cln_24', title: 'Washing Machine Drum & Rubber Gasket Detox Flush', category: 'Laundry Room', formula: 'Monthly: Spray the rubber door seal with vinegar, wipe out trapped lint, sprinkle 1/2 cup Baking Soda into the empty drum, pour 2 cups White Vinegar into the detergent tray, and run the hottest clean cycle.' },

      { id: 'cln_25', title: 'Heirloom Wood Table & Furniture Conditioning Polish', category: 'Dining & Living Room', formula: 'In an 8 oz glass bottle, combine 3/4 cup Olive or Jojoba Oil + 1/4 cup White Vinegar + 10 drops Wild Orange & Cedarwood EO. Shake vigorously and buff a small amount onto wood tables.' },

      { id: 'cln_26', title: 'Weekly Dust-Repelling Wood & Baseboard Mist', category: 'Dining & Living Room', formula: 'In a 16 oz spray bottle, combine 1.75 cups distilled water + 2 tbsp white vinegar + 1 tbsp olive/jojoba oil + 1/2 tsp Liquid Castile Soap. Mist onto a microfiber cloth to trap dust on bookshelves and blinds.' },

      { id: 'cln_27', title: 'Couch, Curtain & Upholstery Fabric Refresher Spray', category: 'Dining & Living Room', formula: 'In a fine-mist glass bottle, mix 1.5 cups distilled water + 1/2 cup Witch Hazel + 1 tsp Baking Soda + 12 drops Lavender & Wild Orange EO. Mist lightly over sofa cushions and drapes.' },

      { id: 'cln_28', title: 'Carpet & Area Rug Deep Deodorizing Shaker', category: 'Dining & Living Room', formula: 'Fill a 16 oz mason jar with 2 cups Baking Soda + 20 drops Lavender or Cedarwood EO. Sprinkle evenly over living room rugs, let sit 20–30 minutes, then vacuum thoroughly.' },

      { id: 'cln_29', title: 'Leather Couch, Chair & Boot Nourishing Balm', category: 'Dining & Living Room', formula: 'Gently melt 1/4 cup Grass-Fed Beef Tallow (or Beeswax) + 1/4 cup Sweet Almond or Olive Oil. Let cool into a soft balm, rub a thin layer onto clean leather sofas or boots, and buff dry.' },

      { id: 'cln_30', title: 'Sweet Dreams Pillow, Linen & Curtain Mist', category: 'Bedrooms & Nursery', formula: 'In an 8 oz amber mist bottle, combine 3/4 cup distilled water + 2 tbsp Witch Hazel + 10 drops Lavender + 5 drops Cedarwood + 4 drops Roman Chamomile EO.' },

      { id: 'cln_31', title: 'Quarterly Mattress Sanitizing & Dust-Mite Shaker', category: 'Bedrooms & Nursery', formula: 'When stripping sheets, sift 1 cup Baking Soda + 8 drops Eucalyptus & Lavender EO across the bare mattress surface. Let sit 1 hour in natural sunlight, then vacuum seams thoroughly.' },

      { id: 'cln_32', title: 'Nursery Toy, Highchair & Block Gentle Wipe Spray', category: 'Bedrooms & Nursery', formula: 'In a 16 oz spray bottle, combine 2 cups distilled water + 1 tsp unscented Liquid Castile Soap + 1 tbsp white vinegar. Safe for wiping down blocks, play mats, cribs, and highchair trays.' },

      { id: 'cln_33', title: 'Closet, Linen Cabinet & Drawer Cedar-Fresh Spray', category: 'Bedrooms & Nursery', formula: 'Mix 1 cup distilled water + 1/2 cup Witch Hazel + 15 drops Cedarwood + 8 drops Lavender EO. Spray onto wooden hangers or wool balls tucked into dresser drawers.' },

      { id: 'cln_34', title: 'Hardwood, Laminate & LVP Floor Mop Concentrate', category: 'Hallways & Floors', formula: 'In a 1-gallon mop bucket of warm water, add 1 tbsp Liquid Castile Soap + 2 tbsp White Vinegar + 10 drops Wild Orange or Fir EO. Mop with a well-wrung damp pad so water never puddles on wood.' },

      { id: 'cln_35', title: 'Tile, Stone & Mudroom Floor Heavy Scrub Bucket', category: 'Hallways & Floors', formula: 'In 1 gallon of hot water, dissolve 2 tbsp Liquid Castile Soap + 2 tbsp Baking Soda (or Washing Soda) + 12 drops Lemon & Tea Tree EO. Mop entryway tile, mudroom, and bathroom floors.' },

      { id: 'cln_36', title: 'Baseboard, Doorframe & Light-Switch Scuff Eraser', category: 'Hallways & Floors', formula: 'Fill a small caddy bowl with 4 cups warm water + 1 tsp Liquid Castile Soap + 1 tsp Olive Oil. Wipe hallway baseboards, door panels, and light switch plates with a wrung-out microfiber cloth.' }

    ];



    const APOTHECARY_VAULT = [

      { id: 'rem_1', name: 'The "FLOM" Acute Immune Support Blend (Veggie Capsule & Roller)', category: 'Essential Oil Protocols', uses: 'First sign of seasonal bugs, scratchy throats, sinus pressure, or feeling run down. Ingredients: Frankincense, Lemon, Oregano, and Tea Tree pure essential oils.', dosing: 'Internal (Adults): In an empty veggie capsule, place 2 drops Frankincense + 2 drops Lemon + 2 drops Oregano + 2 drops Tea Tree; top off with olive oil and take with food every 4–6 hours for up to 5–7 days. Topical (Kids & Adults): Dilute 3 drops of each in a 10 mL roller with fractionated coconut oil and roll along the spine and bottoms of feet 3x daily.' },

      { id: 'rem_2', name: 'Cellular Vitality & Daily Calm Nervous System Drops', category: 'Essential Oil Protocols', uses: 'Daily cellular longevity, calm nervous system, joint comfort, and healthy inflammatory response. Ingredients: Pure Frankincense and Copaiba essential oils.', dosing: 'Internal: Place 1–2 drops Frankincense and 1–2 drops Copaiba directly under the tongue each morning (hold for 30 seconds before swallowing) or take in a veggie capsule. Topical: Apply 1 drop of each to the crown of the head, back of the neck, or over sore joints.' },

      { id: 'rem_3', name: 'Natural Head & Body Tension Relief Capsule ("Soothing Comfort Blend")', category: 'Essential Oil Protocols', uses: 'Acute head tension, stiff neck, back discomfort, or post-workout soreness. Ingredients: Frankincense, Copaiba, Marjoram, and Peppermint (or Lemongrass) essential oils.', dosing: 'Internal (Adults): Add 3 drops Frankincense + 3 drops Copaiba + 2 drops Marjoram + 2 drops Peppermint into an empty veggie capsule with a few drops of olive oil. Topical: Roll diluted Peppermint, Frankincense, and Lavender across the temples (away from eyes), forehead, and base of the skull.' },

      { id: 'rem_4', name: 'Seasonal Pollen & Sinus Trio (LLP Capsule & Roller)', category: 'Essential Oil Protocols', uses: 'Spring/fall pollen, watery eyes, sneezing, and sinus congestion. Ingredients: Equal parts Lemon, Lavender, and Peppermint essential oils.', dosing: 'Internal: Take 2 drops Lemon + 2 drops Lavender + 2 drops Peppermint in a veggie capsule (or swirled into 1 tsp raw local honey) 1–2x daily. Topical: Dilute 5 drops of each in a 10 mL carrier oil roller and apply over the bridge of the nose, chest, and back of neck.' },

      { id: 'rem_5', name: 'Tummy Tamer & Nausea Rescue (Internal & Belly Roller)', category: 'Essential Oil Protocols', uses: 'Stomach cramps, motion sickness, indigestion, bloating, or post-meal heaviness. Ingredients: Peppermint, Ginger, Fennel, Coriander, and Cardamom essential oils.', dosing: 'Internal: Add 1 drop Peppermint + 1 drop Ginger + 1 drop Fennel to 4 oz warm water or a veggie capsule after meals. Topical (All Ages): Dilute 6 drops total in a 10 mL roller with carrier oil and massage clockwise around the belly button and onto wrists.' },

      { id: 'rem_6', name: 'Sore Throat & Tonsil Soothing Spray / Gargle', category: 'Essential Oil Protocols', uses: 'Raw, scratchy throats, hoarse voice, and swollen glands. Ingredients: Lemon, Clove, Oregano, Frankincense, Raw Honey, and Celtic Sea Salt.', dosing: 'In a 2 oz glass spray bottle, combine 1 tbsp Raw Honey + 1/2 tsp Sea Salt + 3 tbsp warm water + 3 drops Lemon + 2 drops Clove + 1 drop Oregano + 2 drops Frankincense. Shake well before misting the back of the throat every 2–3 hours, or gargle with warm salt water.' },

      { id: 'rem_7', name: 'Outer-Ear Comfort & Fluid Pressure Roller', category: 'Essential Oil Protocols', uses: 'Childhood or adult outer-ear discomfort, swimmer’s ear, and eustachian tube drainage. Ingredients: Basil, Tea Tree, Lavender, and Helichrysum.', dosing: 'NEVER drop pure essential oils directly into the ear canal. In a 10 mL roller with fractionated coconut oil, add 4 drops Lavender + 4 drops Tea Tree + 3 drops Basil + 2 drops Helichrysum. Roll around the outside bone behind the ear and down the side of the neck toward the collarbone 4x daily, then hold a warm washcloth over the ear.' },

      { id: 'rem_8', name: 'Deep Slumber & Quiet Mind Bedtime Roller', category: 'Essential Oil Protocols', uses: 'Racing thoughts, trouble falling asleep, night wakings, and bedtime restlessness. Ingredients: Vetiver, Cedarwood, Lavender, Roman Chamomile, and Bergamot.', dosing: 'In a 10 mL roller, combine 6 drops Lavender + 5 drops Cedarwood + 4 drops Vetiver + 3 drops Roman Chamomile + 3 drops Bergamot, then fill with jojoba or coconut oil. Roll onto big toes, ankles, spine, and back of neck 20 minutes before sleep.' },

    function generateDefaultRoomTasksArray(roomsList) {

      const tasks = [];

      const seen = new Set();

      (roomsList || DEFAULT_ROOMS_PROFILE).forEach(r => {

        const tpl = ROOM_SMART_TEMPLATES[r.type] || ROOM_SMART_TEMPLATES['Living Room'];

        ['daily', 'weekly', 'monthly', 'yearly'].forEach(tier => {

          (tpl[tier] || []).forEach(txt => {

            const key = `${tier}|${r.name}|${txt}`;

            if (!seen.has(key)) {

              seen.add(key);

              tasks.push({

                id: 'rt_' + Math.random().toString(36).substring(2, 9),

                tier,

                roomName: r.name,

                roomCount: r.count || 1,

                weeklyDay: r.weeklyDay || 'Monday',

                text: txt,

                done: false

              });

            }

          });

        });

      });

      return tasks;

    }

    function ProductDetailModal({ product, userEmail, onAddToCart, onClose }) {

      const variants = (product.variants && product.variants.length > 0)

        ? product.variants

        : [{ id: 'default', label: 'Standard', price: product.price, stripeLink: product.stripeLink }];



      const [selectedVariantId, setSelectedVariantId] = useState(variants[0].id);

      const [quantity, setQuantity] = useState(1);

      const [notice, setNotice] = useState('');



      const activeVariant = variants.find(v => v.id === selectedVariantId) || variants[0];

      const activePrice = activeVariant.price ?? product.price;

      const activeStripeLink = activeVariant.stripeLink || product.stripeLink || '';



      const handleAdd = () => {

        onAddToCart(product, activeVariant, quantity);

        onClose();

      };



      const handleDirectBuy = () => {

        if (!activeStripeLink.trim()) {

          setNotice('Stripe Payment Link is not connected yet for this item. Open index.html, locate SHOP_PRODUCTS, and paste your https://buy.stripe.com/... link to enable live checkout.');

                  {product.type === 'digital' ? <FileText size={13} className="text-[#798771]" /> : <Package size={13} className="text-[#798771]" />}

                    <div className="flex flex-wrap gap-2">

                <div className="space-y-3 pt-1">

                    <div className="inline-flex items-center gap-3 bg-white border border-[#4a4238]/15 rounded-full px-2 py-1">

                      <button

                        aria-label="Decrease quantity"

                      </button>

                      <span className="w-5 text-center font-lora text-sm font-bold text-[#4a4238]">{quantity}</span>

                      <button

                        type="button"

                        onClick={() => setQuantity(q => Math.min(20, q + 1))}

                        className="w-7 h-7 rounded-full flex items-center justify-center hover:bg-[#fdfbf7] text-[#4a4238]"

                        aria-label="Increase quantity"

                      >

                    <button

                      type="button"

                      onClick={handleDirectBuy}

                      className="inline-flex items-center justify-center gap-2 bg-white text-[#4a4238] border border-[#4a4238]/25 px-5 py-3.5 rounded-xl font-lora text-xs font-bold uppercase tracking-wider hover:border-[#798771] hover:text-[#798771] transition-colors"

                    >

                    </button>

                    <div className="p-3.5 rounded-xl bg-amber-50 border border-amber-200 font-lora text-xs text-amber-900 leading-relaxed">

                      {notice}

                    </div>

                  )}

                </div>



                {product.details && product.details.length > 0 && (

                  <div className="bg-white border border-[#4a4238]/10 rounded-xl p-5 space-y-2.5">

                    <h4 className="font-lora text-xs font-bold uppercase tracking-widest text-[#798771]">

                      {product.type === 'digital' ? "What's Included" : 'Details & Fulfillment'}

                    </h4>

                    <ul className="space-y-2">

                      {product.details.map((line, i) => (

                        <li key={i} className="flex items-start gap-2.5 font-lora text-xs text-[#4a4238]/85 leading-relaxed">

                          <Check size={14} className="text-[#798771] mt-0.5 shrink-0" />

                          <span>{line}</span>

                        </li>

                      ))}

                    </ul>

                  </div>

                )}



                <div className="flex items-center gap-4 pt-2 border-t border-[#4a4238]/10 font-lora text-xs text-[#4a4238]/60">

                  <span className="inline-flex items-center gap-1.5"><ShieldCheck size={15} className="text-[#798771]" /> Secure Stripe Checkout</span>

                  <span className="inline-flex items-center gap-1.5">

                    {product.type === 'digital' ? <Download size={15} className="text-[#798771]" /> : <Truck size={15} className="text-[#798771]" />}

                    {product.type === 'digital' ? 'Instant Email Delivery' : `Free Shipping Over $${FREE_SHIPPING_THRESHOLD}`}

                  </span>

                </div>

              </div>

            </div>

          </div>

        </div>

      );

    }



    function CartDrawer({

      isOpen,

      cart,

      userEmail,

      onClose,

      onUpdateQty,

      onRemoveItem,

      onClearCart

    }) {

      const [checkoutMessage, setCheckoutMessage] = useState('');

      const [openedStripeKeys, setOpenedStripeKeys] = useState({});



      if (!isOpen) return null;



      const subtotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

      const physicalSubtotal = cart

        .filter(item => item.type === 'physical')

        .reduce((sum, item) => sum + (item.price * item.qty), 0);

      const hasPhysical = cart.some(item => item.type === 'physical');

      const hasDigital = cart.some(item => item.type === 'digital');

      const amountToFreeShipping = Math.max(0, FREE_SHIPPING_THRESHOLD - physicalSubtotal);

      const freeShippingPct = Math.min(100, Math.round((physicalSubtotal / FREE_SHIPPING_THRESHOLD) * 100));



      const launchStripeForItem = (item) => {

        setCheckoutMessage('');

        if (!item.stripeLink || !item.stripeLink.trim()) {

          setCheckoutMessage(`Stripe Payment Link is not connected yet for "${item.name}". Open index.html, locate SHOP_PRODUCTS, and paste your https://buy.stripe.com/... link to enable live checkout.`);

          return;

        }

        const url = buildStripeCheckoutUrl(item.stripeLink, userEmail);

        window.open(url, '_blank', 'noopener,noreferrer');

        setOpenedStripeKeys(prev => ({ ...prev, [item.cartKey]: true }));

      };



      const handlePrimaryCheckout = () => {

        if (cart.length === 0) return;

        if (cart.length === 1) {

          launchStripeForItem(cart[0]);

          return;

        }

        const missingLinks = cart.filter(i => !i.stripeLink || !i.stripeLink.trim());

        if (missingLinks.length === cart.length) {

          setCheckoutMessage('Paste your Stripe Payment Links into SHOP_PRODUCTS inside index.html to activate instant checkout for your items.');

        } else {

          setCheckoutMessage('Because each product uses its own Stripe Payment Link, click "Pay" beside each item above to complete checkout.');

        }

      };



      return (

        <div className="fixed inset-0 z-50 flex justify-end no-print print:hidden">

          <div onClick={onClose} className="fixed inset-0 bg-[#4a4238]/55 transition-opacity" />



          <aside className="relative z-10 w-full max-w-md bg-[#fdfbf7] h-full shadow-2xl border-l border-[#4a4238]/15 flex flex-col">

            <div className="px-6 py-5 bg-white border-b border-[#4a4238]/10 flex items-center justify-between">

              <div className="flex items-center gap-2.5">

                <ShoppingBag size={20} className="text-[#798771]" />

                <h2 className="font-playfair text-2xl text-[#4a4238]">Your Shopping Bag</h2>

              </div>

              <button

                type="button"

                onClick={onClose}

                className="p-2 hover:bg-[#4a4238]/5 rounded-full transition-colors text-[#4a4238]"

                aria-label="Close shopping bag"

              >

                <XIcon size={20} />

              </button>

            </div>



            {hasPhysical && (

              <div className="px-6 py-3.5 bg-[#798771]/10 border-b border-[#798771]/20 space-y-2">

                <p className="font-lora text-xs text-[#4a4238] flex items-center gap-2">

                  <Truck size={15} className="text-[#798771] shrink-0" />

                  {amountToFreeShipping > 0

                    ? <span>Add <strong>{formatCurrency(amountToFreeShipping)}</strong> more in physical goods for complimentary shipping.</span>

                    : <span className="font-bold text-[#798771]">You unlocked complimentary shipping on physical items!</span>}

                </p>

                <div className="w-full h-1.5 bg-white/80 rounded-full overflow-hidden">

                  <div className="h-full bg-[#798771] rounded-full transition-all duration-500" style={{ width: `${freeShippingPct}%` }} />

                </div>

              </div>

            )}



            <div className="flex-1 overflow-y-auto p-6 space-y-4">

              {cart.length === 0 ? (

                <div className="h-full flex flex-col items-center justify-center text-center space-y-4 py-12">

                  <div className="w-16 h-16 rounded-full bg-white border border-[#4a4238]/10 flex items-center justify-center text-[#798771]">

                    <ShoppingBag size={26} />

                  </div>

                  <div className="space-y-1">

                    <h3 className="font-playfair text-2xl text-[#4a4238]">Your bag is empty</h3>

                    <p className="font-lora text-sm text-[#4a4238]/65 max-w-xs">

                      Explore our heirloom guides, printable planners, and small-batch homestead goods.

                    </p>

                  </div>

                  <button

                    type="button"

                    onClick={onClose}

                    className="px-6 py-2.5 rounded-full bg-[#798771] text-white font-lora text-xs font-bold uppercase tracking-wider hover:bg-[#6b7764] transition-colors"

                  >

                    Continue Browsing

                  </button>

                </div>

              ) : (

                <>

                  {cart.map(item => (

                    <div key={item.cartKey} className="bg-white border border-[#4a4238]/10 rounded-xl p-4 shadow-sm space-y-3">

                      <div className="flex items-start justify-between gap-3">

                        <div className="space-y-1">

                          <span className="inline-flex items-center gap-1 text-[10px] font-lora font-bold uppercase tracking-widest text-[#798771]">

                            {item.type === 'digital' ? <FileText size={11} /> : <Package size={11} />}

                            {item.type === 'digital' ? 'Digital Download' : 'Physical Item'}

                          </span>

                          <h4 className="font-playfair text-base text-[#4a4238] leading-snug">{item.name}</h4>

                          {item.variantLabel && (

                            <p className="font-lora text-xs text-[#4a4238]/60">{item.variantLabel}</p>

                          )}

                        </div>

                        <button

                          type="button"

                          onClick={() => onRemoveItem(item.cartKey)}

                          className="p-1.5 text-[#4a4238]/35 hover:text-red-700 rounded-full transition-colors"

                          aria-label={`Remove ${item.name}`}

                        >

                          <Trash2 size={15} />

                        </button>

                      </div>



                      <div className="flex items-center justify-between pt-2 border-t border-[#4a4238]/10">

                        <div className="inline-flex items-center gap-2.5 bg-[#fdfbf7] border border-[#4a4238]/15 rounded-full px-2 py-0.5">

                          <button

                            type="button"

                            onClick={() => onUpdateQty(item.cartKey, item.qty - 1)}

                            className="w-6 h-6 rounded-full flex items-center justify-center hover:bg-white text-[#4a4238]"

                            aria-label="Decrease item quantity"

                          >

                            <Minus size={12} />

                          </button>

                          <span className="w-4 text-center font-lora text-xs font-bold text-[#4a4238]">{item.qty}</span>

                          <button

                            type="button"

                            onClick={() => onUpdateQty(item.cartKey, item.qty + 1)}

                            className="w-6 h-6 rounded-full flex items-center justify-center hover:bg-white text-[#4a4238]"

                            aria-label="Increase item quantity"

                          >

                            <Plus size={12} />

                          </button>

                        </div>



                        <div className="flex items-center gap-3">

                          <span className="font-lora text-sm font-bold text-[#4a4238]">

                            {formatCurrency(item.price * item.qty)}

                          </span>

                          {cart.length > 1 && (

                            <button

                              type="button"

                              onClick={() => launchStripeForItem(item)}

                              className={`inline-flex items-center gap-1 px-3 py-1.5 rounded-full font-lora text-[11px] font-bold uppercase tracking-wider transition-colors ${

                                openedStripeKeys[item.cartKey]

                                  ? 'bg-[#798771]/15 text-[#798771] border border-[#798771]/30'

                                  : 'bg-[#798771] text-white hover:bg-[#6b7764]'

                              }`}

                            >

                              {openedStripeKeys[item.cartKey] ? <><Check size={12} /> Opened</> : <>Pay <ExternalLink size={11} /></>}

                            </button>

                          )}

                        </div>

                      </div>

                    </div>

                  ))}



                  <div className="flex justify-end">

                    <button

                      type="button"

                      onClick={onClearCart}

                      className="font-lora text-xs text-[#4a4238]/55 hover:text-red-700 underline"

                    >

                      Clear Shopping Bag

                    </button>

                  </div>

                </>

              )}

            </div>



            {cart.length > 0 && (

              <div className="p-6 bg-white border-t border-[#4a4238]/10 space-y-4">

                <div className="space-y-1.5 font-lora text-sm">

                  <div className="flex justify-between text-[#4a4238]/70">

                    <span>Subtotal</span>

                    <span className="font-bold text-[#4a4238]">{formatCurrency(subtotal)}</span>

                  </div>

                  {hasDigital && (

                    <div className="flex justify-between text-xs text-[#4a4238]/65">

                      <span>Digital Downloads</span>

                      <span className="text-[#798771] font-bold">Instant Delivery (Free)</span>

                    </div>

                  )}

                  {hasPhysical && (

                    <div className="flex justify-between text-xs text-[#4a4238]/65">

                      <span>Physical Shipping</span>

                      <span>{amountToFreeShipping === 0 ? 'Complimentary' : 'Calculated at Stripe Checkout'}</span>

                    </div>

                  )}

                </div>



                {checkoutMessage && (

                  <div className="p-3 rounded-xl bg-amber-50 border border-amber-200 font-lora text-xs text-amber-900 leading-relaxed">

                    {checkoutMessage}

                  </div>

                )}



                {cart.length === 1 ? (

                  <button

                    type="button"

                    onClick={handlePrimaryCheckout}

                    className="w-full inline-flex items-center justify-center gap-2 bg-[#798771] text-white py-3.5 rounded-xl font-lora text-xs font-bold uppercase tracking-wider hover:bg-[#6b7764] transition-colors"

                  >

                    Checkout Securely with Stripe <ExternalLink size={15} />

                  </button>

                ) : (

                  <div className="space-y-2">

                    <p className="font-lora text-xs text-[#4a4238]/70 text-center">

                      Use the <strong>Pay</strong> button beside each item above to complete checkout via its Stripe Payment Link.

                    </p>

                    <button

                      type="button"

                      onClick={handlePrimaryCheckout}

                      className="w-full inline-flex items-center justify-center gap-2 bg-[#798771]/15 text-[#798771] border border-[#798771]/30 py-3 rounded-xl font-lora text-xs font-bold uppercase tracking-wider hover:bg-[#798771] hover:text-white transition-colors"

                    >

                      <ShieldCheck size={15} /> Stripe Express Checkout Help

                    </button>

                  </div>

                )}



                <p className="font-lora text-[11px] text-center text-[#4a4238]/55 flex items-center justify-center gap-1.5">

                  <ShieldCheck size={13} className="text-[#798771]" /> Encrypted payments processed safely by Stripe

                </p>

              </div>

            )}

          </aside>

        </div>

      );

    }



    function ShopCatalogView({ onAddToCart, onSelectProduct, onOpenCart, cartItemCount }) {

      const [isEditing, setIsEditing] = useState(false);

      const handleSave = (e) => {

        e.preventDefault();

        const trimmed = draft.trim();

        if (!trimmed) return;

        onEdit(task.id, trimmed);

        setIsEditing(false);

      };



      if (isEditing) {

        return (

          <li className="bg-white border border-[#798771]/40 rounded-lg p-2">

            <form onSubmit={handleSave} className="flex items-center gap-1.5">

              <input

                type="text"

                value={draft}

                onChange={(e) => setDraft(e.target.value)}

                autoFocus

                className="flex-1 min-w-0 bg-[#fdfbf7] border border-[#4a4238]/20 rounded-md px-2.5 py-1 font-lora text-xs text-[#4a4238] focus:outline-none focus:border-[#798771]"

                type="submit"

                className="p-1.5 rounded-full bg-[#798771] text-white hover:bg-[#6b7764] transition-colors"

                aria-label="Save task"

              >

                <Check size={13} />

              </button>

              <button

                type="button"

                onClick={() => { setDraft(task.text); setIsEditing(false); }}

                className="p-1.5 rounded-full text-[#4a4238]/60 hover:bg-[#4a4238]/10 transition-colors"

                aria-label="Cancel editing"

              >

                <XIcon size={13} />

              </button>

            </form>

          </li>

        );

      }



      return (

        <li className="flex items-start justify-between gap-2 group">

          <button

            onClick={() => onToggle(task.id)}

            className="flex-1 text-left flex items-start gap-2.5 min-w-0"

          >

            <CheckCircle

              size={18}

              className={`mt-0.5 shrink-0 transition-colors ${

                task.done ? 'text-[#798771]' : 'text-[#4a4238]/25 group-hover:text-[#798771]/70'

              }`}

            />

            <span className={`font-lora text-sm leading-relaxed transition-colors break-words ${task.done ? 'line-through text-[#4a4238]/40' : 'text-[#4a4238]/90'}`}>

              {task.text}

              {task.isCustom && (

                <span className="ml-2 inline-block align-middle text-[10px] font-bold uppercase tracking-wider text-[#798771] bg-[#798771]/10 px-1.5 py-0.5 rounded-full">

                  Custom

                </span>

            </span>

          </button>

          <div className="flex items-center gap-0.5 shrink-0 opacity-75 sm:opacity-45 group-hover:opacity-100 transition-opacity">

            <button

              type="button"

              onClick={() => { setDraft(task.text); setIsEditing(true); }}

              className="p-1 text-[#4a4238]/55 hover:text-[#798771] hover:bg-white rounded-full transition-colors"

              aria-label="Edit task"

              title="Edit task"

            >

              <Edit2 size={13} />

            </button>

            <button

              type="button"

              onClick={() => onDelete(task.id)}

              className="p-1 text-[#4a4238]/55 hover:text-red-700 hover:bg-white rounded-full transition-colors"

              aria-label="Delete task"

              title="Delete task"

            >

              <Trash2 size={13} />

            </button>

          </div>

        </li>

      );

    }

    function WellnessWodModal({ enrollment, onCompleteWod, onClose }) {

      const tierKey = getWellnessWodTier(enrollment);

      const tierData = WELLNESS_WOD_ENGINE[tierKey];

      const [rotationKey, setRotationKey] = useState('strength');

      const [secondsLeft, setSecondsLeft] = useState(1200);

      const [isRunning, setIsRunning] = useState(false);



      useEffect(() => {

        if (!isRunning) return;

        const handle = setInterval(() => {

          setSecondsLeft(prev => {

            if (prev <= 1) {

              setIsRunning(false);

              return 0;

            }

            return prev - 1;

          });

        }, 1000);

        return () => clearInterval(handle);

      }, [isRunning]);



      const workout = tierData.rotations[rotationKey];



      return (

        <div className="fixed inset-0 bg-[#4a4238]/60 z-50 flex items-center justify-center p-4 no-print print:hidden">

          <div className="bg-[#fdfbf7] w-full max-w-2xl rounded-2xl shadow-2xl overflow-hidden max-h-[92vh] flex flex-col border border-[#4a4238]/15">

            <div className="p-6 bg-white border-b border-[#4a4238]/10 flex items-start justify-between gap-4">

              <div>

                <span className="inline-block px-3 py-1 rounded-full bg-[#798771]/15 text-[#798771] font-lora text-[11px] font-bold uppercase tracking-wider mb-2">

                  {tierData.badge}

                </span>

                <h2 className="font-playfair text-2xl md:text-3xl text-[#4a4238]">{workout.title}</h2>

                <p className="font-lora text-xs text-[#4a4238]/70 mt-1">{tierData.summary}</p>

              </div>

              <button type="button" onClick={onClose} className="p-2 hover:bg-[#4a4238]/5 rounded-full text-[#4a4238]">

                <XIcon size={20} />

              </button>

            </div>



            <div className="overflow-y-auto p-6 space-y-5">

              <div className="flex flex-wrap gap-2">

                {[

                  { key: 'strength', label: 'Mon/Wed/Fri: Strength' },

                  { key: 'lymph', label: 'Tue/Thu: Lymph & Core' },

                  { key: 'mobility', label: 'Sat/Sun: Mobility & Calm' }

                ].map(item => (

                  <button

                    key={item.key}

                    type="button"

                    onClick={() => setRotationKey(item.key)}

                    className={`px-4 py-2 rounded-full font-lora text-xs font-bold border transition-colors ${

                      rotationKey === item.key

                        ? 'bg-[#798771] text-white border-[#798771]'

                        : 'bg-white text-[#4a4238] border-[#4a4238]/20 hover:border-[#798771]'

                    }`}

                  >

                    {item.label}

                  </button>

                ))}

              </div>



              <div className="bg-white border border-[#4a4238]/15 rounded-2xl p-5 flex flex-col sm:flex-row items-center justify-between gap-4">

                <div>

                  <span className="font-lora text-[11px] font-bold uppercase tracking-widest text-[#798771] block">

                    20-Minute Guided Session Timer

                  </span>

                  <div className="font-playfair text-4xl font-bold text-[#4a4238] mt-1">

                    {formatTimerClock(secondsLeft)}

                  </div>

                </div>

                <div className="flex items-center gap-2">

                  <button

                    type="button"

                    onClick={() => setIsRunning(r => !r)}

                    className="inline-flex items-center gap-2 bg-[#798771] text-white px-5 py-2.5 rounded-full font-lora text-xs font-bold uppercase tracking-wider hover:bg-[#6b7764] transition-colors"

                  >

                    {isRunning ? <><Pause size={14} /> Pause</> : <><Play size={14} /> Start Timer</>}

                  </button>

                  <button

                    type="button"

                    onClick={() => { setIsRunning(false); setSecondsLeft(1200); }}

                    className="inline-flex items-center gap-1.5 bg-[#fdfbf7] text-[#4a4238] border border-[#4a4238]/20 px-4 py-2.5 rounded-full font-lora text-xs font-bold uppercase tracking-wider hover:border-[#798771]"

                  >

                    <RotateCcw size={13} /> Reset

                  </button>

                </div>

              </div>



              <div className="space-y-3">

                {workout.steps.map((st, idx) => (

                  <div key={idx} className="bg-white border border-[#4a4238]/10 rounded-xl p-4 space-y-1.5">

                    <span className="inline-block px-2.5 py-0.5 rounded-full bg-[#798771]/10 text-[#798771] font-lora text-[11px] font-bold">

                      {st.timeLabel}

                    </span>

                    <h4 className="font-playfair text-lg text-[#4a4238] font-semibold">{st.move}</h4>

                    <p className="font-lora text-xs text-[#4a4238]/75 italic">Coaching Cue: {st.cue}</p>

                  </div>

                ))}

              </div>



              <button

                type="button"

                onClick={() => { onCompleteWod(); onClose(); }}

                className="w-full inline-flex items-center justify-center gap-2 bg-[#4a4238] text-white py-3.5 rounded-xl font-lora text-xs font-bold uppercase tracking-wider hover:bg-[#3a332b] transition-colors"

              >

                <Check size={15} /> Complete Movement &amp; Check Off Today&apos;s Box

              </button>

            </div>

          </div>

        </div>

      );

    }

       function WellnessClientPortal({

      user,

      enrollment,

      checkins,

      messages,

      waitlistSubmitted,

      onPatchEnrollment,

      onOpenWod,

      onOpenMealPicker,

      onSubmitCheckin,

      onSendMessage,

      onSubmitWaitlist

    }) {

      const [subTab, setSubTab] = useState('today'); // 'today' | 'meals' | 'roadmap' | 'protocol' | 'checkins' | 'messages'

      const [statusToast, setStatusToast] = useState('');



      // Check-in Assessment local form state

      const [ciEnergy, setCiEnergy] = useState(enrollment?.biofeedback?.energy || 4);

      const [ciSleep, setCiSleep] = useState(enrollment?.biofeedback?.sleep || 4);

      const [ciDigestion, setCiDigestion] = useState(enrollment?.biofeedback?.digestion || 4);

      const [ciClarity, setCiClarity] = useState(enrollment?.biofeedback?.mood || 4);

      const [ciStress, setCiStress] = useState(3);

      const [ciAdherence, setCiAdherence] = useState('Consistent with daily habits & protocol');

      const [ciWins, setCiWins] = useState('');

      const [ciQuestions, setCiQuestions] = useState('');

      const [ciSubmitting, setCiSubmitting] = useState(false);



      // Message input state

      const [msgDraft, setMsgDraft] = useState('');

      const [msgSending, setMsgSending] = useState(false);



      const flashStatus = (text) => {

        setStatusToast(text);

        setTimeout(() => setStatusToast(''), 3000);

      };



      const activeStepNum = Math.max(1, Math.min(12, Number(enrollment.active_step) || 1));

      const activeStepMeta = WELLNESS_12_STEPS.find(s => s.num === activeStepNum) || WELLNESS_12_STEPS[0];

      const requiredDays = Number(enrollment.required_days) || 14;

      const targetPct = Number(enrollment.target_compliance_pct) || 90;

      const daysCompleted = Number(enrollment.days_completed) || 0;

      const targetDaysNeeded = Math.ceil((requiredDays * targetPct) / 100);

      const progressPct = Math.min(100, Math.round((daysCompleted / Math.max(1, targetDaysNeeded)) * 100));

      const gateCleared = daysCompleted >= targetDaysNeeded;

      const isOneOnOne = enrollment.tier === 'one_on_one';



      const cumulativeTasks = getCumulativeWellnessTasks(enrollment);

      const checkedToday = getNormalizedCheckedToday(enrollment);

      const completedCountToday = cumulativeTasks.filter(t => checkedToday.includes(t.id)).length;

      const easyMode = !!enrollment.easy_mode_today;

      const mealSlots = { ...DEFAULT_WELLNESS_MEAL_SLOTS, ...(enrollment.meal_slots || {}) };

      const bio = { energy: 3, sleep: 3, digestion: 3, mood: 3, ...(enrollment.biofeedback || {}) };

      const wodTier = getWellnessWodTier(enrollment);

      const unreadFromPractitioner = (messages || []).filter(m => m.sender_role === 'practitioner' && !m.is_read).length;



      const toggleTask = (taskId) => {

        const next = checkedToday.includes(taskId)

          ? checkedToday.filter(id => id !== taskId)

          : [...checkedToday, taskId];

        onPatchEnrollment({ checked_today: next, checked_date: getTodayIsoDate() });

      };



      const toggleEasyMode = () => {

        const nextEasy = !easyMode;

        onPatchEnrollment({

          easy_mode_today: nextEasy,

          easy_days_streak: nextEasy ? (Number(enrollment.easy_days_streak) || 0) + 1 : 0

        });

        flashStatus(nextEasy ? 'Switched to 60-Second Low-Energy Floor tasks for today.' : 'Restored standard daily habits.');

      };



      const lockInDay = () => {

        const allIds = cumulativeTasks.map(t => t.id);

        const nextDays = Math.min(requiredDays, daysCompleted + 1);

        onPatchEnrollment({

          checked_today: allIds,

          checked_date: getTodayIsoDate(),

          days_completed: nextDays

        });

        flashStatus(`Day logged! You have completed ${nextDays} of ${requiredDays} days in Step ${activeStepNum}.`);

      };



      const unlockNextStep = () => {

        if (activeStepNum >= 12) return;

        const nextStep = activeStepNum + 1;

        onPatchEnrollment({

          active_step: nextStep,

          days_completed: 0,

          checked_today: [],

          checked_date: getTodayIsoDate(),

          easy_mode_today: false

        });

        flashStatus(nextStep === 8

          ? 'Unlocked Step 8! Added your 2nd High-Protein Meal and upgraded Movement to Tier 2 Intensity.'

          : `Unlocked Step ${nextStep}! One new habit has been added to your daily stack.`);

      };



      const updateBio = (key, val) => {

        onPatchEnrollment({ biofeedback: { ...bio, [key]: val } });

      };



      const handleCheckinFormSubmit = async (e) => {

        e.preventDefault();

        setCiSubmitting(true);

        const ok = await onSubmitCheckin({

          step_num: activeStepNum,

          compliance_pct: progressPct,

          scores: { energy: ciEnergy, sleep: ciSleep, digestion: ciDigestion, clarity: ciClarity, stress: ciStress },

          protocol_adherence: ciAdherence,

          wins: ciWins.trim(),

          questions: ciQuestions.trim()

        });

        setCiSubmitting(false);

        if (ok) {

          setCiWins('');

          setCiQuestions('');

          flashStatus('Check-in assessment submitted! Ashton has been notified in her Practitioner Studio.');

        }

      };



      const handleSendMsgSubmit = async (e) => {

        e.preventDefault();

        if (!msgDraft.trim()) return;

        setMsgSending(true);

        const ok = await onSendMessage(msgDraft.trim());

        setMsgSending(false);

        if (ok) setMsgDraft('');

      };



      const renderTaskLabel = (task) => {

        const raw = easyMode ? task.floor : task.normal;

        const tokenMap = [

          { token: '[SMOOTHIE]', slotKey: 'smoothie', val: mealSlots.smoothie },

          { token: '[MEAT_MEAL_1]', slotKey: 'meatMeal1', val: mealSlots.meatMeal1 },

          { token: '[PROTEIN_SNACK]', slotKey: 'proteinSnack', val: mealSlots.proteinSnack },

          { token: '[MEAT_MEAL_2]', slotKey: 'meatMeal2', val: mealSlots.meatMeal2 },

          { token: '[ESTROGEN_SNACK]', slotKey: 'estrogenSnack', val: mealSlots.estrogenSnack }

        ];

        const found = tokenMap.find(m => raw.includes(m.token));

        if (!found) return raw;

        const parts = raw.split(found.token);

        return (

          <>

            {parts[0]}

            <button

              type="button"

              onClick={(e) => { e.stopPropagation(); onOpenMealPicker(found.slotKey); }}

              className="inline-flex items-center gap-1 mx-1 px-2.5 py-0.5 rounded-full bg-[#798771]/15 text-[#4a4238] border border-[#798771]/35 font-lora text-xs font-bold hover:bg-[#798771] hover:text-white transition-colors"

            >

              {found.val} <ChevronDown size={12} />

            </button>

            {parts[1]}

          </>

        );

      };



      const subTabs = [

        { id: 'today', label: `Today's Steps (${cumulativeTasks.length})` },

        { id: 'meals', label: 'Meals & Movement' },

        { id: 'roadmap', label: '12-Step Map' },

        { id: 'protocol', label: 'My Protocol' },

        { id: 'checkins', label: 'Check-In Assessments' },

        { id: 'messages', label: unreadFromPractitioner > 0 ? `Messages (${unreadFromPractitioner})` : 'Messages' }

      ];



      return (

        <div className="space-y-8">

          <div className="bg-white border border-[#4a4238]/12 rounded-2xl p-6 md:p-8 shadow-sm space-y-6">

            <div className="flex flex-col lg:flex-row lg:items-center justify-between gap-6">

              <div className="space-y-2 max-w-2xl">

                <div className="flex flex-wrap items-center gap-2">

                  <span className="px-3 py-1 rounded-full bg-[#798771] text-white font-lora text-[11px] font-bold uppercase tracking-wider">

                    Step {activeStepNum} of 12

                  </span>

                  <span className="px-3 py-1 rounded-full bg-[#fdfbf7] text-[#4a4238] border border-[#4a4238]/15 font-lora text-[11px] font-bold uppercase tracking-wider">

                    {isOneOnOne ? '1:1 Guided Client Practice' : 'Self-Paced Foundation ($240)'}

                  </span>

                </div>

                <h2 className="font-playfair text-3xl md:text-4xl italic text-[#4a4238]">

                  Step {activeStepMeta.num}: {activeStepMeta.title}

                </h2>

                <p className="font-lora text-sm text-[#4a4238]/75 leading-relaxed">

                  {activeStepMeta.subtitle}

                </p>

              </div>



              <div className="bg-[#fdfbf7] border border-[#4a4238]/10 rounded-xl p-5 min-w-[260px] space-y-2.5">

                <div className="flex items-center justify-between font-lora text-xs font-bold">

                  <span className="uppercase tracking-wider text-[#798771]">{targetPct}% Mastery Gate</span>

                  <span className="text-[#4a4238]">{daysCompleted} / {targetDaysNeeded} Days</span>

                </div>

                <div className="w-full h-2 bg-[#4a4238]/10 rounded-full overflow-hidden">

                  <div className="h-full bg-[#798771] rounded-full transition-all duration-500" style={{ width: `${progressPct}%` }} />

                </div>

                <p className="font-lora text-[11px] text-[#4a4238]/65">

                  14-Day Rhythm Window • {completedCountToday} of {cumulativeTasks.length} habits checked today

                </p>

              </div>

            </div>



            <div className="grid grid-cols-7 sm:grid-cols-[repeat(14,minmax(0,1fr))] gap-1.5">

              {Array.from({ length: requiredDays }, (_, idx) => {

                const dayNum = idx + 1;

                const isDone = dayNum <= daysCompleted;

                const isCurrent = dayNum === daysCompleted + 1;

                return (

                  <div

                    key={dayNum}

                    className={`h-8 rounded-lg flex items-center justify-center font-lora text-xs font-bold border ${

                      isDone

                        ? 'bg-[#798771] text-white border-[#798771]'

                        : isCurrent

                        ? 'bg-white text-[#798771] border-2 border-[#798771]'

                        : 'bg-[#fdfbf7] text-[#4a4238]/40 border-[#4a4238]/10'

                    }`}

                  >

                    {isDone ? '✓' : `D${dayNum}`}

                  </div>

                );

              })}

            </div>



            {gateCleared && activeStepNum < 12 && (
