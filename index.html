      { id: 'rec_sm1', name: 'Berry Collagen & Raw Honey Glow Smoothie', category: 'Drink', prepTime: '5 Mins', cookTime: '0 Mins', instructions: '1. Pour whole milk into the blender base first so powders never clump at the bottom.\n2. Add frozen mixed berries, grass-fed collagen peptides, and raw honey.\n3. Blend on high for 45–60 seconds until thick, frosty, and smooth.', ingredients: [{ name: 'Mixed Berries (Fresh or Frozen)', qty: 0.5, unit: 'cups' }, { name: 'Whole Milk', qty: 0.75, unit: 'cups' }, { name: 'Grass-Fed Collagen Peptides', qty: 1, unit: 'tbsp' }, { name: 'Raw Local Honey', qty: 0.5, unit: 'tbsp' }] },

      { id: 'rec_bf10', name: 'Baked Blueberry-Lemon French Toast Casserole', category: 'Breakfast', prepTime: '10 Mins', cookTime: '30 Mins', instructions: '1. Grease a 9x13 baking dish with butter and fill with 1-inch cubes of sourdough or whole-grain bread.\n2. Scatter fresh or frozen blueberries evenly over the bread cubes.\n3. Whisk pasture eggs, whole milk, heavy cream, grated lemon zest, and pure maple syrup; pour evenly over the bread.\n4. Bake uncovered at 350°F for 30–35 minutes until the custard is set and the top is golden-crisp.', ingredients: [{ name: 'Artisan Sourdough or Whole-Grain Bread', qty: 2, unit: 'slices' }, { name: 'Pasture-Raised Eggs', qty: 1.5, unit: 'eggs' }, { name: 'Whole Milk', qty: 0.35, unit: 'cups' }, { name: 'Blueberries', qty: 0.4, unit: 'cups' }, { name: 'Pure Maple Syrup', qty: 1, unit: 'tbsp' }, { name: 'Grass-Fed Butter', qty: 0.5, unit: 'tbsp' }] },

      { id: 'rec_lk1', name: 'DIY Bistro Lunchbox Board (Turkey, Cheese, Grapes & Crackers)', category: 'Lunch', prepTime: '5 Mins', cookTime: '0 Mins', instructions: '1. Roll slices of oven-roasted turkey breast into pinwheels and cut sharp cheddar into bite-sized cubes.\n2. Wash seedless grapes and slice crisp English cucumbers into coins.\n3. Arrange on plates alongside crisp whole-grain or sourdough crackers for an easy, zero-cook lunch.', ingredients: [{ name: 'Oven-Roasted Turkey Breast', qty: 0.2, unit: 'lbs' }, { name: 'Sharp Cheddar Cheese', qty: 1.5, unit: 'oz' }, { name: 'Red Seedless Grapes', qty: 0.5, unit: 'cups' }, { name: 'English Cucumbers', qty: 0.25, unit: 'whole' }] },
      { id: 'rec_lk2', name: 'Golden Toasted Cheddar & Crisp Apple Panini with Carrots', category: 'Lunch', prepTime: '2 Mins', cookTime: '8 Mins', instructions: '1. Butter the outsides of two slices of sourdough or whole-wheat bread.\n2. Layer sliced sharp cheddar and paper-thin Honeycrisp apple slices inside.\n3. Grill in a warm skillet for 3 minutes per side until the bread is golden-crisp and cheese is gooey; serve with crunchy baby carrots.', ingredients: [{ name: 'Artisan Sourdough or Whole-Grain Bread', qty: 2, unit: 'slices' }, { name: 'Sharp Cheddar Cheese', qty: 1.5, unit: 'oz' }, { name: 'Honeycrisp Apples', qty: 0.5, unit: 'whole' }, { name: 'Organic Carrots', qty: 0.4, unit: 'cups' }, { name: 'Grass-Fed Butter', qty: 0.5, unit: 'tbsp' }] },
      { id: 'rec_lk3', name: 'Mini Flatbread Personal Pizzas with Veggie-Rich Marinara', category: 'Lunch', prepTime: '5 Mins', cookTime: '10 Mins', instructions: '1. Preheat oven to 400°F and place flatbreads or pitas on a baking sheet.\n2. Spread pure crushed tomato sauce over each flatbread and sprinkle generously with shredded mozzarella.\n3. Bake 8–10 minutes until bubbly and golden; slice into wedges and serve with fresh apple slices.', ingredients: [{ name: 'Artisan Sourdough or Whole-Grain Bread', qty: 1.5, unit: 'slices' }, { name: 'Shredded Mozzarella Cheese', qty: 1.5, unit: 'oz' }, { name: 'Crushed Tomatoes (No Sugar Added)', qty: 0.25, unit: 'cups' }, { name: 'Honeycrisp Apples', qty: 0.5, unit: 'whole' }] },
      { id: 'rec_lk4', name: 'Creamy Stovetop Cheddar Mac & Cheese with Sweet Peas', category: 'Lunch', prepTime: '5 Mins', cookTime: '10 Mins', instructions: '1. Boil pasta in salted water for 8 minutes; toss in frozen sweet green peas during the last 2 minutes of boiling, then drain.\n2. Return warm pasta and peas to the pot over low heat.\n3. Stir in grass-fed butter, a splash of whole milk, and shredded sharp cheddar until velvety and melted.', ingredients: [{ name: 'Unbleached Pasta or Einkorn Pasta', qty: 2, unit: 'oz' }, { name: 'Sharp Cheddar Cheese', qty: 1.5, unit: 'oz' }, { name: 'Whole Milk', qty: 0.25, unit: 'cups' }, { name: 'Sweet Green Peas', qty: 0.35, unit: 'cups' }, { name: 'Grass-Fed Butter', qty: 0.5, unit: 'tbsp' }] },
      { id: 'rec_lk5', name: 'Crispy Skillet Chicken Tenders with Honey-Mustard & Strawberries', category: 'Lunch', prepTime: '5 Mins', cookTime: '10 Mins', instructions: '1. Slice chicken breasts into tender strips and season lightly with sea salt and garlic powder.\n2. Dredge lightly in flour and pan-sear in grass-fed butter over medium heat for 4 minutes per side until golden and cooked through.\n3. Whisk raw honey with Dijon mustard for dipping and serve alongside fresh strawberries.', ingredients: [{ name: 'Boneless Skinless Chicken Breasts', qty: 0.25, unit: 'lbs' }, { name: 'Fresh Strawberries', qty: 0.5, unit: 'cups' }, { name: 'Grass-Fed Butter', qty: 0.5, unit: 'tbsp' }, { name: 'Raw Local Honey', qty: 0.5, unit: 'tbsp' }] },
      { id: 'rec_lk6', name: 'Cheesy Beef Quesadilla Triangles with Smashed Avocado', category: 'Lunch', prepTime: '5 Mins', cookTime: '5 Mins', instructions: '1. Brown ground beef in a skillet with a pinch of cumin and garlic powder (or use pre-cooked taco beef).\n2. Sprinkle shredded cheddar and warm beef onto half a tortilla, fold in half, and toast 2 minutes per side in a lightly buttered skillet.\n3. Cut into triangles and serve with mashed avocado and orange slices.', ingredients: [{ name: '80/20 Ground Beef', qty: 0.2, unit: 'lbs' }, { name: 'Sharp Cheddar Cheese', qty: 1.5, unit: 'oz' }, { name: 'Ripe Avocados', qty: 0.25, unit: 'whole' }, { name: 'Navel Oranges', qty: 0.5, unit: 'whole' }] },
      { id: 'rec_lk7', name: 'Peanut Butter, Raw Honey & Banana Sushi Roll-Ups', category: 'Lunch', prepTime: '5 Mins', cookTime: '0 Mins', instructions: '1. Spread creamy peanut butter and a drizzle of raw honey evenly across soft flatbread or bread.\n2. Place a peeled whole banana along one edge and roll up tightly like a log.\n3. Slice into bite-sized coins and serve with crunchy carrot sticks.', ingredients: [{ name: 'Ripe Bananas', qty: 1, unit: 'whole' }, { name: 'Creamy Peanut Butter', qty: 1.5, unit: 'tbsp' }, { name: 'Raw Local Honey', qty: 0.5, unit: 'tbsp' }, { name: 'Organic Carrots', qty: 0.4, unit: 'cups' }] },
      { id: 'rec_lk8', name: 'Creamy Tomato-Basil Bone-Broth Soup & Grilled Cheese Strips', category: 'Lunch', prepTime: '5 Mins', cookTime: '10 Mins', instructions: '1. Simmer crushed tomatoes and chicken bone broth in a saucepan for 8 minutes, then stir in a splash of heavy cream.\n2. Meanwhile, grill sharp cheddar between buttered sourdough slices until crisp.\n3. Slice the grilled cheese into dippable strips and serve alongside warm mugs of soup.', ingredients: [{ name: 'Crushed Tomatoes (No Sugar Added)', qty: 0.5, unit: 'cups' }, { name: 'Chicken Bone Broth', qty: 0.5, unit: 'cups' }, { name: 'Artisan Sourdough or Whole-Grain Bread', qty: 2, unit: 'slices' }, { name: 'Sharp Cheddar Cheese', qty: 1.5, unit: 'oz' }, { name: 'Heavy Whipping Cream', qty: 1, unit: 'tbsp' }] },
      { id: 'rec_lk9', name: 'Warm Turkey & Cheddar Melts with Crisp Apple Wedges', category: 'Lunch', prepTime: '2 Mins', cookTime: '8 Mins', instructions: '1. Layer sliced roasted turkey breast and cheddar cheese onto sourdough bread and warm in a skillet until melted.\n2. Slice crisp apples into wedges and serve on the side.', ingredients: [{ name: 'Oven-Roasted Turkey Breast', qty: 0.2, unit: 'lbs' }, { name: 'Sharp Cheddar Cheese', qty: 1.5, unit: 'oz' }, { name: 'Artisan Sourdough or Whole-Grain Bread', qty: 2, unit: 'slices' }, { name: 'Honeycrisp Apples', qty: 0.5, unit: 'whole' }] },
      { id: 'rec_lk10', name: 'Sweet Bell-Pepper Nacho Boats with Seasoned Beef & Cheddar', category: 'Lunch', prepTime: '7 Mins', cookTime: '8 Mins', instructions: '1. Slice sweet bell peppers into wide boat shapes and arrange on a baking sheet.\n2. Spoon warm seasoned ground beef into each pepper boat and top with shredded sharp cheddar.\n3. Bake at 375°F for 8 minutes until cheese is bubbly and peppers are tender-crisp.', ingredients: [{ name: '80/20 Ground Beef', qty: 0.25, unit: 'lbs' }, { name: 'Sweet Bell Peppers', qty: 1, unit: 'whole' }, { name: 'Sharp Cheddar Cheese', qty: 1.5, unit: 'oz' }] },
      { id: 'rec_la1', name: '10-Min Mediterranean Grilled Chicken, Cucumber & Feta Bowl (42g Protein)', category: 'Lunch', prepTime: '5 Mins', cookTime: '5 Mins', instructions: '1. Season chicken breast strips with oregano, garlic, and sea salt; sear in olive oil or butter for 4 minutes per side.\n2. Fill a wide bowl with fresh baby spinach, diced English cucumber, and halved cherry tomatoes.\n3. Top with the warm chicken, crumbled feta/cheddar, and a drizzle of extra-virgin olive oil and fresh lemon juice.', ingredients: [{ name: 'Boneless Skinless Chicken Breasts', qty: 0.35, unit: 'lbs' }, { name: 'Fresh Baby Spinach', qty: 1, unit: 'cups' }, { name: 'English Cucumbers', qty: 0.35, unit: 'whole' }, { name: 'Cherry Tomatoes', qty: 0.4, unit: 'cups' }, { name: 'Extra-Virgin Olive Oil', qty: 1, unit: 'tbsp' }] },
      { id: 'rec_la2', name: 'Wild Salmon, Avocado & Crisp Greens Power Bowl (38g Protein)', category: 'Lunch', prepTime: '5 Mins', cookTime: '3 Mins', instructions: '1. Arrange fresh baby spinach and sliced cucumbers in a large bowl.\n2. Top with flaked wild-caught salmon, diced ripe avocado, and grated Parmesan cheese.\n3. Whisk Greek yogurt with fresh lemon juice and a pinch of garlic salt for a fast, creamy dressing.', ingredients: [{ name: 'Wild-Caught Salmon', qty: 0.35, unit: 'lbs' }, { name: 'Fresh Baby Spinach', qty: 1, unit: 'cups' }, { name: 'Ripe Avocados', qty: 0.5, unit: 'whole' }, { name: 'Whole Milk Greek Yogurt', qty: 2, unit: 'tbsp' }, { name: 'Fresh Lemons', qty: 0.25, unit: 'whole' }] },
      { id: 'rec_la3', name: 'Steakhouse Cobb Salad with Pasture Eggs & Avocado (45g Protein)', category: 'Lunch', prepTime: '5 Mins', cookTime: '7 Mins', instructions: '1. Sear top sirloin steak strips in hot butter for 2–3 minutes until medium-rare and tender.\n2. Layer fresh baby spinach, halved cherry tomatoes, diced avocado, and two sliced hard-boiled pasture eggs in a bowl.\n3. Top with the warm steak strips, shredded sharp cheddar, and olive oil lemon dressing.', ingredients: [{ name: 'Top Sirloin Steak', qty: 0.35, unit: 'lbs' }, { name: 'Pasture-Raised Eggs', qty: 2, unit: 'eggs' }, { name: 'Fresh Baby Spinach', qty: 1, unit: 'cups' }, { name: 'Ripe Avocados', qty: 0.5, unit: 'whole' }, { name: 'Cherry Tomatoes', qty: 0.4, unit: 'cups' }] },
      { id: 'rec_la4', name: '12-Min Ground Beef, Zucchini & Sweet Pepper Taco Skillet (38g Protein)', category: 'Lunch', prepTime: '5 Mins', cookTime: '7 Mins', instructions: '1. Brown 80/20 ground beef in a skillet over medium-high heat with cumin, garlic powder, and sea salt for 5 minutes.\n2. Toss in diced zucchini and diced sweet bell peppers; sauté 4 minutes until tender-crisp.\n3. Top with diced ripe avocado and a dollop of Greek yogurt.', ingredients: [{ name: '80/20 Ground Beef', qty: 0.35, unit: 'lbs' }, { name: 'Fresh Zucchini', qty: 0.5, unit: 'whole' }, { name: 'Sweet Bell Peppers', qty: 0.5, unit: 'whole' }, { name: 'Ripe Avocados', qty: 0.5, unit: 'whole' }] },
      { id: 'rec_la5', name: 'High-Protein Chicken, Apple, Pecan & Greens Bistro Bowl (38g Protein)', category: 'Lunch', prepTime: '6 Mins', cookTime: '0 Mins', instructions: '1. Toss fresh baby spinach with warm or chilled diced chicken breast, diced Honeycrisp apple, raw pecans, and sharp cheddar cubes.\n2. Drizzle with extra-virgin olive oil and a touch of pure maple syrup and lemon juice.', ingredients: [{ name: 'Boneless Skinless Chicken Breasts', qty: 0.35, unit: 'lbs' }, { name: 'Fresh Baby Spinach', qty: 1, unit: 'cups' }, { name: 'Honeycrisp Apples', qty: 0.5, unit: 'whole' }, { name: 'Raw Pecans', qty: 1.5, unit: 'tbsp' }, { name: 'Sharp Cheddar Cheese', qty: 1, unit: 'oz' }] },
      { id: 'rec_la6', name: 'Hot Cast-Iron Turkey, Avocado, Tomato & Cheddar Melt (36g Protein)', category: 'Lunch', prepTime: '3 Mins', cookTime: '7 Mins', instructions: '1. Layer thick oven-roasted turkey breast, sharp cheddar, sliced tomatoes, and ripe avocado between buttered sourdough slices.\n2. Toast in a skillet over medium heat for 3 minutes per side until golden and melty.', ingredients: [{ name: 'Oven-Roasted Turkey Breast', qty: 0.35, unit: 'lbs' }, { name: 'Sharp Cheddar Cheese', qty: 1.5, unit: 'oz' }, { name: 'Ripe Avocados', qty: 0.5, unit: 'whole' }, { name: 'Artisan Sourdough or Whole-Grain Bread', qty: 2, unit: 'slices' }] },
      { id: 'rec_la7', name: 'Greek Beef Gyro Bowl with Cucumber Yogurt Tzatziki (40g Protein)', category: 'Lunch', prepTime: '5 Mins', cookTime: '7 Mins', instructions: '1. Sear ground beef with oregano, garlic, and sea salt for 6 minutes until browned.\n2. Grate or dice English cucumber into whole milk Greek yogurt with lemon juice to make quick tzatziki.\n3. Serve the warm beef over baby spinach and cherry tomatoes with a generous scoop of tzatziki.', ingredients: [{ name: '80/20 Ground Beef', qty: 0.35, unit: 'lbs' }, { name: 'English Cucumbers', qty: 0.5, unit: 'whole' }, { name: 'Cherry Tomatoes', qty: 0.5, unit: 'cups' }, { name: 'Whole Milk Greek Yogurt', qty: 0.35, unit: 'cups' }, { name: 'Fresh Baby Spinach', qty: 1, unit: 'cups' }] },
      { id: 'rec_la8', name: '12-Min Egg-Roll-In-A-Bowl with Shredded Cabbage & Carrots (35g Protein)', category: 'Lunch', prepTime: '5 Mins', cookTime: '7 Mins', instructions: '1. Brown ground beef or pork in a skillet for 5 minutes.\n2. Add finely shredded green cabbage, grated carrots, a splash of bone broth, and coconut aminos.\n3. Sauté 5 minutes until the cabbage is tender-crisp and top with a fried pasture egg.', ingredients: [{ name: '80/20 Ground Beef', qty: 0.35, unit: 'lbs' }, { name: 'Green Cabbage', qty: 1, unit: 'cups' }, { name: 'Organic Carrots', qty: 0.5, unit: 'cups' }, { name: 'Pasture-Raised Eggs', qty: 1, unit: 'eggs' }] },
      { id: 'rec_la9', name: '3-Egg Spinach, Tomato & Cottage Cheese Power Frittata (34g Protein)', category: 'Lunch', prepTime: '3 Mins', cookTime: '7 Mins', instructions: '1. Whisk 3 pasture-raised eggs with whole milk Greek yogurt or cottage cheese for extra protein.\n2. Sauté baby spinach and cherry tomatoes in butter for 2 minutes, pour in the egg mixture, and cook until set.', ingredients: [{ name: 'Pasture-Raised Eggs', qty: 3, unit: 'eggs' }, { name: 'Whole Milk Greek Yogurt', qty: 0.25, unit: 'cups' }, { name: 'Fresh Baby Spinach', qty: 0.75, unit: 'cups' }, { name: 'Cherry Tomatoes', qty: 0.4, unit: 'cups' }, { name: 'Grass-Fed Butter', qty: 0.5, unit: 'tbsp' }] },
      { id: 'rec_la10', name: 'Nourishing Shredded Chicken, Carrot & Bone-Broth Mug Soup (36g Protein)', category: 'Lunch', prepTime: '4 Mins', cookTime: '8 Mins', instructions: '1. Bring rich chicken bone broth to a simmer with diced carrots and shredded chicken breast.\n2. Simmer 8 minutes until carrots are tender, finish with grass-fed butter and lemon juice, and serve with buttered sourdough toast.', ingredients: [{ name: 'Boneless Skinless Chicken Breasts', qty: 0.35, unit: 'lbs' }, { name: 'Chicken Bone Broth', qty: 1.25, unit: 'cups' }, { name: 'Organic Carrots', qty: 0.5, unit: 'cups' }, { name: 'Artisan Sourdough or Whole-Grain Bread', qty: 1, unit: 'slices' }] },

      // DINNERS
      { id: 'rec_df1', name: 'Sunday Pot Roast with Carrots, Potatoes & Bone-Broth Gravy', category: 'Beef', prepTime: '15 Mins', cookTime: '3.5 Hrs', instructions: '1. Sear the seasoned beef chuck roast in grass-fed butter over medium-high heat for 3 minutes per side to lock in flavor.\n2. Pour in beef bone broth and arrange halved yellow potatoes and thick-cut carrots around the roast.\n3. Cover tightly and braise at 300°F for 3 hours (or Slow Cooker on Low for 6–7 hours) until fork-tender.\n4. Remove roast and veggies to a warm platter, and whisk pan juices with a pat of butter for rich homemade gravy.', ingredients: [{ name: 'Beef Chuck Roast', qty: 0.4, unit: 'lbs' }, { name: 'Yellow Potatoes', qty: 0.35, unit: 'lbs' }, { name: 'Organic Carrots', qty: 0.5, unit: 'cups' }, { name: 'Beef Bone Broth', qty: 0.5, unit: 'cups' }, { name: 'Grass-Fed Butter', qty: 0.5, unit: 'tbsp' }] },
      { id: 'rec_df2', name: "Homestead Shepherd's Pie with Whipped Mashed Potatoes", category: 'Beef', prepTime: '15 Mins', cookTime: '25 Mins', instructions: '1. Boil cubed yellow potatoes in salted water for 12 minutes until tender, then mash with grass-fed butter and whole milk.\n2. Meanwhile, brown 80/20 ground beef in a large skillet and stir in diced carrots, sweet green peas, and beef bone broth; simmer 5 minutes.\n3. Spread the savory beef and veggie mixture into a 9x13 baking dish, top with the fluffy mashed potatoes and shredded cheddar, and bake at 375°F for 18 minutes until golden.', ingredients: [{ name: '80/20 Ground Beef', qty: 0.35, unit: 'lbs' }, { name: 'Yellow Potatoes', qty: 0.4, unit: 'lbs' }, { name: 'Organic Carrots', qty: 0.4, unit: 'cups' }, { name: 'Sweet Green Peas', qty: 0.35, unit: 'cups' }, { name: 'Sharp Cheddar Cheese', qty: 1, unit: 'oz' }, { name: 'Grass-Fed Butter', qty: 0.75, unit: 'tbsp' }] },
      { id: 'rec_df3', name: 'Farmhouse Chicken & Herb Dumplings in Golden Broth', category: 'Chicken', prepTime: '10 Mins', cookTime: '25 Mins', instructions: '1. Simmer cubed chicken breasts and sliced carrots in chicken bone broth with butter for 10 minutes.\n2. In a bowl, stir flour, baking powder, sea salt, melted butter, and whole milk into a soft drop-dumpling dough.\n3. Drop spoonfuls of dough right on top of the simmering broth, cover tightly with a lid, and steam 14 minutes without peeking until dumplings are fluffy.', ingredients: [{ name: 'Boneless Skinless Chicken Breasts', qty: 0.35, unit: 'lbs' }, { name: 'Chicken Bone Broth', qty: 0.75, unit: 'cups' }, { name: 'Organic Carrots', qty: 0.5, unit: 'cups' }, { name: 'Unbleached Flour or Freshly Milled Wheat', qty: 0.35, unit: 'cups' }, { name: 'Whole Milk', qty: 0.2, unit: 'cups' }, { name: 'Grass-Fed Butter', qty: 0.75, unit: 'tbsp' }] },
      { id: 'rec_df4', name: 'Baked Ziti with Meat Sauce, Spinach & Mozzarella', category: 'Beef', prepTime: '15 Mins', cookTime: '25 Mins', instructions: '1. Boil pasta in salted water until al dente and drain.\n2. Brown ground beef in a skillet, stir in crushed tomatoes and fresh baby spinach, and simmer 5 minutes.\n3. Toss the pasta with the meat sauce and a scoop of creamy Greek yogurt/ricotta, transfer to a 9x13 dish, top with shredded mozzarella, and bake 18 minutes at 375°F until bubbly.', ingredients: [{ name: '80/20 Ground Beef', qty: 0.35, unit: 'lbs' }, { name: 'Unbleached Pasta or Einkorn Pasta', qty: 2.5, unit: 'oz' }, { name: 'Crushed Tomatoes (No Sugar Added)', qty: 0.5, unit: 'cups' }, { name: 'Fresh Baby Spinach', qty: 0.5, unit: 'cups' }, { name: 'Shredded Mozzarella Cheese', qty: 1.5, unit: 'oz' }] },
      { id: 'rec_df5', name: 'Sheet-Pan Honey-Mustard Chicken, Broccoli & Sweet Potatoes', category: 'Chicken', prepTime: '5 Mins', cookTime: '25 Mins', instructions: '1. Preheat oven to 400°F and line two sheet pans with parchment paper.\n2. Arrange boneless chicken thighs and cubed sweet potatoes on the pan; roast 12 minutes.\n3. Add fresh broccoli florets to the pan, drizzle everything with melted butter, raw honey, and mustard, and roast 13 minutes more until caramelized.', ingredients: [{ name: 'Boneless Chicken Thighs', qty: 0.4, unit: 'lbs' }, { name: 'Sweet Potatoes', qty: 0.35, unit: 'lbs' }, { name: 'Fresh Broccoli Florets', qty: 0.75, unit: 'cups' }, { name: 'Raw Local Honey', qty: 0.5, unit: 'tbsp' }, { name: 'Grass-Fed Butter', qty: 0.5, unit: 'tbsp' }] },
      { id: 'rec_df6', name: 'Slow-Cooker Citrus Beef Barbacoa Taco Bar with Peppers', category: 'Beef', prepTime: '10 Mins', cookTime: '4 Hrs', instructions: '1. Place beef chuck roast in the slow cooker with beef bone broth, fresh orange juice, cumin, and garlic.\n2. Cook on Low for 6 hours until shreddable with two forks.\n3. Sauté sliced sweet bell peppers in butter for 5 minutes and serve family-style with diced avocado and shredded cheddar.', ingredients: [{ name: 'Beef Chuck Roast', qty: 0.4, unit: 'lbs' }, { name: 'Sweet Bell Peppers', qty: 0.5, unit: 'whole' }, { name: 'Ripe Avocados', qty: 0.35, unit: 'whole' }, { name: 'Sharp Cheddar Cheese', qty: 1, unit: 'oz' }, { name: 'Navel Oranges', qty: 0.25, unit: 'whole' }] },
      { id: 'rec_df7', name: 'Classic Homestead Meatloaf with Roasted Potatoes & Carrots', category: 'Beef', prepTime: '10 Mins', cookTime: '35 Mins', instructions: '1. Combine 80/20 ground beef, pasture eggs, and breadcrumbs/oats; shape into a loaf in the center of a sheet pan.\n2. Brush the top with a glaze of crushed tomatoes and raw honey.\n3. Surround the meatloaf with halved yellow potatoes and carrots tossed in butter, and bake at 375°F for 35–40 minutes.', ingredients: [{ name: '80/20 Ground Beef', qty: 0.4, unit: 'lbs' }, { name: 'Pasture-Raised Eggs', qty: 0.5, unit: 'eggs' }, { name: 'Yellow Potatoes', qty: 0.35, unit: 'lbs' }, { name: 'Organic Carrots', qty: 0.5, unit: 'cups' }, { name: 'Crushed Tomatoes (No Sugar Added)', qty: 0.2, unit: 'cups' }] },
      { id: 'rec_df8', name: 'Creamy Tuscan Garlic Chicken with Spinach & Cherry Tomatoes', category: 'Chicken', prepTime: '10 Mins', cookTime: '15 Mins', instructions: '1. Season boneless chicken breasts with sea salt and sear in grass-fed butter over medium heat for 5–6 minutes per side until golden; set on a warm plate.\n2. In the same skillet, pour in chicken bone broth, heavy whipping cream, and grated Parmesan cheese; simmer 3 minutes until slightly thickened.\n3. Toss in halved cherry tomatoes and fresh baby spinach, stir 2 minutes until wilted, and return the chicken to the pan to coat in the creamy garlic sauce.', ingredients: [{ name: 'Boneless Skinless Chicken Breasts', qty: 0.35, unit: 'lbs' }, { name: 'Fresh Baby Spinach', qty: 0.6, unit: 'cups' }, { name: 'Cherry Tomatoes', qty: 0.5, unit: 'cups' }, { name: 'Heavy Whipping Cream', qty: 0.2, unit: 'cups' }, { name: 'Grated Parmesan Cheese', qty: 0.5, unit: 'oz' }, { name: 'Grass-Fed Butter', qty: 0.5, unit: 'tbsp' }] },
      { id: 'rec_df9', name: 'Hearty Beef, Potato & Carrot Farmhouse Stew', category: 'Beef', prepTime: '15 Mins', cookTime: '60 Mins', instructions: '1. Cut beef chuck roast into 1-inch cubes and brown in butter in a hot Dutch oven.\n2. Add beef bone broth, cubed yellow potatoes, sliced carrots, and a touch of crushed tomatoes.\n3. Cover and simmer gently for 55–60 minutes until the beef is melt-in-your-mouth tender and the broth is rich.', ingredients: [{ name: 'Beef Chuck Roast', qty: 0.4, unit: 'lbs' }, { name: 'Yellow Potatoes', qty: 0.4, unit: 'lbs' }, { name: 'Organic Carrots', qty: 0.5, unit: 'cups' }, { name: 'Beef Bone Broth', qty: 0.75, unit: 'cups' }, { name: 'Grass-Fed Butter', qty: 0.5, unit: 'tbsp' }] },

      { id: 'rec_rt6', name: 'Polyphenol Blueberry, Collagen & Yogurt Gut-Repair Shake', category: 'Functional Nutrition', prepTime: '5 Mins', cookTime: '0 Mins', instructions: '1. Blend blueberries, whole milk Greek yogurt, whole milk, grass-fed collagen peptides, and raw honey until smooth.', ingredients: [{ name: 'Blueberries', qty: 0.6, unit: 'cups' }, { name: 'Whole Milk Greek Yogurt', qty: 0.5, unit: 'cups' }, { name: 'Whole Milk', qty: 0.5, unit: 'cups' }, { name: 'Grass-Fed Collagen Peptides', qty: 1, unit: 'tbsp' }] },
      { id: 'rec_rt7', name: 'Metabolic Fire 40g-Protein Sirloin Steak & Crispy Potatoes', category: 'Functional Nutrition', prepTime: '5 Mins', cookTime: '15 Mins', instructions: '1. Sear top sirloin steak in grass-fed butter with golden pan-roasted yellow potatoes and broccoli florets.', ingredients: [{ name: 'Top Sirloin Steak', qty: 0.4, unit: 'lbs' }, { name: 'Yellow Potatoes', qty: 0.35, unit: 'lbs' }, { name: 'Fresh Broccoli Florets', qty: 0.75, unit: 'cups' }, { name: 'Grass-Fed Butter', qty: 1, unit: 'tbsp' }] },
      { id: 'rec_rt8', name: 'Thyroid-Warming Chicken, Carrot & Spinach Bone-Broth Stew', category: 'Functional Nutrition', prepTime: '10 Mins', cookTime: '15 Mins', instructions: '1. Simmer boneless chicken thighs, carrots, and baby spinach in chicken bone broth and cream until warm and nourishing.', ingredients: [{ name: 'Boneless Chicken Thighs', qty: 0.4, unit: 'lbs' }, { name: 'Organic Carrots', qty: 0.6, unit: 'cups' }, { name: 'Fresh Baby Spinach', qty: 0.75, unit: 'cups' }, { name: 'Chicken Bone Broth', qty: 0.75, unit: 'cups' }] },
      { id: 'rec_rt9', name: 'Follicular-Phase Fresh-Milled Protein Pancakes with Berries', category: 'Functional Nutrition', prepTime: '5 Mins', cookTime: '10 Mins', instructions: '1. Blend pasture eggs, Greek yogurt, and flour; cook golden pancakes on a buttered griddle and top with warm mixed berries.', ingredients: [{ name: 'Pasture-Raised Eggs', qty: 2, unit: 'eggs' }, { name: 'Whole Milk Greek Yogurt', qty: 0.35, unit: 'cups' }, { name: 'Unbleached Flour or Freshly Milled Wheat', qty: 0.35, unit: 'cups' }, { name: 'Mixed Berries (Fresh or Frozen)', qty: 0.4, unit: 'cups' }] },

    const CLEAN_SWAPS = [
      { id: 'ds_1', category: 'Laundry & Cleaning', ditch: 'Conventional Dryer Sheets & Fabric Softener', why: 'Coats clothes and bedding in synthetic quaternary ammonium compounds (quats) and fragrance phthalates that irritate sensitive skin and disrupt hormones.', swap: 'Switch to 4–6 100% Wool Dryer Balls (buy once, use forever!). They bounce between laundry to soften fabrics naturally and cut drying time by 25%.' },
      { id: 'ds_2', category: 'Kitchen & Pantry', ditch: 'Bleach & Harsh Chemical Counter Sprays', why: 'Releases harsh chlorine and ammonia fumes into indoor air where kids eat and play.', swap: 'Use a simple 50/50 White Vinegar & Water spray—or 2 cups water + 1 tbsp unscented Castile soap in a glass spray bottle for everyday counters.' },
      { id: 'ds_3', category: 'Kitchen & Pantry', ditch: 'Seed Oils (Canola, Vegetable & Soybean Oil)', why: 'Highly processed industrial seed oils extracted with chemical solvents that oxidize easily when heated.', swap: 'Cook everyday eggs, meats, and veggies in Real Salted Butter, Extra-Virgin Olive Oil, or Coconut/Avocado Oil right from your regular grocery store.' },
      { id: 'ds_4', category: 'Kitchen & Pantry', ditch: 'Plastic Food Storage Containers & Plastic Wrap', why: 'Heating or storing warm, fatty leftovers in plastic leaches BPA, BPS, and microplastics directly into family meals.', swap: 'Store leftovers in Glass Snapware Containers or wide-mouth Mason Jars (and never microwave food in plastic!).' },
      { id: 'ds_5', category: 'Around the Home', ditch: 'Scented Plug-Ins & Paraffin Wax Candles', why: 'Releases synthetic fragrance phthalates and petroleum soot directly into indoor household air.', swap: 'Make a cozy Stove Simmer Pot! Simmer orange peels, apple slices, and cinnamon sticks in a small pot of water on low (or use 100% beeswax candles).' },
      { id: 'ds_6', category: 'Laundry & Cleaning', ditch: 'Conventional Dishwasher Pods (PVA Plastic Film)', why: 'Dissolvable PVA plastic film leaves microplastic residue on dishes and contains ethoxylated surfactants.', swap: 'Whisk 1 cup Washing Soda + 1 cup Baking Soda + 1/2 cup Citric Acid + 1/2 cup Salt (use 1 tbsp per load + white vinegar as rinse aid).' },
      { id: 'ds_7', category: 'Laundry & Cleaning', ditch: 'Chemical All-Purpose Kitchen Degreasers', why: 'Contains synthetic solvents (2-butoxyethanol) that irritate lungs and skin.', swap: 'Mix 1.5 cups warm water + 2 tbsp Liquid Castile Soap + 1 tbsp Baking Soda + 15 drops Wild Orange or Lemon essential oil.' },
      { id: 'ds_8', category: 'Laundry & Cleaning', ditch: 'Blue Ammonia Glass & Mirror Cleaner', why: 'Pungent ammonia fumes irritate airways and leave synthetic blue dye streaks.', swap: 'Combine 1.5 cups distilled water + 1/2 cup white vinegar + 1 tbsp rubbing alcohol in a spray bottle for instant streak-free shine.' },
      { id: 'ds_9', category: 'Laundry & Cleaning', ditch: 'Synthetic Dish Soap (SLS, Dyes & Fragrance)', why: 'Coats plates and baby bottles in synthetic fragrance, methylisothiazolinone, and petroleum dyes.', swap: 'Switch to unscented or citrus Castile Dish Soap (or a solid Coconut-Oil Dish Soap Block with a wooden brush).' },
      { id: 'ds_10', category: 'Bath & Body', ditch: 'Petroleum & Paraben Body Lotions', why: 'Contains mineral oil, parabens, PEGs, and synthetic fragrance absorbed directly through warm skin after bathing.', swap: 'Apply pure Jojoba Oil, Raw Shea Butter, or Whipped Grass-Fed Tallow Balm to damp skin right out of the shower.' },
      { id: 'ds_11', category: 'Bath & Body', ditch: 'SLS, Triclosan & Artificial Dye Toothpaste', why: 'Sodium Lauryl Sulfate (SLS) causes canker sores, while artificial dyes and microplastics absorb through oral tissue.', swap: 'Switch to a clean Bentonite Clay, Calcium Carbonate & Peppermint mineral toothpaste (store-bought clean brand or homemade).' },
      { id: 'ds_12', category: 'Kitchen & Pantry', ditch: 'Scratching Teflon / Non-Stick Pans (PFAS)', why: 'Sheds "forever chemicals" (PFAS/PTFE) into food when heated or scratched with utensils.', swap: 'Cook in a well-seasoned Lodge Cast-Iron Skillet, Enameled Dutch Oven, or 100% Stainless Steel pan.' },
      { id: 'ds_13', category: 'Kitchen & Pantry', ditch: 'Commercial Sports Drinks (Red 40 & Sucralose)', why: 'Loaded with synthetic petroleum food dyes, high-fructose corn syrup, and artificial sweeteners.', swap: 'Mix 16 oz filtered water + squeeze of fresh lemon/orange juice + 1 tbsp raw honey + 1/4 tsp unrefined mineral sea salt.' },
      { id: 'ds_14', category: 'Kitchen & Pantry', ditch: 'Seed-Oil Store Mayonnaise', why: 'Even "Olive Oil" store mayo typically lists soybean or canola oil as the #1 ingredient.', swap: 'Blend 1 pasture egg + 1 tbsp lemon juice + 1 tsp mustard + 1 cup avocado oil with an immersion blender for 30 seconds!' },
      { id: 'ds_15', category: 'Kitchen & Pantry', ditch: 'Store-Bought Crackers with Soybean Oil & TBHQ', why: 'Made with cottonseed/soybean oil, synthetic preservative TBHQ, and enriched bleached flour.', swap: 'Bake a sheet of 3-Ingredient Butter Saltines (flour, melted butter, water, and flaky sea salt) in 12 minutes.' },
      { id: 'ds_16', category: 'Bath & Body', ditch: 'Petroleum Jelly & Synthetic VapoRub', why: 'Made from refined crude-oil petrolatum and synthetic turpentine derivatives.', swap: 'Melt 1/2 cup Grass-Fed Tallow + 2 tbsp Beeswax and stir in Eucalyptus, Peppermint & Lavender essential oils.' },
      { id: 'ds_17', category: 'Bath & Body', ditch: 'Aluminum & Paraben Antiperspirant Deodorant', why: 'Blocks sweat glands with aluminum salts right over axillary lymph nodes.', swap: 'Make gentle Tallow, Arrowroot & Magnesium Hydroxide Pit Paste scented with Lavender & Tea Tree.' },
      { id: 'ds_18', category: 'Bath & Body', ditch: 'Sulfate, Paraben & Phthalate Commercial Shampoo', why: 'Strips natural scalp barrier and exposes follicles to synthetic fragrance and DMDM hydantoin.', swap: 'Whisk Canned Full-Fat Coconut Milk, Unscented Castile Soap, Raw Honey, Jojoba Oil & Rosemary EO in a pump bottle.' },
      { id: 'ds_19', category: 'Bath & Body', ditch: 'Silicone Hair Conditioners & Detangler Sprays', why: 'Coats hair in dimethicone plastics and quaternary ammonium compounds.', swap: 'Mist hair in the shower with 2 tbsp Raw Apple Cider Vinegar + 1 cup cooled Rosemary Tea to close the cuticle for tangle-free shine.' },
      { id: 'ds_20', category: 'Bath & Body', ditch: 'Aerosol Dry Shampoo Sprays (Benzene & Butane)', why: 'Pressurized aerosol cans frequently test positive for benzene, propane, and butane propellants.', swap: 'Whisk 1/2 cup Arrowroot Powder + 1 tbsp Bentonite Clay + 1 tbsp Raw Cacao Powder + 8 drops Rosemary EO in a shaker jar.' },
      { id: 'ds_21', category: 'Bath & Body', ditch: 'Chemical Sunscreens (Oxybenzone & Avobenzone)', why: 'Chemical UV filters absorb into the bloodstream within hours and disrupt endocrine balance.', swap: 'Whip Grass-Fed Tallow, Coconut Oil, Beeswax, Red Raspberry Seed Oil & 20% Non-Nano Zinc Oxide into a physical mineral sun balm.' },
      { id: 'ds_22', category: 'Laundry & Cleaning', ditch: 'Conventional Liquid Laundry Detergent (1,4-Dioxane)', why: 'Contains optical brighteners, synthetic musks, and ethoxylated surfactants that linger in fabric fibers 24/7.', swap: 'Blend 2 cups Washing Soda + 2 cups Baking Soda + 1 cup Epsom Salt + 1/2 cup Sea Salt (or liquid Castile laundry wash).' },
      { id: 'ds_23', category: 'Laundry & Cleaning', ditch: 'Chlorine Bleach Laundry Whiteners', why: 'Weakens natural cotton/linen fibers and creates harsh chlorinated fumes in the laundry room.', swap: 'Soak whites in hot water with 1/2 cup Washing Soda + 1/2 cup 3% Hydrogen Peroxide (or Sodium Percarbonate) and dry in natural sunlight.' },
      { id: 'ds_24', category: 'Laundry & Cleaning', ditch: 'Synthetic Carpet & Rug Deodorizer Powders', why: 'Leaves toxic fragrance dust trapped in carpet fibers where babies and toddlers crawl.', swap: 'Shake 2 cups Baking Soda + 20 drops Lavender & Cedarwood EO over rugs, wait 20 minutes, and vacuum thoroughly.' },
      { id: 'ds_25', category: 'Laundry & Cleaning', ditch: 'Aerosol Wood Furniture Polish (Silicones)', why: 'Contains petroleum distillates, nitropropane, and silicone buildup that ruins heirloom wood.', swap: 'Shake 3/4 cup Olive or Jojoba Oil + 1/4 cup White Vinegar + 10 drops Wild Orange EO in a glass bottle and buff with a cloth.' },
      { id: 'ds_26', category: 'Laundry & Cleaning', ditch: 'Caustic Fume Oven Cleaners', why: 'Corrosive monoethanolamine and butane fumes bake into the oven and off-gas the next time you roast dinner.', swap: 'Spread a thick frosting of 1 cup Baking Soda + 3 tbsp Castile Soap + 2 tbsp Peroxide over the cool oven, wait 45 mins, and scrub.' },
      { id: 'ds_27', category: 'Laundry & Cleaning', ditch: 'Chemical Toilet Bowl Cleaners & Blue Tabs', why: 'Corrosive hydrochloric acid and chlorine gases corrode septic systems and irritate lungs.', swap: 'Drop in a homemade Citric Acid, Baking Soda & Tea Tree Toilet Fizz Bomb, let fizz 10 minutes, and brush clean.' },
      { id: 'ds_28', category: 'Laundry & Cleaning', ditch: 'Synthetic Fabric Refresher Sprays (Febreze)', why: 'Uses cyclodextrin and synthetic fragrance chemicals to mask odors rather than neutralizing them.', swap: 'Mist couches, curtains, and pillows with 1.5 cups distilled water + 1/2 cup Witch Hazel + 1 tsp Baking Soda + 12 drops Lavender EO.' },
      { id: 'ds_29', category: 'Bath & Body', ditch: 'Conventional Baby Diaper Creams (BHA & PEGs)', why: 'Contains petrolatum, BHA preservatives, and synthetic fragrance on delicate newborn skin.', swap: 'Melt Calendula-Infused Olive Oil + Beeswax + Non-Nano Zinc Oxide + Chamomile EO for a soothing cloth-safe barrier.' },
      { id: 'ds_30', category: 'Bath & Body', ditch: 'Petroleum & Camphor Lip Balms', why: 'Creates a synthetic seal that dries lips out further and is ingested throughout the day.', swap: 'Melt equal parts Beeswax, Grass-Fed Tallow & Cocoa Butter with a touch of Raw Honey and Peppermint EO.' },
      { id: 'ds_31', category: 'Bath & Body', ditch: 'Antibacterial Triclosan Foaming Hand Soaps', why: 'Disrupts skin microbiome, dries out hands, and contains synthetic fragrance.', swap: 'Fill a foaming pump bottle 4/5 with distilled water + 2 tbsp Liquid Castile Soap + 1 tsp Jojoba/Almond Oil + 10 drops Sweet Orange EO.' },
      { id: 'ds_32', category: 'Bath & Body', ditch: 'Synthetic Detergent Shower Bars', why: 'Most store "soap" bars are actually synthetic detergent cakes stripped of natural glycerin.', swap: 'Craft Heirloom Grass-Fed Tallow & Olive Oil Cold-Process Bar Soap from our Apothecary section.' },
      { id: 'ds_33', category: 'Kitchen & Pantry', ditch: 'Bleached, Bromated Enriched White Flour', why: 'Stripped of living wheat germ, bleached with chlorine gas, and sprayed with synthetic folic acid.', swap: 'Bake with Long-Fermented Sourdough or unbleached organic whole-grain flours.' },
      { id: 'ds_34', category: 'Kitchen & Pantry', ditch: 'Store Bouillon Cubes (MSG, Corn Syrup & Yellow 5)', why: 'Packed with monosodium glutamate, hydrolyzed soy protein, palm oil, and artificial yellow dyes.', swap: 'Simmer leftover roast bones with a splash of apple cider vinegar for 18–24 hours into gelatin-rich homemade Bone Broth.' },
      { id: 'ds_35', category: 'Kitchen & Pantry', ditch: 'Bleached White Table Salt (Anti-Caking Agents)', why: 'Heated to 1,200°F, stripped of 80+ trace minerals, and treated with sodium ferrocyanide.', swap: 'Season every meal and electrolyte drink with Unrefined Pink Mineral Salt or Celtic Grey Sea Salt.' },
      { id: 'ds_36', category: 'Bath & Body', ditch: 'Red-Dye & High-Fructose Nighttime Cough Syrups', why: 'Contains Red 40, Blue 1, propylene glycol, and refined corn syrup right when the immune system is working hardest.', swap: 'Layer sliced Red Onion and Raw Local Honey in a Mason jar (or keep homemade Elderberry & Thyme Syrup in the fridge).' }
    ];

    const CLEANING_RECIPES = [
      { id: 'cln_1', title: 'Everyday Castile All-Purpose Counter Spray', category: 'Kitchen & Counters', formula: 'In a 16 oz glass spray bottle, combine 2 cups distilled water + 1 tbsp unscented Liquid Castile Soap. Shake gently before each use and wipe with a damp microfiber cloth. Optional Essential Oil Add-In: 15 drops Wild Orange + 5 drops Clove or Protective Blend for grease-cutting and warm spice aroma.' },
      { id: 'cln_2', title: 'Heavy-Duty Stovetop & Range Hood Degreaser', category: 'Kitchen & Counters', formula: 'In a 16 oz spray bottle, mix 1.5 cups warm distilled water + 2 tbsp Liquid Castile Soap + 1 tbsp Baking Soda (dissolved first). Spray onto greasy range hoods, stove grates, and air fryer baskets; let sit 3 minutes and wipe clean. Optional Essential Oil Add-In: 15 drops Lemon + 5 drops Cleansing Blend.' },
      { id: 'cln_3', title: 'Zero-Plastic Automatic Dishwasher Powder', category: 'Kitchen & Counters', formula: 'Whisk together 1 cup Washing Soda + 1 cup Baking Soda + 1/2 cup Food-Grade Citric Acid + 1/2 cup Coarse Sea Salt. Store in an airtight mason jar. Use 1 tbsp per load. Optional Essential Oil Add-In: Whisk in 20–25 drops Lemon or Grapefruit EO.' },
      { id: 'cln_4', title: 'Sparkling Dishwasher Rinse-Aid & Hard Water Eraser', category: 'Kitchen & Counters', formula: 'Pour straight white distilled vinegar into your dishwasher’s rinse-aid compartment (or place a small dishwasher-safe mug with 1/2 cup white vinegar on the top rack) to prevent cloudy mineral film on glassware.' },
      { id: 'cln_5', title: 'Baked-On Oven & Glass Door Scrubbing Frosting', category: 'Kitchen & Counters', formula: 'Stir 1 cup Baking Soda + 3 tbsp Liquid Castile Soap + 2 tbsp water (or 3% hydrogen peroxide) into a thick spreadable paste. Coat cool oven floor and glass door, let sit 30–60 minutes, scrub with a non-scratch sponge, and wipe clean with warm vinegar water.' },
      { id: 'cln_6', title: 'Refrigerator, Freezer & Cooler Interior Refresh Mist', category: 'Kitchen & Counters', formula: 'Combine 1 cup distilled water + 1/2 cup white vinegar in a glass spray bottle. Mist fridge shelves, produce drawers, and rubber door seals, then wipe dry. Optional Essential Oil Add-In: 10 drops Lemon + 5 drops Vanilla or Bergamot.' },
      { id: 'cln_7', title: 'Fruit & Veggie Farm-Stand Produce Soak', category: 'Kitchen & Counters', formula: 'Fill a clean sink or large bowl with cold water + 1/2 cup white vinegar + 1 tbsp sea salt (or baking soda). Soak berries, apples, and leafy greens for 5 minutes to lift wax and field dirt, then rinse and spin dry.' },
      { id: 'cln_8', title: 'Stainless Steel Fridge & Appliance Shine', category: 'Kitchen & Counters', formula: 'First wipe fingerprints away with a cloth dampened with white vinegar. Then put 3–4 drops of olive oil or fractionated coconut oil on a dry microfiber cloth and buff in the direction of the metal grain.' },
      { id: 'cln_9', title: 'Garbage Disposal & Sink Drain Citrus Fizz Cubes', category: 'Kitchen & Counters', formula: 'Mix 1 cup Baking Soda + 1/2 cup Citric Acid + 1 tbsp Liquid Castile Soap + 20 drops Lemon or Wild Orange EO. Pack tightly into silicone ice cube trays and dry overnight. Toss 1 cube down the disposal with warm water.' },
      { id: 'cln_10', title: 'Butcher Block & Wooden Cutting Board Conditioning Butter', category: 'Kitchen & Counters', formula: 'In a double boiler, melt 2 tbsp Beeswax Pellets + 3/4 cup Fractionated Coconut Oil (or beef tallow). Pour into a wide-mouth jar to solidify. Buff a quarter-sized amount into dry wood boards monthly.' },
      { id: 'cln_11', title: 'Cast-Iron Skillet Coarse Salt & Tallow Ritual', category: 'Kitchen & Counters', formula: 'While skillet is still warm, pour in 2 tbsp coarse kosher salt and scrub stuck bits with a wooden scraper and hot water. Dry on stove over low heat for 2 minutes, then rub 1 tsp grass-fed Beef Tallow inside.' },
      { id: 'cln_12', title: 'Foaming Castile Hand Soap Refill (Every Sink)', category: 'Bathrooms & Sinks', formula: 'Fill a foaming soap pump bottle 4/5 full with distilled water + 2 tbsp unscented Liquid Castile Soap + 1 tsp sweet almond or jojoba oil + 10 drops Lavender or Wild Orange EO.' },
      { id: 'cln_13', title: 'Tub, Tile & Porcelain Soft-Scrub Cream', category: 'Bathrooms & Sinks', formula: 'Whisk 1 cup Baking Soda + 1/3 cup Liquid Castile Soap + 1 tbsp 3% Hydrogen Peroxide + 1 tbsp vegetable glycerin + 10 drops Tea Tree & Eucalyptus EO. Scrub soap scum off tubs and sinks, then rinse.' },
      { id: 'cln_14', title: 'Citric Acid & Baking Soda Toilet Fizz Bombs', category: 'Bathrooms & Sinks', formula: 'Whisk 1 cup Baking Soda + 1/2 cup Citric Acid + 15 drops Tea Tree & Peppermint EO. Mist lightly with witch hazel until it holds like wet sand, press into molds, dry 12 hours, and drop 1 bomb into the toilet bowl.' },
      { id: 'cln_15', title: 'Streak-Free Vinegar & Alcohol Mirror/Glass Mist', category: 'Bathrooms & Windows', formula: 'In a 16 oz glass spray bottle, combine 1.5 cups distilled water + 1/2 cup white vinegar + 1 tbsp rubbing alcohol (70% isopropyl evaporates instantly with zero streaks).' },
      { id: 'cln_16', title: 'Daily After-Shower Tile & Grout Prevention Mist', category: 'Bathrooms & Sinks', formula: 'Mix 1.5 cups distilled water + 1/2 cup white vinegar + 10 drops Tea Tree + 5 drops Clove + 5 drops Rosemary EO. Mist shower tile and glass doors after the last shower of the day.' },
      { id: 'cln_17', title: 'Deep Grout & Caulk Whitening Paste', category: 'Bathrooms & Sinks', formula: 'Mix 1/2 cup Baking Soda + 1/4 cup 3% Hydrogen Peroxide + 1 tsp Liquid Castile Soap into a paste. Brush onto tile grout lines, wait 10 minutes, scrub briefly, and rinse.' },
      { id: 'cln_18', title: 'Showerhead & Faucet Hard-Water Descaler Soak', category: 'Bathrooms & Sinks', formula: 'Fill a heavy zip-top bag or jar with 1 cup warm white vinegar + 1 tbsp Citric Acid. Submerge the showerhead for 1 hour, then wipe mineral deposits away.' },
      { id: 'cln_19', title: 'Non-Toxic Powdered Family Laundry Detergent', category: 'Laundry Room', formula: 'In a large glass jar, combine 2 cups Washing Soda + 2 cups Baking Soda + 1 cup Epsom Salt + 1/2 cup Unrefined Sea Salt + 30 drops Lavender or Lemon EO. Use 1–2 tbsp per load directly in the drum.' },
      { id: 'cln_20', title: 'Concentrated Liquid Castile Laundry Wash', category: 'Laundry Room', formula: 'Dissolve 1/4 cup Washing Soda + 1/4 cup Baking Soda in 2 cups boiling water inside a half-gallon jar. Add 1 cup unscented Liquid Castile Soap and top off with warm water. Use 1/4 cup per load.' },
      { id: 'cln_21', title: 'Miracle Peroxide & Castile Stain-Treater Spray', category: 'Laundry Room', formula: 'In an amber 16 oz spray bottle, gently mix 1 cup 3% Hydrogen Peroxide + 1/4 cup Liquid Castile Soap + 1 tbsp Baking Soda + 1/2 cup warm water. Spray grass, berry, mud, or food stains, wait 15 mins, and wash.' },
      { id: 'cln_22', title: 'White Vinegar Fabric Softener & Wool Dryer Ball Boost', category: 'Laundry Room', formula: 'Pour 1/3 cup white distilled vinegar into the fabric softener compartment to strip soap residue. Toss 4–6 wool dryer balls into the dryer with 4 drops Lavender or Wild Orange EO.' },
      { id: 'cln_23', title: 'Oxygen Whitening & Dingy Towel Brightener Soak', category: 'Laundry Room', formula: 'Dissolve 1/2 cup Washing Soda + 1/2 cup 3% Hydrogen Peroxide (or Sodium Percarbonate) in hot water. Soak white sheets or kitchen towels for 1–2 hours before washing.' },
      { id: 'cln_24', title: 'Washing Machine Drum & Rubber Gasket Detox Flush', category: 'Laundry Room', formula: 'Monthly: Spray the rubber door seal with vinegar, wipe out trapped lint, sprinkle 1/2 cup Baking Soda into the empty drum, pour 2 cups White Vinegar into the detergent tray, and run the hottest clean cycle.' },
      { id: 'cln_25', title: 'Heirloom Wood Table & Furniture Conditioning Polish', category: 'Dining & Living Room', formula: 'In an 8 oz glass bottle, combine 3/4 cup Olive or Jojoba Oil + 1/4 cup White Vinegar + 10 drops Wild Orange & Cedarwood EO. Shake vigorously and buff a small amount onto wood tables.' },
      { id: 'cln_26', title: 'Weekly Dust-Repelling Wood & Baseboard Mist', category: 'Dining & Living Room', formula: 'In a 16 oz spray bottle, combine 1.75 cups distilled water + 2 tbsp white vinegar + 1 tbsp olive/jojoba oil + 1/2 tsp Liquid Castile Soap. Mist onto a microfiber cloth to trap dust on bookshelves and blinds.' },
      { id: 'cln_27', title: 'Couch, Curtain & Upholstery Fabric Refresher Spray', category: 'Dining & Living Room', formula: 'In a fine-mist glass bottle, mix 1.5 cups distilled water + 1/2 cup Witch Hazel + 1 tsp Baking Soda + 12 drops Lavender & Wild Orange EO. Mist lightly over sofa cushions and drapes.' },
      { id: 'cln_28', title: 'Carpet & Area Rug Deep Deodorizing Shaker', category: 'Dining & Living Room', formula: 'Fill a 16 oz mason jar with 2 cups Baking Soda + 20 drops Lavender or Cedarwood EO. Sprinkle evenly over living room rugs, let sit 20–30 minutes, then vacuum thoroughly.' },
      { id: 'cln_29', title: 'Leather Couch, Chair & Boot Nourishing Balm', category: 'Dining & Living Room', formula: 'Gently melt 1/4 cup Grass-Fed Beef Tallow (or Beeswax) + 1/4 cup Sweet Almond or Olive Oil. Let cool into a soft balm, rub a thin layer onto clean leather sofas or boots, and buff dry.' },
      { id: 'cln_30', title: 'Sweet Dreams Pillow, Linen & Curtain Mist', category: 'Bedrooms & Nursery', formula: 'In an 8 oz amber mist bottle, combine 3/4 cup distilled water + 2 tbsp Witch Hazel + 10 drops Lavender + 5 drops Cedarwood + 4 drops Roman Chamomile EO.' },
      { id: 'cln_31', title: 'Quarterly Mattress Sanitizing & Dust-Mite Shaker', category: 'Bedrooms & Nursery', formula: 'When stripping sheets, sift 1 cup Baking Soda + 8 drops Eucalyptus & Lavender EO across the bare mattress surface. Let sit 1 hour in natural sunlight, then vacuum seams thoroughly.' },

    function generateDefaultRoomTasksArray(roomsList) {
      const tasks = [];
      const seen = new Set();
      (roomsList || DEFAULT_ROOMS_PROFILE).forEach(r => {
        const tpl = ROOM_SMART_TEMPLATES[r.type] || ROOM_SMART_TEMPLATES['Living Room'];
        ['daily', 'weekly', 'monthly', 'yearly'].forEach(tier => {
          (tpl[tier] || []).forEach(txt => {
            const key = `${tier}|${r.name}|${txt}`;
            if (!seen.has(key)) {
              seen.add(key);
              tasks.push({
                id: 'rt_' + Math.random().toString(36).substring(2, 9),
                tier,
                roomName: r.name,
                roomCount: r.count || 1,
                weeklyDay: r.weeklyDay || 'Monday',
                text: txt,
                done: false
              });
            }
          });
        });
      });
      return tasks;
    }

      return jsDays[new Date().getDay()];

    function getTomorrowWeekdayName(dayName) {
      const idx = WEEKDAY_ORDER.indexOf(dayName);
      if (idx === -1) return 'Tuesday';
      return WEEKDAY_ORDER[(idx + 1) % WEEKDAY_ORDER.length];
    }

    function formatScaledQty(val) {
      const rounded = Math.round(val * 100) / 100;
      return Number.isInteger(rounded) ? String(rounded) : String(rounded);
    }

    function categorizeIngredient(name) {
      const lower = name.toLowerCase();
      if (/crushed tomato|broth|olive oil|honey|maple|flour|wheat|oat|pasta|bread|peanut butter|cacao|pecan|collagen|chili|salt|coconut water|spice/.test(lower)) {
        return 'Pantry & Staples';
      }
      if (/beef|bison|chicken|turkey|sausage|bacon|steak|roast|salmon|lamb|pork/.test(lower)) {
        return 'Meats & Seafood';
      }
      if (/milk|egg|cheese|cheddar|mozzarella|parmesan|yogurt|butter|cream/.test(lower)) {
        return 'Dairy & Eggs';
      }
      if (/berr|banana|mango|pineapple|peach|cherr|apple|spinach|lemon|lime|avocado|pumpkin|orange|pepper|potato|tomato|grape|cucumber|carrot|pea|zucchini|cabbage|broccoli|onion|garlic/.test(lower)) {
        return 'Fruits & Produce';
      }
      return 'Pantry & Staples';
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function buildPrintableGroceryHtml({
      printDate,
      totalMultiplier,
      plannedDinners,
      groceryData,
      checkedGroceryKeys,
      hideCheckedGrocery
    }) {
      const aisleSections = groceryData.aisleOrder
        .map(aisle => {
          const items = (groceryData.grouped[aisle] || []).filter(item =>
            hideCheckedGrocery ? !checkedGroceryKeys[item.key] : true
          );
          if (items.length === 0) return '';

          const listMarkup = items
            .map(item => {
              const isChecked = !!checkedGroceryKeys[item.key];
              const qtyText =
                item.qty !== null
                  ? ` <span class="qty">&mdash; ${escapeHtml(formatScaledQty(item.qty))} ${escapeHtml(item.unit)}</span>`
                  : '';
              return `
                <li class="${isChecked ? 'checked' : ''}">
                  <span class="box">${isChecked ? '&#10003;' : ''}</span>
                  <span><strong>${escapeHtml(item.name)}</strong>${qtyText}</span>
                </li>
              `;
            })
            .join('');

          return `
            <section class="aisle-card">
              <h2>${escapeHtml(aisle)}</h2>
              <ul>${listMarkup}</ul>
            </section>
          `;
        })
        .filter(Boolean)
        .join('');

      const dinnersBlock =
        plannedDinners.length > 0
          ? `<div class="dinners-banner"><div class="dinners-label">This Week&apos;s Planned Dinners</div><p>${plannedDinners.map(escapeHtml).join(' &nbsp;&bull;&nbsp; ')}</p></div>`

    .print-btn { background: #798771; color: #fff; border: none; border-radius: 999px; padding: 10px 22px; font-family: 'Lora', serif; font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; }
