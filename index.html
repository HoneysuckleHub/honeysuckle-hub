                      Member Log In
                    </button>
                  </div>

                  <h2 className="font-playfair text-2xl font-bold mb-1 text-[#4a4238]">
                    {mode === 'signup' ? 'Create Your Free Account' : mode === 'login' ? 'Welcome Back' : 'Reset Your Password'}
                  </h2>
                  <p className="font-lora text-xs text-[#4a4238]/65 mb-6">
                    {mode === 'signup'
                      ? 'Save your meal plans, grocery lists, and home rhythms across all your devices.'
                      : mode === 'login'
                      ? 'Log in with your existing Honeysuckle Hub email and password.'
                      : 'Enter your email and we will send you a password reset link.'}
                  </p>

                  {errorMsg && (
                    <div className="mb-4 p-3 rounded-xl bg-red-50 border border-red-200 font-lora text-xs text-red-800">
                      {errorMsg}
                    </div>
                  )}
                  {infoMsg && (
                    <div className="mb-4 p-3 rounded-xl bg-[#798771]/10 border border-[#798771]/25 font-lora text-xs text-[#4a4238]">
                      {infoMsg}
                    </div>
                  )}

                  <form onSubmit={handleSubmit} className="space-y-4 font-lora text-left">
                    {mode === 'signup' && (
                      <div>
                        <label className="block text-xs font-bold uppercase tracking-wider text-[#798771] mb-1.5">
                          Household Name (Optional)
                        </label>
                        <input
                          type="text"
                          value={householdName}
                          onChange={e => setHouseholdName(e.target.value)}
                          className="w-full bg-[#fdfbf7] border border-[#4a4238]/20 rounded-xl px-4 py-3 text-sm text-[#4a4238] focus:outline-none focus:border-[#798771]"
                          placeholder="e.g., The Miller Home"
                        />
                      </div>
                    )}

                    <div>
                      <label className="block text-xs font-bold uppercase tracking-wider text-[#798771] mb-1.5">
                        Email Address
                      </label>
                      <input
                        type="email"
                        required
                        value={email}
                        onChange={e => setEmail(e.target.value)}
                        className="w-full bg-[#fdfbf7] border border-[#4a4238]/20 rounded-xl px-4 py-3 text-sm text-[#4a4238] focus:outline-none focus:border-[#798771]"
                        placeholder="you@example.com"
                      />
                    </div>

                    {mode !== 'reset' && (
                      <div>
                        <label className="block text-xs font-bold uppercase tracking-wider text-[#798771] mb-1.5">
                          Password
                        </label>
                        <input
                          type="password"
                          required
                          minLength={6}
                          value={password}
                          onChange={e => setPassword(e.target.value)}
                          className="w-full bg-[#fdfbf7] border border-[#4a4238]/20 rounded-xl px-4 py-3 text-sm text-[#4a4238] focus:outline-none focus:border-[#798771]"
                          placeholder="••••••••"
                        />
                      </div>
                    )}

                    <button
                      type="submit"
                      disabled={loading}
                      className="w-full bg-[#798771] text-white py-3.5 rounded-xl font-bold uppercase tracking-wider text-xs hover:bg-[#6b7764] transition-colors mt-2 disabled:opacity-50"
                    >
                      {loading
                        ? 'Please wait...'
                        : mode === 'signup'
                        ? 'Sign Up for Free'
                        : mode === 'login'
                        ? 'Log In to My Hub'
                        : 'Send Reset Link'}
                    </button>
                  </form>

                  <div className="mt-5 pt-5 border-t border-[#4a4238]/10 text-center font-lora text-xs space-y-2">
                    {mode === 'login' && (
                      <button
                        type="button"
                        onClick={() => { setMode('reset'); setErrorMsg(''); setInfoMsg(''); }}
                        className="text-[#4a4238]/60 hover:text-[#798771] underline block mx-auto"
                      >
                        Forgot your password?
                      </button>
                    )}
                    {mode === 'reset' && (
                      <button
                        type="button"
                        onClick={() => { setMode('login'); setErrorMsg(''); setInfoMsg(''); }}
                        className="text-[#798771] font-bold hover:underline"
                      >
                        Back to Member Log In
                      </button>
                    )}
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // MAIN APPLICATION
    // =========================================================================
    function App() {
      const [authChecked, setAuthChecked] = useState(false);
      const [currentUser, setCurrentUser] = useState(null);
      const [householdName, setHouseholdName] = useState('Member Household');
      const [syncStatus, setSyncStatus] = useState('idle'); // 'loading' | 'saving' | 'synced' | 'local'

      // Cloud sync refs (prevents overwriting cloud data before load finishes & preserves legacy keys)
      const cloudReadyRef = useRef(false);
      const rawCloudStateRef = useRef({});
      const syncTimerRef = useRef(null);

      const [activeTab, setActiveTab] = useState('home');

      // Roster State
      const [adults, setAdults] = useState(2);
      const [kids, setKids] = useState(4);
      const [toddlers, setToddlers] = useState(1);
      const [babies, setBabies] = useState(1);

      // Kitchen State
      const [includeBreakfast, setIncludeBreakfast] = useState(false);
      const [includeLunch, setIncludeLunch] = useState(false);
      const [weeklyPlan, setWeeklyPlan] = useState(DEFAULT_WEEKLY_PLAN);

      // Modal & Filter States
      const [selectedRecipe, setSelectedRecipe] = useState(null);
      const [activeFilter, setActiveFilter] = useState('All');
      const [swapsView, setSwapsView] = useState('guide');
      const [activeSwapsFilter, setActiveSwapsFilter] = useState('All');
      const [activeCleanersFilter, setActiveCleanersFilter] = useState('All');
      const [activeApothFilter, setActiveApothFilter] = useState('All');

      // Room Auto-Pilot State
      const [myRooms, setMyRooms] = useState(DEFAULT_ROOMS_PROFILE);
      const [roomTasks, setRoomTasks] = useState(() => generateDefaultRoomTasksArray(DEFAULT_ROOMS_PROFILE));
      const [activeTaskTier, setActiveTaskTier] = useState('daily');
      const [editingRoom, setEditingRoom] = useState(null);
      const [isRoomModalOpen, setIsRoomModalOpen] = useState(false);

      // Command Center (Home) State
      const [homeDay, setHomeDay] = useState(getTodayWeekdayName());
      const [checkedHomeMeals, setCheckedHomeMeals] = useState({});
      const [dailyPriorities, setDailyPriorities] = useState(DEFAULT_PRIORITIES);

      // Grocery List State
      const [checkedGroceryKeys, setCheckedGroceryKeys] = useState({});
      const [hideCheckedGrocery, setHideCheckedGrocery] = useState(false);
      const [customGroceryItems, setCustomGroceryItems] = useState([]);
      const [isPrintModalOpen, setIsPrintModalOpen] = useState(false);
      const [copiedList, setCopiedList] = useState(false);
      const [printNotice, setPrintNotice] = useState('');

      // -----------------------------------------------------------------------
      // 1. SUPABASE AUTH SESSION LISTENER
      // -----------------------------------------------------------------------
      useEffect(() => {
        let mounted = true;

        supabaseClient.auth.getSession().then(({ data }) => {
          if (!mounted) return;
          setCurrentUser(data?.session?.user || null);
          setAuthChecked(true);
        });

        const { data: { subscription } } = supabaseClient.auth.onAuthStateChange((_event, session) => {
          if (!mounted) return;
          setCurrentUser(session?.user || null);
          setAuthChecked(true);
        });

        return () => {
          mounted = false;
          subscription?.unsubscribe();
        };
      }, []);

      // -----------------------------------------------------------------------
      // 2. LOAD MEMBER DATA FROM SUPABASE (AND LOCAL STORAGE FALLBACK)
      // -----------------------------------------------------------------------
      useEffect(() => {
        if (!currentUser) {
          cloudReadyRef.current = false;
          rawCloudStateRef.current = {};
          return;
        }

        let cancelled = false;
        cloudReadyRef.current = false;
        setSyncStatus('loading');

        const applySavedV2 = (v2, fallbackRooms, fallbackTasks) => {
          if (v2 && typeof v2 === 'object') {
            if (typeof v2.adults === 'number') setAdults(v2.adults);
            if (typeof v2.kids === 'number') setKids(v2.kids);
            if (typeof v2.toddlers === 'number') setToddlers(v2.toddlers);
            if (typeof v2.babies === 'number') setBabies(v2.babies);
            if (typeof v2.includeBreakfast === 'boolean') setIncludeBreakfast(v2.includeBreakfast);
            if (typeof v2.includeLunch === 'boolean') setIncludeLunch(v2.includeLunch);
            if (v2.weeklyPlan && typeof v2.weeklyPlan === 'object') setWeeklyPlan(v2.weeklyPlan);
            if (Array.isArray(v2.myRooms)) setMyRooms(v2.myRooms);
            if (Array.isArray(v2.roomTasks)) setRoomTasks(v2.roomTasks);
            if (v2.checkedHomeMeals && typeof v2.checkedHomeMeals === 'object') setCheckedHomeMeals(v2.checkedHomeMeals);
            if (Array.isArray(v2.dailyPriorities)) setDailyPriorities(v2.dailyPriorities);
            if (v2.checkedGroceryKeys && typeof v2.checkedGroceryKeys === 'object') setCheckedGroceryKeys(v2.checkedGroceryKeys);
            if (typeof v2.hideCheckedGrocery === 'boolean') setHideCheckedGrocery(v2.hideCheckedGrocery);
            if (Array.isArray(v2.customGroceryItems)) setCustomGroceryItems(v2.customGroceryItems);
          } else {
            // Carry over rooms & room tasks from legacy Honeysuckle Hub accounts if present
            if (Array.isArray(fallbackRooms) && fallbackRooms.length > 0) setMyRooms(fallbackRooms);
            if (Array.isArray(fallbackTasks) && fallbackTasks.length > 0) setRoomTasks(fallbackTasks);
          }
        };

        async function loadMemberData() {
          const localCacheKey = `hh_v2_${currentUser.id}`;
          const metaName = currentUser.user_metadata?.household_name;
          if (metaName) setHouseholdName(metaName);

          // Load fast local cache first if available
          try {
            const localRaw = localStorage.getItem(localCacheKey);
            if (localRaw) {
              applySavedV2(JSON.parse(localRaw));
            }
          } catch (e) {}

          try {
            // Multi-row safe lookup matching your existing Supabase schema
            const { data: rows, error } = await supabaseClient
              .from('household_planners')
              .select('state, household_name, updated_at')
              .eq('user_id', currentUser.id)
              .order('updated_at', { ascending: false })
              .limit(1);

            if (cancelled) return;

            const row = (!error && Array.isArray(rows) && rows.length > 0) ? rows[0] : null;
            if (row) {
              if (row.household_name) setHouseholdName(row.household_name);
              const cloudState = (row.state && typeof row.state === 'object') ? row.state : {};
              rawCloudStateRef.current = cloudState;

              const v2 = cloudState.honeysuckleV2 || null;
              const legacyRooms = cloudState.home_rooms_profile || cloudState.roomsProfile || null;
              const legacyTasks = cloudState.home_room_tasks || cloudState.roomTasks || null;

              applySavedV2(v2, legacyRooms, legacyTasks);
            }
            setSyncStatus('synced');
          } catch (err) {
            if (!cancelled) setSyncStatus('local');
          } finally {
            if (!cancelled) {
              // Small delay so initial state hydration finishes before auto-save unlocks
              setTimeout(() => {
                cloudReadyRef.current = true;
              }, 200);
            }
          }
        }

        loadMemberData();

        return () => {
          cancelled = true;
        };
      }, [currentUser]);

      // -----------------------------------------------------------------------
      // 3. AUTO-SAVE EVERYTHING TO LOCALSTORAGE + SUPABASE ON ANY CHANGE
      // -----------------------------------------------------------------------
      useEffect(() => {
        if (!currentUser || !cloudReadyRef.current) return;

        const v2State = {
          adults,
          kids,
          toddlers,
          babies,
          includeBreakfast,
          includeLunch,
          weeklyPlan,
          myRooms,
          roomTasks,
          checkedHomeMeals,
          dailyPriorities,
          checkedGroceryKeys,
          hideCheckedGrocery,
          customGroceryItems,
          lastSavedAt: new Date().toISOString()
        };

        // Instant local save
        try {
          localStorage.setItem(`hh_v2_${currentUser.id}`, JSON.stringify(v2State));
        } catch (e) {}

        // Debounced Supabase cloud save
        setSyncStatus('saving');
        clearTimeout(syncTimerRef.current);
        syncTimerRef.current = setTimeout(async () => {
          const mergedState = {
            ...(rawCloudStateRef.current || {}),
            honeysuckleV2: v2State,
            home_rooms_profile: myRooms,
            home_room_tasks: roomTasks,
            roomsProfile: myRooms,
            roomTasks: roomTasks
          };
          rawCloudStateRef.current = mergedState;

          const basePayload = {
            user_id: currentUser.id,
            household_name: householdName || 'Member Household',
            state: mergedState,
            updated_at: new Date().toISOString()
          };

          try {
            const { error } = await supabaseClient
              .from('household_planners')
              .upsert(basePayload, { onConflict: 'user_id' });

            if (error) throw error;
            setSyncStatus('synced');
          } catch (err) {
            // Fallback matching your existing Block 2 if unique constraint isn't set
            try {
              const { data: existingRows } = await supabaseClient
                .from('household_planners')
                .select('user_id')
                .eq('user_id', currentUser.id)
                .limit(1);

              if (Array.isArray(existingRows) && existingRows.length > 0) {
                await supabaseClient
                  .from('household_planners')
                  .update(basePayload)
                  .eq('user_id', currentUser.id);
              } else {
                await supabaseClient
                  .from('household_planners')
                  .insert([basePayload]);
              }
              setSyncStatus('synced');
            } catch (e2) {
              setSyncStatus('local');
            }
          }
        }, 500);

        return () => clearTimeout(syncTimerRef.current);
      }, [
        currentUser,
        householdName,
        adults,
        kids,
        toddlers,
        babies,
        includeBreakfast,
        includeLunch,
        weeklyPlan,
        myRooms,
        roomTasks,
        checkedHomeMeals,
        dailyPriorities,
        checkedGroceryKeys,
        hideCheckedGrocery,
        customGroceryItems
      ]);

      const handleSignOut = async () => {
        cloudReadyRef.current = false;
        await supabaseClient.auth.signOut();
        setCurrentUser(null);
      };

      // Compute Total Multiplier
      const totalMultiplier = (adults * 1.0) + (kids * 0.65) + (toddlers * 0.5) + (babies * 0);

      const TABS = [
        { id: 'home', label: "Today's Hub" },
        { id: 'kitchen', label: 'Scratch Kitchen' },
        { id: 'vault', label: 'Recipe Vault' },
        { id: 'apothecary', label: 'Apothecary' },
        { id: 'swaps', label: 'Clean Swaps' },
        { id: 'room', label: 'Room Auto-Pilot' }
      ];

      const updateMeal = (day, mealType, recipeId) => {
        setWeeklyPlan(prev => ({
          ...prev,
          [day]: { ...prev[day], [mealType]: recipeId || null }
        }));
      };

      const getRecipe = (id) => RECIPE_VAULT.find(r => r.id === id);

      const groceryData = useMemo(() => {
        const aisleOrder = ['Meats & Seafood', 'Dairy & Eggs', 'Fruits & Produce', 'Pantry & Staples', 'Custom Extras'];
        const map = {};

        WEEKDAY_ORDER.forEach(day => {
          const plan = weeklyPlan[day];
          if (!plan) return;
          const mealIds = [];
          if (includeBreakfast && plan.breakfast) mealIds.push(plan.breakfast);
          if (includeLunch && plan.lunch) mealIds.push(plan.lunch);
          if (plan.dinner) mealIds.push(plan.dinner);

          mealIds.forEach(rId => {
            const recipe = RECIPE_VAULT.find(r => r.id === rId);
            if (!recipe) return;
            recipe.ingredients.forEach(ing => {
              const normUnit = (ing.unit || '').trim().toLowerCase();
              const key = `${ing.name.toLowerCase()}__${normUnit}`;
              if (!map[key]) {
                map[key] = {
                  key,
                  name: ing.name,
                  qty: 0,
                  unit: ing.unit,
                  category: categorizeIngredient(ing.name),
                  isCustom: false
                };
              }
              map[key].qty += ing.qty * totalMultiplier;
            });
          });
        });

        const grouped = {};
        aisleOrder.forEach(a => { grouped[a] = []; });

        Object.values(map)
          .sort((a, b) => a.name.localeCompare(b.name))
          .forEach(item => {
            if (!grouped[item.category]) grouped[item.category] = [];
            grouped[item.category].push(item);
          });

        customGroceryItems.forEach(ci => {
          grouped['Custom Extras'].push({
            key: ci.id,
            id: ci.id,
            name: ci.name,
            qty: null,
            unit: '',
            category: 'Custom Extras',
            isCustom: true
          });
        });

        const flatItems = aisleOrder.flatMap(a => grouped[a]);
        return { aisleOrder, grouped, flatItems };
      }, [weeklyPlan, includeBreakfast, includeLunch, totalMultiplier, customGroceryItems]);

      const toggleGroceryItem = (key) => {
        setCheckedGroceryKeys(prev => ({ ...prev, [key]: !prev[key] }));
      };

      const addCustomGroceryItem = (name) => {
        setCustomGroceryItems(prev => [
          ...prev,
          { id: 'cust_' + Math.random().toString(36).substring(2, 9), name }
        ]);
      };

      const deleteCustomGroceryItem = (id) => {
        setCustomGroceryItems(prev => prev.filter(item => item.id !== id));
        setCheckedGroceryKeys(prev => {
          const next = { ...prev };
          delete next[id];
          return next;
        });
      };

      const resetGroceryChecks = () => setCheckedGroceryKeys({});

      const getGroceryExportContext = () => {
        const printDate = new Date().toLocaleDateString('en-US', {
          weekday: 'long',
          month: 'long',
          day: 'numeric',
          year: 'numeric'
        });
        const plannedDinners = WEEKDAY_ORDER
          .map(day => {
            const dId = weeklyPlan[day]?.dinner;
            const r = dId ? getRecipe(dId) : null;
            return r ? `${day}: ${r.name}` : null;
          })
          .filter(Boolean);

        return { printDate, plannedDinners };
      };

      const handlePrintGroceryList = () => {
        setPrintNotice('');
        setCopiedList(false);
        setIsPrintModalOpen(true);
      };

      const triggerBrowserPrint = () => {
        const { printDate, plannedDinners } = getGroceryExportContext();
        const htmlDoc = buildPrintableGroceryHtml({
          printDate,
          totalMultiplier,
          plannedDinners,
          groceryData,
          checkedGroceryKeys,
          hideCheckedGrocery
        });

        try {
          const printWin = window.open('', '_blank', 'width=900,height=700');
          if (printWin) {
            printWin.document.open();
            printWin.document.write(htmlDoc);
            printWin.document.close();
            printWin.focus();
            setTimeout(() => {
              try { printWin.print(); } catch {}
            }, 350);
            setPrintNotice('Print sheet opened in a new window.');
            return;
          }
        } catch {}

        try {
          window.print();
          setPrintNotice('Print dialog triggered. You can also download the printable sheet below.');
        } catch {
          setPrintNotice('Use "Download Printable Sheet" to open and print cleanly.');
        }
      };

      const downloadPrintableGrocerySheet = () => {
        const { printDate, plannedDinners } = getGroceryExportContext();
        const htmlDoc = buildPrintableGroceryHtml({
          printDate,
          totalMultiplier,
          plannedDinners,
          groceryData,
          checkedGroceryKeys,
          hideCheckedGrocery
        });
        const blob = new Blob([htmlDoc], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'Honeysuckle-Grocery-List.html';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        setPrintNotice('Downloaded Honeysuckle-Grocery-List.html — open it in your browser to print.');
      };

      const copyGroceryListText = async () => {
        const { printDate } = getGroceryExportContext();
        const lines = [
          'HONEYSUCKLE & CO. — WEEKLY GROCERY LIST',
          `${printDate} | Scaled for ${totalMultiplier.toFixed(1)} Adult Portions`,
          ''
        ];
        groceryData.aisleOrder.forEach(aisle => {
          const items = (groceryData.grouped[aisle] || []).filter(item =>
            hideCheckedGrocery ? !checkedGroceryKeys[item.key] : true
          );
          if (items.length === 0) return;
          lines.push(aisle.toUpperCase());
          items.forEach(item => {
            const mark = checkedGroceryKeys[item.key] ? '[x]' : '[ ]';
            const qtyStr = item.qty !== null ? ` — ${formatScaledQty(item.qty)} ${item.unit}` : '';
            lines.push(`${mark} ${item.name}${qtyStr}`);
          });
          lines.push('');
        });
        try {
          await navigator.clipboard.writeText(lines.join('\n').trim());
          setCopiedList(true);
          setPrintNotice('Grocery checklist copied to your clipboard.');
          setTimeout(() => setCopiedList(false), 2500);
        } catch {
          setPrintNotice('Could not copy automatically. Try downloading the printable sheet.');
        }
      };

      const jumpToGroceryList = () => {
        setActiveTab('kitchen');
        setTimeout(() => {
          const el = document.getElementById('master-grocery-list');
          if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }, 80);
      };

      const toggleHomeMeal = (mealKey) => {
        setCheckedHomeMeals(prev => ({ ...prev, [mealKey]: !prev[mealKey] }));
      };

      const toggleDailyPriority = (id) => {
        setDailyPriorities(prev => prev.map(p => p.id === id ? { ...p, done: !p.done } : p));
      };

      const addDailyPriority = (text) => {
        setDailyPriorities(prev => [
          ...prev,
          { id: 'dp_' + Math.random().toString(36).substring(2, 9), text, done: false }
        ]);
      };

      const deleteDailyPriority = (id) => {
        setDailyPriorities(prev => prev.filter(p => p.id !== id));
      };

      const toggleRoomTask = (taskId) => {
        setRoomTasks(prev => prev.map(t => t.id === taskId ? { ...t, done: !t.done } : t));
      };

      const deleteRoom = (id) => {
        const updated = myRooms.filter(r => r.id !== id);
        setMyRooms(updated);
        setRoomTasks(generateDefaultRoomTasksArray(updated));
      };

      const saveRoom = (roomData) => {
        const updated = roomData.id
          ? myRooms.map(r => r.id === roomData.id ? roomData : r)
          : [...myRooms, { ...roomData, id: 'rm_' + Math.random().toString(36).substring(2, 9) }];
        setMyRooms(updated);
        setRoomTasks(generateDefaultRoomTasksArray(updated));
        setIsRoomModalOpen(false);
      };

      // Loading screen while checking existing session
      if (!authChecked) {
        return (
          <div className="min-h-screen bg-[#fdfbf7] flex flex-col items-center justify-center p-6 text-center">
            <p className="font-cormorant text-3xl tracking-[0.22em] text-[#4a4238]">HONEYSUCKLE &amp; CO.</p>
            <p className="font-lora text-sm text-[#798771] mt-2">Loading your household...</p>
          </div>
        );
      }

      if (!currentUser) {
        return <LandingPage onAuthSuccess={(u) => setCurrentUser(u)} />;
      }

      // -----------------------------------------------------------------------
      // SUB-VIEWS
      // -----------------------------------------------------------------------
      const renderHomeTab = () => {
        const todayFormatted = new Date().toLocaleDateString('en-US', {
          weekday: 'long',
          month: 'long',
          day: 'numeric'
        });

        const dayPlan = weeklyPlan[homeDay] || {};
        const todaysMeals = [];
        if (includeBreakfast && dayPlan.breakfast) {
          const r = getRecipe(dayPlan.breakfast);
          if (r) todaysMeals.push({ slot: 'Breakfast', key: `${homeDay}_breakfast`, recipe: r });
        }
        if (includeLunch && dayPlan.lunch) {
          const r = getRecipe(dayPlan.lunch);
          if (r) todaysMeals.push({ slot: 'Lunch', key: `${homeDay}_lunch`, recipe: r });
        }
        if (dayPlan.dinner) {
          const r = getRecipe(dayPlan.dinner);
          if (r) todaysMeals.push({ slot: 'Dinner', key: `${homeDay}_dinner`, recipe: r });
        }

        const tomorrowName = getTomorrowWeekdayName(homeDay);
        const tomorrowPlan = weeklyPlan[tomorrowName] || {};
        const tomorrowDinner = tomorrowPlan.dinner ? getRecipe(tomorrowPlan.dinner) : null;
        const tomorrowMeats = tomorrowDinner
          ? tomorrowDinner.ingredients.filter(ing => categorizeIngredient(ing.name) === 'Meats & Seafood')
          : [];
        const thawReminderKey = `${homeDay}_thaw_reminder`;
        const isThawDone = !!checkedHomeMeals[thawReminderKey];

        const dailyResetTasks = roomTasks.filter(t => t.tier === 'daily');
        const dailyByRoom = dailyResetTasks.reduce((acc, t) => {
          if (!acc[t.roomName]) acc[t.roomName] = [];
          acc[t.roomName].push(t);
          return acc;
        }, {});

        const weeklyZoneTasks = roomTasks.filter(t => t.tier === 'weekly' && t.weeklyDay === homeDay);
        const weeklyZoneRooms = Array.from(new Set(weeklyZoneTasks.map(t => t.roomName)));

        const mealsDone = todaysMeals.filter(m => checkedHomeMeals[m.key]).length;
        const dailyDone = dailyResetTasks.filter(t => t.done).length;
        const zoneDone = weeklyZoneTasks.filter(t => t.done).length;
        const prioritiesDone = dailyPriorities.filter(p => p.done).length;

        const totalTodayItems = todaysMeals.length + dailyResetTasks.length + weeklyZoneTasks.length + dailyPriorities.length;
        const completedTodayItems = mealsDone + dailyDone + zoneDone + prioritiesDone;
        const progressPct = totalTodayItems > 0 ? Math.round((completedTodayItems / totalTodayItems) * 100) : 0;

        const totalGroceryCount = groceryData.flatItems.length;
        const checkedGroceryCount = groceryData.flatItems.filter(i => checkedGroceryKeys[i.key]).length;
        const remainingGroceryCount = Math.max(0, totalGroceryCount - checkedGroceryCount);

        return (
          <div className="space-y-10">
            {/* Welcome & Progress Command Banner */}
            <div className="bg-white border border-[#4a4238]/10 rounded-2xl p-6 md:p-8 shadow-sm">
              <div className="flex flex-col lg:flex-row lg:items-center justify-between gap-6">
                <div>
                  <span className="text-xs font-lora font-bold text-[#798771] uppercase tracking-[0.2em] flex items-center gap-2 mb-2">
                    <Sun size={15} /> {todayFormatted}
                  </span>
                  <h2 className="font-playfair text-3xl md:text-4xl italic text-[#4a4238] mb-2">
                    Today&apos;s Command Center
                  </h2>
                  <p className="font-lora text-sm md:text-base text-[#4a4238]/70 max-w-xl">
                    Returning to what&apos;s real: home, food, &amp; faith. Everything you need for {homeDay} is gathered in one calm checklist below.
                  </p>
                </div>

                <div className="bg-[#fdfbf7] border border-[#4a4238]/10 rounded-xl p-5 min-w-[250px] space-y-3">
                  <div className="flex items-center justify-between font-lora text-sm">
                    <span className="text-[#4a4238]/70 font-medium">Daily Rhythm Progress</span>
                    <span className="font-bold text-[#798771]">{progressPct}%</span>
                  </div>
                  <div className="w-full h-2 bg-[#4a4238]/10 rounded-full overflow-hidden">
                    <div
                      className="h-full bg-[#798771] rounded-full transition-all duration-500"
                      style={{ width: `${progressPct}%` }}
                    />
                  </div>
                  <p className="font-lora text-xs text-[#4a4238]/60">
                    {completedTodayItems} of {totalTodayItems} tasks completed for {homeDay}
                  </p>
                </div>
              </div>

              {/* Day Switcher & Quick Links */}
              <div className="mt-6 pt-5 border-t border-[#4a4238]/10 flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div className="flex items-center gap-1.5 flex-wrap">
                  <span className="font-lora text-xs uppercase tracking-wider font-bold text-[#4a4238]/50 mr-2">
                    Viewing Day:
                  </span>
                  {WEEKDAY_ORDER.map(day => (
                    <button
                      key={day}
                      type="button"
                      onClick={() => setHomeDay(day)}
                      className={`px-3 py-1.5 rounded-full text-xs font-lora font-bold transition-colors border ${
                        homeDay === day
                          ? 'bg-[#798771] text-white border-[#798771]'
                          : 'bg-[#fdfbf7] text-[#4a4238]/70 border-[#4a4238]/15 hover:border-[#798771]'
                      }`}
                    >
                      {day.slice(0, 3)}
                    </button>
                  ))}
                </div>

                <div className="flex flex-wrap gap-2">
                  <button
                    type="button"
                    onClick={jumpToGroceryList}
                    className="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-[#798771]/10 text-[#798771] border border-[#798771]/25 font-lora text-xs font-bold uppercase tracking-wider hover:bg-[#798771] hover:text-white transition-colors"
                  >
                    <ShoppingCart size={14} /> Grocery List ({remainingGroceryCount} left)
                  </button>
                  <button
                    type="button"
                    onClick={() => setActiveTab('kitchen')}
                    className="inline-flex items-center gap-1.5 px-4 py-2 rounded-full bg-[#fdfbf7] text-[#4a4238] border border-[#4a4238]/15 font-lora text-xs font-bold uppercase tracking-wider hover:border-[#798771] transition-colors"
                  >
                    Meal Planner <ArrowRight size={13} />
                  </button>
                </div>
              </div>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
              {/* Category 1: Daily Meal Plan + Next-Day Freezer Reminder */}
              <div className="bg-white border border-[#4a4238]/10 rounded-2xl p-6 shadow-sm flex flex-col">
                <div className="flex items-start justify-between gap-4 border-b border-[#4a4238]/10 pb-4 mb-5">
                  <div>
                    <span className="text-xs font-lora font-bold text-[#798771] uppercase tracking-widest block mb-1">Category 1 • Kitchen &amp; Table</span>
                    <h3 className="font-playfair text-2xl text-[#4a4238] flex items-center gap-2">
                      <Utensils size={20} className="text-[#798771]" /> {homeDay}&apos;s Daily Meal Plan
                    </h3>
                  </div>
                  <span className="text-xs font-lora font-bold text-[#4a4238]/60 bg-[#fdfbf7] px-3 py-1 rounded-full border border-[#4a4238]/10">
                    {mealsDone}/{todaysMeals.length}
                  </span>
                </div>

                {todaysMeals.length === 0 ? (
                  <div className="bg-[#fdfbf7] border border-dashed border-[#4a4238]/20 rounded-xl p-6 text-center space-y-3">
                    <p className="font-lora text-sm text-[#4a4238]/70">No meals are assigned to {homeDay} yet.</p>
                    <button onClick={() => setActiveTab('kitchen')} className="inline-flex items-center gap-1.5 text-xs font-lora font-bold uppercase tracking-wider text-[#798771] hover:underline">
                      Plan {homeDay}&apos;s Menu <ArrowRight size={13} />
                    </button>
                  </div>
                ) : (
                  <ul className="space-y-3 flex-1">
                    {todaysMeals.map(meal => {
                      const isDone = !!checkedHomeMeals[meal.key];
                      return (
                        <li key={meal.key} className="bg-[#fdfbf7] border border-[#4a4238]/10 rounded-xl p-4 flex items-start justify-between gap-3">
                          <button type="button" onClick={() => toggleHomeMeal(meal.key)} className="flex items-start gap-3 text-left flex-1 group">
                            <CheckCircle size={19} className={`mt-0.5 shrink-0 transition-colors ${isDone ? 'text-[#798771]' : 'text-[#4a4238]/25 group-hover:text-[#798771]/70'}`} />
                            <div>
                              <span className="text-[11px] font-lora font-bold uppercase tracking-wider text-[#798771] block">
                                {meal.slot} • Prep {meal.recipe.prepTime} • Cook {meal.recipe.cookTime}
                              </span>
                              <span className={`font-playfair text-lg leading-snug block ${isDone ? 'line-through text-[#4a4238]/40' : 'text-[#4a4238]'}`}>
                                {meal.recipe.name}
                              </span>
                              <span className="font-lora text-xs text-[#4a4238]/55">
                                Scaled for {totalMultiplier.toFixed(1)} adult portions
                              </span>
                            </div>
                          </button>
                          <button type="button" onClick={() => setSelectedRecipe(meal.recipe)} className="shrink-0 px-3 py-1.5 rounded-full bg-white border border-[#798771]/30 text-[#798771] font-lora text-xs font-bold hover:bg-[#798771] hover:text-white transition-colors">
                            Recipe
                          </button>
                        </li>
                      );
                    })}
                  </ul>
                )}

                {/* Next-Day Meal & Freezer Thaw Notification */}
                <div className="mt-5 bg-[#798771]/10 border border-[#798771]/25 rounded-xl p-4 space-y-2.5">
                  <div className="flex items-start justify-between gap-3">
                    <div>
                      <span className="text-[11px] font-lora font-bold uppercase tracking-widest text-[#798771] block">
                        Tomorrow&apos;s Dinner &amp; Freezer Reminder ({tomorrowName})
                      </span>
                      <p className="font-playfair text-base text-[#4a4238] font-medium mt-0.5">
                        {tomorrowDinner ? tomorrowDinner.name : `No dinner planned for ${tomorrowName} yet.`}
                      </p>
                    </div>
                    {tomorrowDinner && (
                      <button
                        type="button"
                        onClick={() => setSelectedRecipe(tomorrowDinner)}
                        className="shrink-0 font-lora text-xs font-bold text-[#798771] hover:underline"
                      >
                        Preview
                      </button>
                    )}
                  </div>

                  {tomorrowDinner && tomorrowMeats.length > 0 && (
                    <button
                      type="button"
                      onClick={() => toggleHomeMeal(thawReminderKey)}
                      className="w-full text-left flex items-start gap-2.5 bg-white/80 border border-[#798771]/20 rounded-lg px-3 py-2 group"
                    >
                      <CheckCircle
                        size={16}
                        className={`mt-0.5 shrink-0 transition-colors ${
                          isThawDone ? 'text-[#798771]' : 'text-[#4a4238]/30 group-hover:text-[#798771]'
                        }`}
                      />
                      <span className={`font-lora text-xs leading-relaxed ${isThawDone ? 'line-through text-[#4a4238]/45' : 'text-[#4a4238]/90'}`}>
                        <strong>Pull from freezer tonight:</strong>{' '}
                        {tomorrowMeats
                          .map(m => `${formatScaledQty(m.qty * totalMultiplier)} ${m.unit} ${m.name}`)
                          .join(', ')}
                      </span>
                    </button>
                  )}

                  {tomorrowDinner && tomorrowMeats.length === 0 && (
                    <p className="font-lora text-xs text-[#4a4238]/70 italic">
                      No frozen meat needed for tomorrow&apos;s dinner—just check pantry staples ahead of time.
                    </p>
                  )}
                </div>

                <div className="mt-4 pt-3 border-t border-[#4a4238]/10 flex items-center justify-between gap-3">
                  <button onClick={() => setActiveTab('kitchen')} className="font-lora text-xs font-bold text-[#4a4238]/65 hover:text-[#798771] transition-colors">
                    Edit Weekly Menu
                  </button>
                  <button onClick={jumpToGroceryList} className="shrink-0 font-lora text-xs font-bold text-[#798771] hover:underline flex items-center gap-1">
                    Open Grocery List <ArrowRight size={13} />
                  </button>
                </div>
              </div>

              {/* Category 2 */}
              <div className="bg-white border border-[#4a4238]/10 rounded-2xl p-6 shadow-sm flex flex-col">
                <div className="flex items-start justify-between gap-4 border-b border-[#4a4238]/10 pb-4 mb-5">
                  <div>
                    <span className="text-xs font-lora font-bold text-[#798771] uppercase tracking-widest block mb-1">Category 2 • Weekly Focus Zone</span>
                    <h3 className="font-playfair text-2xl text-[#4a4238] flex items-center gap-2">
                      <Sparkles size={20} className="text-[#798771]" />
                      {weeklyZoneRooms.length > 0 ? weeklyZoneRooms.join(' & ') : `${homeDay} Rest & Margin`}
                    </h3>
                  </div>
                  <span className="text-xs font-lora font-bold text-[#4a4238]/60 bg-[#fdfbf7] px-3 py-1 rounded-full border border-[#4a4238]/10">
                    {zoneDone}/{weeklyZoneTasks.length}
                  </span>
                </div>

                {weeklyZoneTasks.length === 0 ? (
                  <div className="bg-[#fdfbf7] border border-dashed border-[#4a4238]/20 rounded-xl p-6 text-center flex-1 flex flex-col items-center justify-center space-y-2">
                    <p className="font-playfair text-lg text-[#4a4238]">No heavy cleaning zone scheduled for {homeDay}.</p>
                    <p className="font-lora text-sm text-[#4a4238]/65 max-w-sm">Enjoy the open margin for rest, hospitality, meal prep, or catching up at your own pace.</p>
                  </div>
                ) : (
                  <ul className="space-y-3 flex-1">
                    {weeklyZoneTasks.map(task => (
                      <li key={task.id} className="bg-[#fdfbf7] border border-[#4a4238]/10 rounded-xl p-3.5">
                        <button type="button" onClick={() => toggleRoomTask(task.id)} className="w-full text-left flex items-start gap-3 group">
                          <CheckCircle size={18} className={`mt-0.5 shrink-0 transition-colors ${task.done ? 'text-[#798771]' : 'text-[#4a4238]/25 group-hover:text-[#798771]/70'}`} />
                          <div>
                            <span className="text-[11px] font-lora font-bold uppercase tracking-wider text-[#798771] block">{task.roomName}</span>
                            <span className={`font-lora text-sm leading-relaxed ${task.done ? 'line-through text-[#4a4238]/40' : 'text-[#4a4238]/90'}`}>{task.text}</span>
                          </div>
                        </button>
                      </li>
                    ))}
                  </ul>
                )}

                <div className="mt-5 pt-4 border-t border-[#4a4238]/10 flex justify-end">
                  <button onClick={() => { setActiveTaskTier('weekly'); setActiveTab('room'); }} className="font-lora text-xs font-bold text-[#798771] hover:underline flex items-center gap-1">
                    Manage Rooms &amp; Zones <ArrowRight size={13} />
                  </button>
                </div>
              </div>

              {/* Category 3 */}
              <div className="bg-white border border-[#4a4238]/10 rounded-2xl p-6 shadow-sm flex flex-col">
                <div className="flex items-start justify-between gap-4 border-b border-[#4a4238]/10 pb-4 mb-5">
                  <div>
                    <span className="text-xs font-lora font-bold text-[#798771] uppercase tracking-widest block mb-1">Category 3 • Daily Home Reset</span>
                    <h3 className="font-playfair text-2xl text-[#4a4238] flex items-center gap-2">
                      <HomeIcon size={20} className="text-[#798771]" /> Room-by-Room Essentials
                    </h3>
                  </div>
                  <span className="text-xs font-lora font-bold text-[#4a4238]/60 bg-[#fdfbf7] px-3 py-1 rounded-full border border-[#4a4238]/10">
                    {dailyDone}/{dailyResetTasks.length}
                  </span>
                </div>

                <div className="space-y-5 max-h-[420px] overflow-y-auto pr-1 flex-1">
                  {Object.entries(dailyByRoom).map(([roomName, tasks]) => (
                    <div key={roomName} className="space-y-2">
                      <h4 className="font-lora text-xs font-bold uppercase tracking-widest text-[#798771] border-b border-[#4a4238]/10 pb-1">{roomName}</h4>
                      <ul className="space-y-2">
                        {tasks.map(task => (
                          <li key={task.id}>
                            <button type="button" onClick={() => toggleRoomTask(task.id)} className="w-full text-left flex items-start gap-3 py-1 group">
                              <CheckCircle size={17} className={`mt-0.5 shrink-0 transition-colors ${task.done ? 'text-[#798771]' : 'text-[#4a4238]/25 group-hover:text-[#798771]/70'}`} />
                              <span className={`font-lora text-sm leading-relaxed ${task.done ? 'line-through text-[#4a4238]/40' : 'text-[#4a4238]/90'}`}>{task.text}</span>
                            </button>
                          </li>
                        ))}
                      </ul>
                    </div>
                  ))}
                </div>

                <div className="mt-5 pt-4 border-t border-[#4a4238]/10 flex justify-end">
                  <button onClick={() => { setActiveTaskTier('daily'); setActiveTab('room'); }} className="font-lora text-xs font-bold text-[#798771] hover:underline flex items-center gap-1">
                    Open Full Room Auto-Pilot <ArrowRight size={13} />
                  </button>
                </div>
              </div>

              {/* Category 4 */}
              <div className="bg-white border border-[#4a4238]/10 rounded-2xl p-6 shadow-sm flex flex-col">
                <div className="flex items-start justify-between gap-4 border-b border-[#4a4238]/10 pb-4 mb-5">
                  <div>
                    <span className="text-xs font-lora font-bold text-[#798771] uppercase tracking-widest block mb-1">Category 4 • Personal &amp; Errands</span>
                    <h3 className="font-playfair text-2xl text-[#4a4238] flex items-center gap-2">
                      <ListTodo size={20} className="text-[#798771]" /> Today&apos;s Priorities
                    </h3>
                  </div>
                  <span className="text-xs font-lora font-bold text-[#4a4238]/60 bg-[#fdfbf7] px-3 py-1 rounded-full border border-[#4a4238]/10">
                    {prioritiesDone}/{dailyPriorities.length}
                  </span>
                </div>

                <ul className="space-y-3 flex-1 mb-5">
                  {dailyPriorities.length === 0 ? (
                    <li className="bg-[#fdfbf7] border border-dashed border-[#4a4238]/20 rounded-xl p-5 text-center font-lora text-sm text-[#4a4238]/60">
                      Add your top priorities or errands for today below.
                    </li>
                  ) : (
                    dailyPriorities.map(item => (
                      <li key={item.id} className="bg-[#fdfbf7] border border-[#4a4238]/10 rounded-xl px-4 py-3 flex items-center justify-between gap-3">
                        <button type="button" onClick={() => toggleDailyPriority(item.id)} className="flex items-start gap-3 text-left flex-1 group">
                          <CheckCircle size={18} className={`mt-0.5 shrink-0 transition-colors ${item.done ? 'text-[#798771]' : 'text-[#4a4238]/25 group-hover:text-[#798771]/70'}`} />
                          <span className={`font-lora text-sm leading-relaxed ${item.done ? 'line-through text-[#4a4238]/40' : 'text-[#4a4238]/90'}`}>{item.text}</span>
                        </button>
                        <button type="button" onClick={() => deleteDailyPriority(item.id)} className="p-1.5 text-[#4a4238]/35 hover:text-red-700 rounded-full transition-colors">
                          <Trash2 size={14} />
                        </button>
                      </li>
                    ))
                  )}
                </ul>

                <div className="pt-4 border-t border-[#4a4238]/10">
                  <QuickAddForm placeholder="Add a priority, errand, or reminder for today..." buttonLabel="Add Task" onAdd={addDailyPriority} />
                </div>
              </div>
            </div>
          </div>
        );
      };

      const renderKitchenTab = () => {
        const totalItems = groceryData.flatItems.length;
        const checkedCount = groceryData.flatItems.filter(item => checkedGroceryKeys[item.key]).length;

        return (
          <div className="space-y-8">
            <div className="text-center max-w-3xl mx-auto">
              <h2 className="font-playfair text-4xl italic text-[#4a4238] mb-4">Scratch Kitchen &amp; Meal Planner</h2>
              <p className="font-lora text-[#798771] leading-relaxed">
                Wholesome, 1800s-inspired meals that scale automatically to fit your exact family size.
              </p>
            </div>

            <div className="bg-white border border-[#4a4238]/10 rounded-2xl p-6 shadow-sm">
              <h3 className="font-playfair text-2xl text-[#4a4238] mb-4 border-b border-[#4a4238]/10 pb-3 flex items-center justify-between flex-wrap gap-2">
                <span>Family Portion Calculator</span>
                <span className="text-sm font-lora font-normal bg-[#798771]/10 text-[#798771] px-4 py-1 rounded-full border border-[#798771]/20">
                  Total Multiplier: <strong>{totalMultiplier.toFixed(1)}x</strong>
                </span>
              </h3>
              <div className="grid grid-cols-2 md:grid-cols-4 gap-6 font-lora">
                {[
                  { label: 'Adults (100%)', val: adults, set: setAdults },
                  { label: 'Kids 6-12 (65%)', val: kids, set: setKids },
                  { label: 'Toddlers (50%)', val: toddlers, set: setToddlers },
                  { label: 'Babies (0%)', val: babies, set: setBabies }
                ].map((group, idx) => (
                  <div key={idx} className="flex flex-col items-center">
                    <span className="text-[#4a4238]/70 text-sm mb-2">{group.label}</span>
                    <div className="flex items-center gap-4 bg-[#fdfbf7] border border-[#4a4238]/10 rounded-full px-2 py-1">
                      <button onClick={() => group.set(Math.max(0, group.val - 1))} className="w-8 h-8 flex items-center justify-center rounded-full hover:bg-white text-[#4a4238]">-</button>
                      <span className="w-4 text-center font-bold text-[#4a4238]">{group.val}</span>
                      <button onClick={() => group.set(group.val + 1)} className="w-8 h-8 flex items-center justify-center rounded-full hover:bg-white text-[#4a4238]">+</button>
                    </div>
                  </div>
                ))}
              </div>
            </div>

            <div className="bg-white border border-[#4a4238]/10 rounded-2xl p-6 shadow-sm">
              <div className="flex flex-col md:flex-row justify-between items-center border-b border-[#4a4238]/10 pb-4 mb-6 gap-4">
                <h3 className="font-playfair text-2xl text-[#4a4238] flex items-center gap-2">
                  <Calendar className="text-[#798771]" /> This Week&apos;s Table
                </h3>
                <div className="flex flex-wrap items-center gap-4 font-lora text-sm">
                  <label className="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" checked={includeBreakfast} onChange={e => setIncludeBreakfast(e.target.checked)} className="accent-[#798771]" />
                    Include Breakfast
                  </label>
                  <label className="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" checked={includeLunch} onChange={e => setIncludeLunch(e.target.checked)} className="accent-[#798771]" />
                    Include Lunch
                  </label>
                  <button
                    type="button"
                    onClick={() => document.getElementById('master-grocery-list')?.scrollIntoView({ behavior: 'smooth', block: 'start' })}
                    className="inline-flex items-center gap-1.5 bg-[#798771]/10 text-[#798771] border border-[#798771]/25 px-3.5 py-1.5 rounded-full text-xs font-bold uppercase tracking-wider hover:bg-[#798771] hover:text-white transition-colors"
                  >
                    <ShoppingCart size={14} /> Grocery List ({totalItems})
                  </button>
                </div>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-7 gap-4">
                {WEEKDAY_ORDER.map(day => (
                  <div key={day} className="bg-[#fdfbf7] rounded-xl border border-[#4a4238]/10 p-4 flex flex-col gap-3">
                    <h4 className="font-lora font-bold text-center text-[#4a4238] border-b border-[#4a4238]/5 pb-2">{day}</h4>

                    {includeBreakfast && (
                      <div className="text-sm">
                        <span className="text-xs text-[#798771] font-bold uppercase tracking-wider block mb-1">Breakfast</span>
                        <div className="relative">
                          <select
                            className="w-full appearance-none bg-white border border-[#4a4238]/20 rounded-md py-1.5 pl-2 pr-6 font-lora text-[#4a4238] text-xs focus:outline-none focus:border-[#798771] truncate"
                            value={weeklyPlan[day]?.breakfast || ''}
                            onChange={(e) => updateMeal(day, 'breakfast', e.target.value)}
                          >
                            <option value="">- Select -</option>
                            {['Breakfast', 'Drink', 'Snack', 'Functional Nutrition'].map(cat => {
                              const items = RECIPE_VAULT.filter(r => r.category === cat);
                              if (!items.length) return null;
                              return (
                                <optgroup key={cat} label={cat}>
                                  {items.map(r => <option key={r.id} value={r.id}>{r.name}</option>)}
                                </optgroup>
                              );
                            })}
                          </select>
                          <ChevronDown size={14} className="absolute right-2 top-2 text-[#4a4238]/50 pointer-events-none" />
                        </div>
                        {weeklyPlan[day]?.breakfast && (
                          <button onClick={() => setSelectedRecipe(getRecipe(weeklyPlan[day].breakfast))} className="mt-1 text-xs text-[#798771] hover:underline font-lora w-full text-left">View Recipe</button>
                        )}
                      </div>
                    )}

                    {includeLunch && (
                      <div className="text-sm border-t border-[#4a4238]/5 pt-2">
                        <span className="text-xs text-[#798771] font-bold uppercase tracking-wider block mb-1">Lunch</span>
                        <div className="relative">
                          <select
                            className="w-full appearance-none bg-white border border-[#4a4238]/20 rounded-md py-1.5 pl-2 pr-6 font-lora text-[#4a4238] text-xs focus:outline-none focus:border-[#798771] truncate"
                            value={weeklyPlan[day]?.lunch || ''}
                            onChange={(e) => updateMeal(day, 'lunch', e.target.value)}
                          >
                            <option value="">- Select -</option>
                            {['Lunch', 'Snack', 'Drink', 'Functional Nutrition'].map(cat => {
                              const items = RECIPE_VAULT.filter(r => r.category === cat);
                              if (!items.length) return null;
                              return (
                                <optgroup key={cat} label={cat}>

                      {weeklyPlan[day]?.dinner && (
                        <button onClick={() => setSelectedRecipe(getRecipe(weeklyPlan[day].dinner))} className="mt-2 w-full bg-[#798771] text-white py-1.5 rounded-md font-lora text-xs hover:bg-[#6b7764] transition-colors">

            {/* Master Family Grocery List */}

                  </h3>
                  <p className="font-lora text-sm text-[#4a4238]/70 mt-1">

                      <div key={aisle} className="bg-[#fdfbf7] border border-[#4a4238]/10 rounded-xl p-5 flex flex-col">

                          <span className="font-lora text-xs font-bold text-[#798771] bg-white px-2.5 py-0.5 rounded-full border border-[#4a4238]/10">

                          </span>

        const cleanerFilters = ['All', 'Kitchen & Counters', 'Bathrooms & Sinks', 'Bathrooms & Windows', 'Laundry Room', 'Dining & Living Room', 'Bedrooms & Nursery', 'Hallways & Floors'];

          <div className="space-y-8">

              <button onClick={() => setSwapsView('guide')} className={`font-playfair text-2xl pb-2 transition-all ${swapsView === 'guide' ? 'text-[#798771] border-b-2 border-[#798771]' : 'text-[#4a4238]/50 hover:text-[#4a4238]'}`}>
                Ditch &amp; Swap Guide
              </button>
              <button onClick={() => setSwapsView('recipes')} className={`font-playfair text-2xl pb-2 transition-all ${swapsView === 'recipes' ? 'text-[#798771] border-b-2 border-[#798771]' : 'text-[#4a4238]/50 hover:text-[#4a4238]'}`}>
                DIY Cleaning Recipes
              </button>
            </div>

              <>
                <div className="flex flex-col md:flex-row md:items-end justify-between gap-6">
                  <div>
                    <h2 className="font-playfair text-3xl italic text-[#4a4238] mb-2">Household Toxins to Ditch</h2>

                  </div>
                  <div className="flex flex-wrap gap-2">
                    {swapFilters.map(f => (
                      <button key={f} onClick={() => setActiveSwapsFilter(f)} className={`px-4 py-2 rounded-full text-xs font-bold tracking-wider font-lora border transition-colors ${activeSwapsFilter === f ? 'bg-[#798771] text-white border-[#798771]' : 'bg-transparent text-[#4a4238] border-[#4a4238]/20 hover:border-[#798771]'}`}>
                        {f}
                      </button>
                    ))}
                  </div>
                </div>
                <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
                  {filteredSwaps.map((item) => (
                    <div key={item.id} className="bg-white border border-[#4a4238]/10 rounded-xl p-6 shadow-sm hover:shadow-md transition-shadow flex flex-col h-full">
                      <span className="text-xs font-lora font-bold text-[#798771] uppercase tracking-widest mb-2 block">{item.category}</span>
                      <div className="mb-4">
                        <h4 className="font-lora font-bold text-[#4a4238] mb-1 line-through decoration-[#4a4238]/30">Ditch: {item.ditch}</h4>
                        <p className="font-lora text-sm text-[#4a4238]/70 italic">&ldquo;{item.why}&rdquo;</p>

                      <div className="mt-auto bg-[#798771]/10 p-4 rounded-lg border border-[#798771]/20">
                        <h4 className="font-lora font-bold text-[#798771] flex items-center gap-2 mb-1"><Sparkles size={16}/> Swap</h4>
                        <p className="font-lora text-sm text-[#4a4238]/90">{item.swap}</p>
                      </div>
                    </div>
                  ))}
                </div>
              </>
            ) : (
              <>
                <div className="flex flex-col md:flex-row md:items-end justify-between gap-6">
                  <div>
                    <h2 className="font-playfair text-3xl italic text-[#4a4238] mb-2">Scratch-Made Cleaning Recipes</h2>
                    <p className="font-lora text-[#798771]">36 natural, 1800s-inspired formulas for a non-toxic home.</p>

                    {cleanerFilters.map(f => (
                      <button key={f} onClick={() => setActiveCleanersFilter(f)} className={`px-3 py-1.5 rounded-full text-xs font-bold tracking-wider font-lora border transition-colors ${activeCleanersFilter === f ? 'bg-[#798771] text-white border-[#798771]' : 'bg-transparent text-[#4a4238] border-[#4a4238]/20 hover:border-[#798771]'}`}>
                        {f}
                      </button>
                    ))}

                </div>
                <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">

                            <p className="font-lora text-sm text-[#798771] mt-3 italic leading-relaxed">

                      </div>

                  })}

          </div>
        );

      const renderApothecaryTab = () => {
        const filters = ['All', ...Array.from(new Set(APOTHECARY_VAULT.map(r => r.category)))];
        const filteredRemedies = activeApothFilter === 'All' ? APOTHECARY_VAULT : APOTHECARY_VAULT.filter(r => r.category === activeApothFilter);

        return (
          <div className="space-y-8">

                <h2 className="font-playfair text-4xl italic text-[#4a4238] mb-3">The Apothecary</h2>

                  <button key={f} onClick={() => setActiveApothFilter(f)} className={`px-4 py-2 rounded-full text-xs font-bold tracking-wider font-lora border transition-colors ${activeApothFilter === f ? 'bg-[#798771] text-white border-[#798771]' : 'bg-transparent text-[#4a4238] border-[#4a4238]/20 hover:border-[#798771]'}`}>
                    {f}
                  </button>
                ))}

                  <span className="text-xs font-lora font-bold text-[#798771] uppercase tracking-widest mb-2 block">{remedy.category}</span>
                  <h3 className="font-playfair text-xl text-[#4a4238] mb-3">{remedy.name}</h3>
                  <p className="font-lora text-sm text-[#4a4238]/70 italic mb-4 flex-grow">&ldquo;{remedy.uses}&rdquo;</p>
                  <div className="mt-auto bg-[#798771]/10 p-4 rounded-lg border border-[#798771]/20">
                    <h4 className="font-lora font-bold text-[#798771] flex items-center gap-2 mb-1">
                      <Leaf size={16} /> Dosing &amp; Application
                    </h4>
                    <p className="font-lora text-sm text-[#4a4238]/90">{remedy.dosing}</p>
                  </div>
                </div>
              ))}
            </div>
          </div>
        );
      };

      const renderRoomAutoPilotTab = () => {
        const tiers = [
          { id: 'daily', label: 'Daily Reset' },
          { id: 'weekly', label: 'Weekly Zone' },
          { id: 'monthly', label: 'Monthly Deep Clean' },
          { id: 'yearly', label: 'Yearly Maintenance' }
        ];

        const tierTasks = roomTasks.filter(t => t.tier === activeTaskTier);
        const groupedByRoom = tierTasks.reduce((acc, task) => {
          if (!acc[task.roomName]) acc[task.roomName] = [];
          acc[task.roomName].push(task);
          return acc;
        }, {});

        const resetCurrentTierCheckmarks = () => {
          setRoomTasks(prev =>
            prev.map(t => (t.tier === activeTaskTier ? { ...t, done: false } : t))
          );

        return (
          <div className="space-y-10">
            <div className="text-center max-w-3xl mx-auto">
              <h2 className="font-playfair text-4xl italic text-[#4a4238] mb-4">Room-by-Room Auto-Pilot</h2>
              <p className="font-lora text-[#798771] leading-relaxed">
                Customize the rooms in your home and automatically generate peaceful daily, weekly, monthly, and seasonal cleaning rhythms.
              </p>

            {/* Step 1: Home Rooms Profile */}

                            {room.count}x
                          </span>
                          <h4 className="font-playfair text-lg text-[#4a4238] font-medium">{room.name}</h4>
                        </div>
                        <p className="font-lora text-xs text-[#4a4238]/60 mt-1">
                          {room.type} • {room.weeklyDay} Zone
                        </p>
                      </div>
                      <div className="flex items-center gap-1 shrink-0">
                        <button
                          type="button"
                          onClick={() => {
                            setEditingRoom(room);
                            setIsRoomModalOpen(true);
                          }}
                          className="p-2 text-[#4a4238]/60 hover:text-[#798771] hover:bg-white rounded-full transition-colors"
                          aria-label={`Edit ${room.name}`}
                        >
                          <Edit2 size={15} />
                        </button>
                        <button
                          type="button"
                          onClick={() => deleteRoom(room.id)}

                          aria-label={`Delete ${room.name}`}
                        >
                          <Trash2 size={15} />
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>

              <div className="flex flex-col lg:flex-row lg:items-end justify-between gap-4 border-b border-[#4a4238]/10 pb-5">
                <div>
                  <span className="text-xs font-lora font-bold text-[#798771] uppercase tracking-widest block mb-1">Step 2 • Automated Checklists</span>
                  <h3 className="font-playfair text-2xl text-[#4a4238] flex items-center gap-2">
                    <ListTodo size={22} className="text-[#798771]" /> Household Rhythm Organizer
                  </h3>
                  <p className="font-lora text-sm text-[#4a4238]/70 mt-1">

                  </p>

                <div className="flex flex-wrap items-center gap-2">
                  {tiers.map(tier => (
                    <button
                      key={tier.id}
                      type="button"
                      onClick={() => setActiveTaskTier(tier.id)}
                      className={`px-4 py-2 rounded-full text-xs font-bold tracking-wider font-lora border transition-colors ${
                        activeTaskTier === tier.id
                          ? 'bg-[#798771] text-white border-[#798771]'

                    >
                      {tier.label}

                  <button

                    Reset Checkmarks
                  </button>
                </div>
              </div>
